<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>우리의 책장</title>

  <style>
    :root {
      --cream: #f7f3e9;
      --paper: #fffdf7;
      --green: #0e4b37;
      --green-dark: #093d2c;
      --ink: #20241f;
      --muted: #6f7068;
      --yellow: #e9b936;
      --coral: #d97968;
      --beige: #ead9b4;
      --line: rgba(20, 50, 38, .18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ebe8e0;
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255,255,255,.55),
          transparent 34%
        ),
        var(--cream);
    }


    /* --------------------
       상단
    -------------------- */

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 36px 32px 0;
    }

    .mini-brand {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -.7px;
    }

    .marks {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .yellow-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--yellow);
    }

    .green-square {
      width: 18px;
      height: 18px;
      background: var(--green);
    }


    /* --------------------
       타이틀
    -------------------- */

    .hero {
      padding: 94px 37px 0;
    }

    .title {
      margin: 0;
      color: var(--green);
      font-size: clamp(63px, 17vw, 88px);
      font-weight: 950;
      line-height: .87;
      letter-spacing: -7px;
    }

    .title span {
      display: block;
    }

    .archive {
      margin-top: 45px;
      color: var(--green);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .description {
      margin: 17px 0 0;
      color: #585b54;
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: -.3px;
    }


    /* --------------------
       일러스트
    -------------------- */

    .illustration {
      position: relative;
      height: 365px;
      margin: 27px 29px 0;
    }


    /* 위 선반 */

    .upper-shelf {
      position: absolute;
      left: 0;
      right: 0;
      top: 180px;
      height: 18px;
      border-radius: 20px;
      background: var(--green);
      z-index: 10;
    }


    /* 아래 선반 */

    .lower-shelf {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 26px;
      height: 18px;
      border-radius: 20px;
      background: var(--green);
      z-index: 10;
    }


    /* 다리 */

    .leg-left,
    .leg-right {
      position: absolute;
      top: 194px;
      width: 15px;
      height: 144px;
      background: #d7b981;
    }

    .leg-left {
      left: 15px;
    }

    .leg-right {
      right: 15px;
    }


    /* 식물 */

    .plant {
      position: absolute;
      left: 24px;
      top: 69px;
      width: 93px;
      height: 112px;
      z-index: 4;
    }

    .pot {
      position: absolute;
      left: 19px;
      bottom: 0;
      width: 61px;
      height: 65px;
      border-radius: 45% 45% 40% 40%;
      background: #ecdfbf;
    }

    .stem {
      position: absolute;
      left: 48px;
      top: 20px;
      width: 4px;
      height: 55px;
      transform: rotate(-3deg);
      border-radius: 5px;
      background: var(--green);
    }

    .leaf {
      position: absolute;
      width: 34px;
      height: 19px;
      background: var(--green);
    }

    .leaf1 {
      left: 44px;
      top: 8px;
      transform: rotate(-48deg);
      border-radius: 100% 0 100% 0;
    }

    .leaf2 {
      left: 17px;
      top: 25px;
      transform: rotate(43deg);
      border-radius: 0 100% 0 100%;
    }

    .leaf3 {
      left: 47px;
      top: 42px;
      transform: rotate(-24deg);
      border-radius: 100% 0 100% 0;
    }


    /* 책 */

    .book {
      position: absolute;
      bottom: 185px;
      border-radius: 3px 3px 0 0;
    }

    .book1 {
      left: 122px;
      width: 29px;
      height: 127px;
      background: var(--green);
    }

    .book2 {
      left: 153px;
      width: 30px;
      height: 116px;
      background: #eee1c0;
      border-left: 1px solid rgba(0,0,0,.12);
    }

    .book3 {
      left: 184px;
      width: 29px;
      height: 127px;
      background: var(--yellow);
    }

    .book4 {
      left: 214px;
      width: 29px;
      height: 111px;
      background: var(--coral);
    }

    .book3::after,
    .book4::after {
      position: absolute;
      left: 3px;
      right: 3px;
      bottom: 15px;
      height: 2px;
      background: rgba(255,255,255,.65);
      content: "";
    }


    /* 액자 */

    .frame {
      position: absolute;
      right: 67px;
      top: 93px;
      width: 84px;
      height: 92px;
      transform: skew(-4deg);
      border: 4px solid var(--green);
      background: #f8f4e8;
      z-index: 3;
    }

    .frame-sun {
      position: absolute;
      top: 26px;
      left: 28px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--yellow);
    }

    .frame-wave {
      position: absolute;
      left: 26px;
      bottom: 15px;
      width: 35px;
      height: 12px;
      border-radius: 0 0 50% 50%;
      background: var(--green);
    }


    /* 노란 원 */

    .decor-circle {
      position: absolute;
      right: 12px;
      top: 143px;
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background: var(--yellow);
    }


    /* 아래쪽 책 */

    .stack {
      position: absolute;
      left: 50%;
      bottom: 39px;
      width: 150px;
      height: 83px;
      transform: translateX(-50%);
      z-index: 6;
    }

    .stack-green {
      position: absolute;
      left: 7px;
      bottom: 0;
      width: 136px;
      height: 39px;
      border-radius: 2px;
      background: var(--green);
    }

    .stack-cream {
      position: absolute;
      left: 20px;
      bottom: 37px;
      width: 110px;
      height: 31px;
      border: 1px solid var(--ink);
      background: #f4ead1;
    }

    .stack-yellow {
      position: absolute;
      left: 30px;
      bottom: 66px;
      width: 91px;
      height: 23px;
      border-radius: 2px;
      background: var(--yellow);
    }


    /* 그릇 */

    .bowl {
      position: absolute;
      left: 40px;
      bottom: 42px;
      width: 70px;
      height: 39px;
      overflow: hidden;
      border-radius: 0 0 60px 60px;
      background: var(--coral);
      z-index: 6;
    }


    /* 램프 */

    .lamp {
      position: absolute;
      right: 37px;
      bottom: 41px;
      width: 74px;
      height: 108px;
      z-index: 6;
    }

    .lamp-shade {
      position: absolute;
      left: 0;
      top: 0;
      width: 74px;
      height: 55px;
      border-radius: 50px 50px 0 0;
      background: #efe1bf;
    }

    .lamp-stem {
      position: absolute;
      left: 34px;
      top: 50px;
      width: 9px;
      height: 47px;
      border-radius: 5px;
      background: var(--coral);
      border: 1px solid var(--green);
    }

    .lamp-base {
      position: absolute;
      left: 17px;
      bottom: 0;
      width: 42px;
      height: 16px;
      border-radius: 30px 30px 5px 5px;
      background: var(--green);
    }

    .lamp-top {
      position: absolute;
      left: 31px;
      top: -7px;
      width: 15px;
      height: 8px;
      border-radius: 10px 10px 0 0;
      background: var(--green);
    }


    /* 그림자 */

    .shadow {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 15px;
      height: 13px;
      border-radius: 50%;
      background: rgba(214,190,142,.3);
    }


    /* --------------------
       사용자 책장
    -------------------- */

    .shelves-section {
      padding: 0 29px 50px;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 18px;
      color: var(--green);
      font-size: 14px;
      font-weight: 950;
      letter-spacing: 3px;
    }

    .section-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--yellow);
    }

    .users {
      overflow: hidden;
      background: var(--green);
    }

    .user-button {
      display: flex;
      width: 100%;
      min-height: 78px;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.15);
      background: transparent;
      color: white;
      text-align: left;
    }

    .user-button:last-child {
      border-bottom: 0;
    }

    .user-name {
      font-size: 17px;
      font-weight: 800;
    }

    .arrow {
      font-size: 30px;
      font-weight: 200;
    }

    .status {
      padding: 25px;
      color: rgba(255,255,255,.72);
      text-align: center;
      font-size: 13px;
    }

    .add-user {
      width: 100%;
      height: 59px;
      margin-top: 12px;
      border: 1px dashed rgba(14,75,55,.45);
      background: transparent;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
    }


    /* --------------------
       모달
    -------------------- */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: rgba(8,39,28,.58);
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 360px;
      padding: 27px;
      background: var(--cream);
      border-top: 8px solid var(--green);
    }

    .modal-mark {
      width: 34px;
      height: 34px;
      margin-bottom: 20px;
      border-radius: 50%;
      background: var(--yellow);
    }

    .modal h2 {
      margin: 0 0 20px;
      color: var(--green);
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .modal input {
      width: 100%;
      height: 53px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      background: var(--paper);
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-actions button {
      height: 50px;
      border: 1px solid var(--green);
      font-weight: 800;
    }

    .cancel {
      background: transparent;
      color: var(--green);
    }

    .confirm {
      background: var(--green);
      color: white;
    }


    @media (max-width: 390px) {

      .hero {
        padding-left: 29px;
        padding-right: 29px;
      }

      .title {
        font-size: 66px;
      }

      .illustration {
        transform: scale(.93);
        transform-origin: center top;
        margin-left: 16px;
        margin-right: 16px;
      }

    }
  </style>
</head>


<body>

<main class="app">

  <!-- 상단 -->

  <header class="top">

    <div class="mini-brand">
      우리의 책장
    </div>

    <div class="marks">
      <span class="yellow-circle"></span>
      <span class="green-square"></span>
    </div>

  </header>


  <!-- 메인 타이틀 -->

  <section class="hero">

    <h1 class="title">
      <span>우리의</span>
      <span>책장</span>
    </h1>

    <div class="archive">
      MONTHLY READING ARCHIVE
    </div>

    <p class="description">
      한 달 동안 읽은 책을 한 권씩 모아보세요.
    </p>

  </section>


  <!-- 책장 일러스트 -->

  <section class="illustration">

    <div class="shadow"></div>

    <div class="plant">
      <div class="stem"></div>
      <div class="leaf leaf1"></div>
      <div class="leaf leaf2"></div>
      <div class="leaf leaf3"></div>
      <div class="pot"></div>
    </div>

    <div class="book book1"></div>
    <div class="book book2"></div>
    <div class="book book3"></div>
    <div class="book book4"></div>

    <div class="frame">
      <div class="frame-sun"></div>
      <div class="frame-wave"></div>
    </div>

    <div class="decor-circle"></div>

    <div class="upper-shelf"></div>

    <div class="leg-left"></div>
    <div class="leg-right"></div>

    <div class="bowl"></div>

    <div class="stack">
      <div class="stack-green"></div>
      <div class="stack-cream"></div>
      <div class="stack-yellow"></div>
    </div>

    <div class="lamp">
      <div class="lamp-top"></div>
      <div class="lamp-shade"></div>
      <div class="lamp-stem"></div>
      <div class="lamp-base"></div>
    </div>

    <div class="lower-shelf"></div>

  </section>


  <!-- 사용자 -->

  <section class="shelves-section">

    <div class="section-label">
      OUR SHELVES
      <span class="section-dot"></span>
    </div>

    <div
      class="users"
      id="users"
    >
      <div class="status">
        불러오는 중…
      </div>
    </div>

    <button
      class="add-user"
      id="openAddUser"
      type="button"
    >
      ＋ 새 사용자 추가
    </button>

  </section>

</main>


<!-- 사용자 추가 팝업 -->

<div
  class="overlay"
  id="userOverlay"
>

  <div class="modal">

    <div class="modal-mark"></div>

    <h2>
      새 사용자
    </h2>

    <input
      id="newUserName"
      type="text"
      maxlength="20"
      placeholder="이름을 입력하세요"
    >

    <div class="modal-actions">

      <button
        class="cancel"
        id="cancelUser"
        type="button"
      >
        취소
      </button>

      <button
        class="confirm"
        id="saveUser"
        type="button"
      >
        추가
      </button>

    </div>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


const usersBox =
  document.getElementById("users");

const userOverlay =
  document.getElementById("userOverlay");

const nameInput =
  document.getElementById("newUserName");


loadUsers();


async function loadUsers() {

  try {

    const response = await fetch(
      API_URL +
      "?action=users&t=" +
      Date.now()
    );

    const data =
      JSON.parse(
        await response.text()
      );

    if (!data.success) {
      throw new Error(
        data.message || "불러오기 실패"
      );
    }

    renderUsers(
      data.users || []
    );

  } catch (error) {

    console.error(error);

    usersBox.innerHTML = `
      <div class="status">
        사용자 정보를 불러오지 못했어요.
      </div>
    `;

  }

}


function renderUsers(users) {

  usersBox.innerHTML = "";

  if (!users.length) {

    usersBox.innerHTML = `
      <div class="status">
        아직 등록된 사용자가 없어요.
      </div>
    `;

    return;
  }

  users.forEach(function(item) {

    const name =
      typeof item === "string"
        ? item
        : item.name;

    if (!name) return;


    const button =
      document.createElement("button");

    button.type = "button";
    button.className = "user-button";


    const nameSpan =
      document.createElement("span");

    nameSpan.className = "user-name";
    nameSpan.textContent =
      name + "의 책장";


    const arrow =
      document.createElement("span");

    arrow.className = "arrow";
    arrow.textContent = "›";


    button.appendChild(nameSpan);
    button.appendChild(arrow);


    button.onclick = function() {

      localStorage.setItem(
        "currentBookUser",
        name
      );

      window.location.href =
        "./shelf.html?user=" +
        encodeURIComponent(name);

    };


    usersBox.appendChild(button);

  });

}


document
  .getElementById("openAddUser")
  .onclick = function() {

    userOverlay.classList.add("show");

    setTimeout(function() {
      nameInput.focus();
    }, 50);

  };


document
  .getElementById("cancelUser")
  .onclick = closeModal;


document
  .getElementById("saveUser")
  .onclick = addUser;


nameInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();
      addUser();

    }

  }
);


userOverlay.onclick =
  function(event) {

    if (event.target === userOverlay) {
      closeModal();
    }

  };


function closeModal() {

  userOverlay.classList.remove("show");

}


async function addUser() {

  const name =
    nameInput.value.trim();

  if (!name) {

    alert("이름을 입력해주세요.");
    return;

  }

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            action: "addUser",
            name: name
          })
        }
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message ||
        "추가 실패"
      );

    }


    nameInput.value = "";

    closeModal();

    await loadUsers();


  } catch (error) {

    console.error(error);

    alert(
      "사용자를 추가하지 못했어요."
    );

  }

}

</script>

</body>
</html>
