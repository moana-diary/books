<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F7F2E6" />

  <title>우리의 책장</title>

  <style>
    /* =========================
       기본 설정
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream: #F7F2E6;
      --green: #084B39;
      --yellow: #EDB62E;
      --coral: #D97C6D;
      --beige: #EEE1C0;
      --light-beige: #F4EBD6;
      --text: #232323;
      --gray: #66635D;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--cream);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Pretendard",
        "Noto Sans KR",
        sans-serif;
      word-break: keep-all;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================
       전체 페이지
    ========================= */

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 28px 80px;
    }


    /* =========================
       상단 헤더
    ========================= */

    .header {
      height: 120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .header-shapes {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shape-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--yellow);
    }

    .shape-square {
      width: 18px;
      height: 18px;
      background: var(--green);
    }


    /* =========================
       메인 타이틀
    ========================= */

    .hero {
      padding-top: 46px;
    }

    .hero-title {
      color: var(--green);
      font-size: clamp(70px, 13vw, 108px);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -7px;
    }

    .hero-title span {
      display: block;
    }

    .hero-description {
      margin-top: 58px;
    }

    .hero-label {
      color: var(--green);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .hero-copy {
      margin-top: 20px;
      color: var(--gray);
      font-size: 18px;
      line-height: 1.7;
      letter-spacing: -0.4px;
    }


    /* =========================
       책장 일러스트
    ========================= */

    .bookshelf-area {
      width: 100%;
      margin: 36px auto 54px;
    }

    .bookshelf-illustration {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }


    /* =========================
       OUR SHELVES
    ========================= */

    .shelves-section {
      margin-top: 10px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 20px;

      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .section-dot {
      width: 12px;
      height: 12px;
      background: var(--yellow);
      border-radius: 50%;
      flex-shrink: 0;
    }


    /* =========================
       책장 카드
    ========================= */

    .shelf-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .shelf-card {
      width: 100%;
      min-height: 88px;
      padding: 0 28px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: var(--green);
      color: #fff;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .shelf-card:active {
      transform: scale(0.985);
      opacity: 0.92;
    }

    .shelf-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .arrow {
      font-size: 37px;
      font-weight: 200;
      line-height: 1;
      transform: translateY(-2px);
    }


    /* =========================
       새 사용자 추가
    ========================= */

    .add-user {
      width: 100%;
      height: 76px;
      margin-top: 12px;

      border: 1.5px dashed rgba(8, 75, 57, 0.3);
      background: transparent;
      color: rgba(8, 75, 57, 0.5);

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }

    .add-user:hover {
      background: rgba(8, 75, 57, 0.035);
    }


    /* =========================
       하단
    ========================= */

    .footer {
      margin-top: 74px;
      padding-top: 30px;
      border-top: 1px solid rgba(8, 75, 57, 0.12);
    }

    .footer-title {
      color: var(--green);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .footer-copy {
      margin-top: 10px;
      color: #8B877E;
      font-size: 13px;
    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 600px) {

      .page {
        padding-left: 28px;
        padding-right: 28px;
        padding-bottom: 60px;
      }

      .header {
        height: 106px;
      }

      .logo {
        font-size: 18px;
      }

      .shape-circle,
      .shape-square {
        width: 16px;
        height: 16px;
      }

      .hero {
        padding-top: 42px;
      }

      .hero-title {
        font-size: 76px;
        letter-spacing: -6px;
      }

      .hero-description {
        margin-top: 51px;
      }

      .hero-label {
        font-size: 15px;
        letter-spacing: 4px;
      }

      .hero-copy {
        margin-top: 17px;
        font-size: 16px;
      }

      .bookshelf-area {
        margin-top: 25px;
        margin-bottom: 42px;
      }

      .section-title {
        font-size: 16px;
        letter-spacing: 3px;
        margin-bottom: 17px;
      }

      .section-dot {
        width: 11px;
        height: 11px;
      }

      .shelf-card {
        min-height: 82px;
        padding: 0 25px;
      }

      .shelf-name {
        font-size: 18px;
      }
    }


    /* =========================
       아주 작은 화면
    ========================= */

    @media (max-width: 380px) {

      .page {
        padding-left: 22px;
        padding-right: 22px;
      }

      .hero-title {
        font-size: 67px;
      }
    }

  </style>
</head>

    <!-- =====================
         OUR SHELVES
    ====================== -->

    <section class="shelves-section">

        <span>OUR SHELVES</span>

      <div class="shelf-list">

        <!-- 모아나 책장 -->

          class="shelf-card"
          href="#"
          onclick="openShelf(event, '모아나')"
        >

            모아나의 책장

      <!-- 사용자 추가 -->

        type="button"
        class="add-user"
        onclick="addUser()"
      >
        + 새 사용자 추가
      </button>


    </section>



    <!-- =====================
         FOOTER
    ====================== -->

      <div class="footer-title">
        READ · KEEP · REMEMBER
      </div>

        우리가 읽은 책을 한곳에 차곡차곡.
      </p>

    </footer>


  </main>



  <script>

    /* =========================
       책장 클릭
    ========================= */

    function openShelf(event, userName) {

      event.preventDefault();

      /*
        나중에 책장 상세 페이지가 생기면
        아래 코드를 원하는 페이지 주소로 바꾸면 됨.

        예:
        window.location.href = "shelf.html?user=" + userName;
      */

      console.log(userName + "의 책장");

    }



    /* =========================
       사용자 추가
    ========================= */

    function addUser() {

      const name = prompt("새 사용자의 이름을 입력해주세요.");

      if (!name) return;


      const shelfList =
        document.querySelector(".shelf-list");


      const newShelf =
        document.createElement("a");


      newShelf.className = "shelf-card";
      newShelf.href = "#";


      newShelf.innerHTML = `
        <span class="shelf-name">
          ${escapeHtml(name)}의 책장
        </span>

        <span class="arrow">
          ›
        </span>
      `;


      newShelf.addEventListener(
        "click",
        function(event) {
          openShelf(event, name);
        }
      );


      shelfList.appendChild(newShelf);

    }



    /* =========================
       입력 문자 안전 처리
    ========================= */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</html>
