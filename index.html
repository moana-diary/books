<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">

  <title>우리의 책장</title>

  <style>
    :root {
      --cream: #f6f2e9;
      --paper: #fffdf8;
      --green: #123d2b;
      --green2: #1d503b;
      --ink: #171b18;
      --muted: #77766e;
      --mustard: #e4b63d;
      --coral: #d98272;
      --line: rgba(23, 27, 24, .18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e9e6df;
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--cream);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 28px 0;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .top-mark {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .mini-circle {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--mustard);
    }

    .mini-square {
      width: 13px;
      height: 13px;
      background: var(--green);
    }

    .hero {
      position: relative;
      padding: 75px 34px 38px;
    }

    .hero h1 {
      position: relative;
      z-index: 2;
      margin: 0;
      color: var(--green);
      font-family:
        Georgia,
        "Times New Roman",
        "Noto Serif KR",
        serif;
      font-size: clamp(52px, 15vw, 76px);
      font-weight: 700;
      line-height: .98;
      letter-spacing: -5px;
    }

    .hero h1 span {
      display: block;
    }

    .english {
      margin-top: 24px;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.1px;
    }

    .hero-copy {
      max-width: 220px;
      margin-top: 11px;
      color: #575950;
      font-size: 13px;
      line-height: 1.65;
    }

    /* 장식 도형 */

    .shape-set {
      position: relative;
      height: 205px;
      margin-top: 32px;
    }

    .plate {
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 270px;
      height: 72px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--green);
    }

    .shape-main {
      position: absolute;
      left: 50%;
      bottom: 47px;
      width: 155px;
      height: 118px;
      transform: translateX(-50%);
      border-radius: 76px 76px 45px 45px;
      background: #eee6d4;
      border: 2px solid var(--ink);
    }

    .shape-main::after {
      position: absolute;
      top: -16px;
      left: 50%;
      width: 98px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--coral);
      border: 2px solid var(--ink);
      content: "";
    }

    .shape-dot {
      position: absolute;
      right: 42px;
      top: 7px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--mustard);
    }

    .shape-small {
      position: absolute;
      left: 41px;
      top: 48px;
      width: 34px;
      height: 34px;
      border: 2px solid var(--green);
      transform: rotate(12deg);
    }

    .section {
      padding: 0 26px 36px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.1px;
    }

    .section-title::after {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mustard);
      content: "";
    }

    .user-card {
      overflow: hidden;
      border: 1px solid var(--green);
      background: var(--green);
    }

    .users {
      display: flex;
      flex-direction: column;
    }

    .user-button {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      padding: 19px 19px;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.16);
      background: transparent;
      color: #fffdf8;
      text-align: left;
      font-size: 15px;
      font-weight: 700;
    }

    .user-button:last-child {
      border-bottom: 0;
    }

    .user-button .arrow {
      font-size: 23px;
      font-weight: 300;
    }

    .status {
      padding: 22px;
      color: rgba(255,255,255,.72);
      text-align: center;
      font-size: 12px;
    }

    .add-user {
      width: 100%;
      margin-top: 11px;
      padding: 16px;
      border: 1px dashed var(--green);
      background: transparent;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
    }

    .footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin: 2px 26px 0;
      padding: 23px 0 36px;
      border-top: 1px solid var(--line);
    }

    .footer-en {
      color: var(--green);
      font-family: Georgia, serif;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.1;
    }

    .footer-small {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
      text-align: right;
    }

    /* 이름 추가 */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(16, 28, 22, .54);
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 360px;
      padding: 25px;
      background: var(--cream);
      border: 1px solid var(--green);
    }

    .modal-mark {
      width: 36px;
      height: 8px;
      margin-bottom: 15px;
      background: var(--mustard);
    }

    .modal h2 {
      margin: 0 0 18px;
      color: var(--green);
      font-family: Georgia, "Noto Serif KR", serif;
      font-size: 26px;
    }

    .modal input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      background: var(--paper);
      color: var(--ink);
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-actions button {
      height: 48px;
      border: 1px solid var(--green);
      font-weight: 800;
    }

    .cancel {
      background: transparent;
      color: var(--green);
    }

    .confirm {
      background: var(--green);
      color: white;
    }
  </style>
</head>

<body>

<main class="app">

  <div class="top">

    <div class="brand">
      우리의 책장
    </div>

    <div class="top-mark">
      <span class="mini-circle"></span>
      <span class="mini-square"></span>
    </div>

  </div>


  <section class="hero">

    <h1>
      <span>우리의</span>
      <span>책장</span>
    </h1>

    <div class="english">
      MONTHLY READING ARCHIVE
    </div>

    <p class="hero-copy">
      한 달 동안 읽은 책을
      한 권씩 모아보세요.
    </p>

    <div class="shape-set">
      <div class="shape-small"></div>
      <div class="shape-dot"></div>
      <div class="plate"></div>
      <div class="shape-main"></div>
    </div>

  </section>


  <section class="section">

    <h2 class="section-title">
      OUR SHELVES
    </h2>

    <div class="user-card">

      <div
        class="users"
        id="users"
      >
        <div class="status">
          불러오는 중…
        </div>
      </div>

    </div>

    <button
      class="add-user"
      id="openAddUser"
      type="button"
    >
      ＋ 새 사용자 추가
    </button>

  </section>


  <footer class="footer">

    <div class="footer-en">
      READ.<br>
      KEEP.<br>
      REPEAT.
    </div>

    <div class="footer-small">
      BOOKS WE FINISHED<br>
      MONTH BY MONTH
    </div>

  </footer>

</main>


<div
  class="overlay"
  id="userOverlay"
>

  <div class="modal">

    <div class="modal-mark"></div>

    <h2>
      새 사용자
    </h2>

    <input
      id="newUserName"
      type="text"
      maxlength="20"
      placeholder="이름을 입력하세요"
    >

    <div class="modal-actions">

      <button
        class="cancel"
        id="cancelUser"
        type="button"
      >
        취소
      </button>

      <button
        class="confirm"
        id="saveUser"
        type="button"
      >
        추가
      </button>

    </div>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


const usersBox =
  document.getElementById(
    "users"
  );


const userOverlay =
  document.getElementById(
    "userOverlay"
  );


loadUsers();


async function loadUsers() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=users&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    renderUsers(
      data.users || []
    );


  } catch (error) {

    console.error(error);


    usersBox.innerHTML = `
      <div class="status">
        사용자 정보를 불러오지 못했어요.
      </div>
    `;

  }

}


function renderUsers(users) {

  usersBox.innerHTML =
    "";


  if (!users.length) {

    usersBox.innerHTML = `
      <div class="status">
        아직 등록된 사용자가 없어요.
      </div>
    `;

    return;

  }


  users.forEach(
    function(item) {

      const name =
        typeof item === "string"
          ? item
          : item.name;


      if (!name) {
        return;
      }


      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "user-button";


      button.innerHTML = `
        <span>${escapeHtml(name)}의 책장</span>
        <span class="arrow">›</span>
      `;


      button.onclick =
        function() {

          localStorage.setItem(
            "currentBookUser",
            name
          );


          window.location.href =
            "./shelf.html?user=" +
            encodeURIComponent(name);

        };


      usersBox.appendChild(
        button
      );

    }
  );

}


document
  .getElementById("openAddUser")
  .onclick =
    function() {

      userOverlay.classList.add(
        "show"
      );


      document
        .getElementById("newUserName")
        .focus();

    };


document
  .getElementById("cancelUser")
  .onclick =
    closeUserModal;


document
  .getElementById("saveUser")
  .onclick =
    addUser;


document
  .getElementById("newUserName")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        addUser();

      }

    }
  );


userOverlay.onclick =
  function(event) {

    if (
      event.target ===
      userOverlay
    ) {

      closeUserModal();

    }

  };


function closeUserModal() {

  userOverlay.classList.remove(
    "show"
  );

}


async function addUser() {

  const input =
    document.getElementById(
      "newUserName"
    );


  const name =
    input.value.trim();


  if (!name) {

    alert(
      "이름을 입력해주세요."
    );

    return;

  }


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({
              action: "addUser",
              name: name
            })
        }
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    input.value =
      "";


    closeUserModal();

    loadUsers();


  } catch (error) {

    console.error(error);

    alert(
      "사용자를 추가하지 못했어요."
    );

  }

}


function escapeHtml(value) {

  return String(
    value || ""
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
