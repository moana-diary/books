<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="referrer"
  content="no-referrer"
>

<title>나의 책장</title>

<style>

:root {
  --cream: #f7f3e9;
  --paper: #fffdf7;
  --green: #0e4b37;
  --ink: #20241f;
  --muted: #77766e;
  --yellow: #e9b936;
  --coral: #d97968;
  --line: #ddd6c7;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: #ebe8e0;
  color: var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Apple SD Gothic Neo",
    sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;

  margin: 0 auto;

  padding-bottom: 65px;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 13%,
      rgba(255,255,255,.5),
      transparent 30%
    ),
    var(--cream);
}


/* =========================
   HEADER
========================= */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 28px 25px 0;
}

.back {
  width: 45px;
  height: 45px;

  padding: 0;

  border: 1px solid var(--green);
  border-radius: 50%;

  background: transparent;

  color: var(--green);

  font-size: 28px;
}

.header-label {
  color: var(--green);

  font-size: 11px;
  font-weight: 900;

  letter-spacing: 3px;
}


/* =========================
   TITLE
========================= */

.title-area {
  padding: 48px 29px 0;
}

h1 {
  margin: 0;

  color: var(--green);

  font-size: 42px;
  line-height: 1;

  letter-spacing: -3px;
}

.subtitle {
  margin: 11px 0 0;

  color: var(--muted);

  font-size: 14px;
}


/* =========================
   MONTH
========================= */

.month-area {
  display: grid;

  grid-template-columns:
    48px
    1fr
    48px;

  align-items: center;

  margin: 47px 29px 0;
}

.month-button {
  width: 45px;
  height: 45px;

  padding: 0;

  border: 0;

  background: transparent;

  color: var(--green);

  font-size: 32px;
}

.month-center {
  text-align: center;
}

.month {
  color: var(--green);

  font-size: 28px;
  font-weight: 950;

  letter-spacing: -1.5px;
}

.count {
  margin-top: 6px;

  color: var(--muted);

  font-size: 13px;
}


/* =========================
   BOOKSHELF
========================= */

.shelf-area {
  padding: 54px 20px 0;
}

.shelf-list {
  width: 100%;
}

.shelf-unit {
  position: relative;

  margin-bottom: 42px;
}


/*
  한 칸당 최대 10권.

  10권이 있으면 실제 두께의 상대비율을
  유지하면서 가로폭을 전부 사용한다.
*/

.books-row {
  display: flex;

  width: 100%;
  min-height: 235px;

  align-items: flex-end;
  justify-content: flex-start;

  gap: 0;

  padding: 0 10px;

  overflow: hidden;
}


/* =========================
   BOOK
========================= */

.book {
  position: relative;

  flex: 0 0 auto;

  padding: 0;

  overflow: hidden;

  border: 0;

  border-radius:
    2px 2px 0 0;

  background: #ded5c3;

  box-shadow:
    inset -1px 0
    rgba(0,0,0,.13);

  transition:
    transform .15s ease;
}

.book:active {
  transform:
    translateY(-5px);
}


/* 실제 YES24 책등 */

.book img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: fill;
}


/* =========================
   가상 책등
========================= */

.fallback-spine {
  position: relative;

  display: flex;

  width: 100%;
  height: 100%;

  align-items: center;
  justify-content: center;

  padding: 8px 3px;

  color: #f8f1df;
}


/* 책등 윗부분 작은 장식 */

.fallback-spine::before {
  position: absolute;

  top: 9px;
  left: 23%;
  right: 23%;

  height: 2px;

  background: currentColor;

  opacity: .45;

  content: "";
}


/* 책등 아래 작은 장식 */

.fallback-spine::after {
  position: absolute;

  left: 24%;
  right: 24%;
  bottom: 10px;

  height: 5px;

  border-top: 1px solid currentColor;
  border-bottom: 1px solid currentColor;

  opacity: .5;

  content: "";
}

.fallback-title {
  max-height: 78%;

  overflow: hidden;

  font-size: 10px;
  font-weight: 800;

  line-height: 1.18;

  writing-mode: vertical-rl;
  text-orientation: mixed;
}


/* =========================
   SHELF BOARD
========================= */

.shelf-board {
  position: relative;

  width: 100%;
  height: 18px;

  border-radius: 10px;

  background: var(--green);
}

.shelf-board::after {
  position: absolute;

  left: 13px;
  right: 13px;
  bottom: -7px;

  height: 7px;

  border-radius:
    0 0 5px 5px;

  background: #d5ba84;

  content: "";
}


/* 선반 번호 */

.shelf-number {
  margin-top: 13px;

  color: #aaa295;

  font-size: 10px;
  font-weight: 800;

  letter-spacing: 2px;

  text-align: right;
}


/* =========================
   EMPTY
========================= */

.empty {
  padding: 70px 20px;

  color: var(--muted);

  text-align: center;
}

.empty-title {
  color: var(--green);

  font-size: 19px;
  font-weight: 900;
}

.empty-text {
  margin-top: 8px;

  font-size: 13px;
}


/* =========================
   ADD
========================= */

.add-area {
  padding: 2px 29px 0;
}

.add-button {
  width: 100%;
  height: 59px;

  border: 0;

  background: var(--green);

  color: white;

  font-size: 15px;
  font-weight: 900;
}


/* =========================
   LOADING
========================= */

.loading {
  padding: 80px 20px;

  color: var(--muted);

  text-align: center;

  font-size: 13px;
}


/* =========================
   DETAIL
========================= */

.overlay {
  position: fixed;

  inset: 0;

  z-index: 100;

  display: none;

  align-items: flex-end;
  justify-content: center;

  background:
    rgba(10,31,24,.48);
}

.overlay.show {
  display: flex;
}

.detail {
  width: 100%;
  max-width: 520px;

  max-height: 88vh;

  padding: 18px 25px 31px;

  overflow-y: auto;

  border-radius:
    28px 28px 0 0;

  background: var(--paper);
}

.handle {
  width: 45px;
  height: 5px;

  margin: 0 auto 27px;

  border-radius: 10px;

  background: #d4cfc5;
}

.detail-top {
  display: grid;

  grid-template-columns:
    105px 1fr;

  gap: 18px;
}

.detail-cover {
  width: 105px;
  height: 151px;

  object-fit: cover;

  background: #e9e4da;
}

.detail-title {
  margin-top: 5px;

  font-size: 23px;
  font-weight: 950;

  line-height: 1.25;

  letter-spacing: -1px;
}

.detail-author {
  margin-top: 12px;

  color: #555950;

  font-size: 14px;
}

.detail-publisher {
  margin-top: 5px;

  color: var(--muted);

  font-size: 13px;
}

.rating-label {
  margin-top: 22px;

  color: var(--muted);

  font-size: 11px;
  font-weight: 800;
}

.rating {
  margin-top: 4px;

  color: var(--yellow);

  font-size: 27px;

  letter-spacing: 1px;
}

.info {
  margin-top: 27px;

  padding: 21px 0;

  border-top:
    1px solid var(--line);

  border-bottom:
    1px solid var(--line);
}

.info-row {
  display: grid;

  grid-template-columns:
    82px 1fr;

  gap: 10px;

  margin-bottom: 12px;

  font-size: 13px;
}

.info-row:last-child {
  margin-bottom: 0;
}

.info-label {
  color: #99948b;

  font-weight: 700;
}

.info-value {
  color: #565951;
}


/* =========================
   ACTIONS
========================= */

.actions {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 8px;

  margin-top: 27px;
}

.action {
  height: 52px;

  border: 0;

  font-weight: 900;
}

.edit {
  background: var(--green);
  color: white;
}

.delete {
  background: #eee7dc;
  color: #a05750;
}

.close {
  width: 100%;
  height: 48px;

  margin-top: 5px;

  border: 0;

  background: transparent;

  color: #8c887f;

  font-weight: 700;
}


@media (max-width: 370px) {

  .shelf-area {
    padding-left: 14px;
    padding-right: 14px;
  }

  .books-row {
    padding-left: 7px;
    padding-right: 7px;
  }

}

</style>

</head>


<body>

<main class="app">

    </h1>

    </p>

<!-- 상세 -->

<div
  class="overlay"
  id="overlay"
>

  <div class="detail">

    <div class="handle"></div>

    <div class="detail-top">

      <img
        class="detail-cover"
        id="detailCover"
        referrerpolicy="no-referrer"
        alt=""
      >

      <div>

        <div
          class="detail-title"
          id="detailTitle"
        ></div>

        <div
          class="detail-author"
          id="detailAuthor"
        ></div>

        <div
          class="detail-publisher"
          id="detailPublisher"
        ></div>

        <div class="rating-label">
          내 별점
        </div>

        <div
          class="rating"
          id="detailRating"
        ></div>

      </div>

    </div>

      <div class="info-row">

        <div class="info-label">
          완독일
        </div>

        <div
          class="info-value"
          id="detailFinishDate"
        ></div>

      </div>


      <div class="info-row">

        <div class="info-label">
          출간일
        </div>

        <div
          class="info-value"
          id="detailPublishDate"
        >
          -
        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          페이지
        </div>

          class="info-value"

      </div>

      </button>

      class="close"

      type="button"
    >
      닫기
    </button>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


const params =
  new URLSearchParams(
    window.location.search
  );


const user =
  params.get("user") ||
  localStorage.getItem(
    "currentBookUser"
  ) ||
  "";


let currentDate =
  new Date();


currentDate.setDate(1);


let currentBooks =
  [];


let selectedBook =
  null;


let resizeTimer =
  null;


document
  .getElementById("shelfTitle")
  .textContent =
  user
    ? user + "의 책장"
    : "나의 책장";


loadBooks();


/* =========================
   LOAD
========================= */

async function loadBooks() {

  updateMonth();


  const shelfList =
    document.getElementById(
      "shelfList"
    );


  shelfList.innerHTML = `
    <div class="loading">
      책장을 불러오는 중…
    </div>
  `;


  const year =
    currentDate.getFullYear();


  const month =
    currentDate.getMonth() + 1;


  try {

    const response =
      await fetch(
        API_URL +
        "?action=books" +
        "&user=" +
        encodeURIComponent(user) +
        "&year=" +
        year +
        "&month=" +
        month +
        "&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message ||
        "불러오기 실패"
      );

    }


    currentBooks =
      data.books || [];


    /*
      예전 기록 중 책두께가 없는 책은
      YES24 상세 API로 두께를 보완.
    */

    await fillMissingThickness(
      currentBooks
    );


    document
      .getElementById(
        "bookCount"
      )
      .textContent =
      currentBooks.length +
      "권 읽었어요";


    renderShelves();


  } catch (error) {

    console.error(error);


    shelfList.innerHTML = `
      <div class="empty">
        책장을 불러오지 못했어요.
      </div>
    `;

  }

}


/* =========================
   두께 보완
========================= */

async function fillMissingThickness(
  books
) {

  const targets =
    books.filter(
      function(book) {

        return (
          !Number(
            book.bookThickness
          ) &&
          book.itemId
        );

      }
    );


  for (
    const book of targets
  ) {

    try {

      const response =
        await fetch(
          API_URL +
          "?action=detail&itemId=" +
          encodeURIComponent(
            book.itemId
          ) +
          "&t=" +
          Date.now()
        );


      const data =
        JSON.parse(
          await response.text()
        );


      if (
        data.success &&
        data.book
      ) {

        book.bookThickness =
          Number(
            data.book.bookHeight ||
            0
          );


        if (!book.spineUrl) {

          book.spineUrl =
            data.book.spineUrl ||
            makeSpineUrl(
              book.itemId
            );

        }

      }


    } catch (error) {

      console.error(error);

    }

  }

}


/* =========================
   10권씩 나누기
========================= */

function splitIntoShelves(
  books
) {

  const shelves =
    [];


  for (
    let i = 0;
    i < books.length;
    i += 10
  ) {

    shelves.push(
      books.slice(
        i,
        i + 10
      )
    );

  }


  return shelves;

}


/* =========================
   RENDER
========================= */

function renderShelves() {

  const shelfList =
    document.getElementById(
      "shelfList"
    );


  shelfList.innerHTML =
    "";


  if (!currentBooks.length) {

    shelfList.innerHTML = `

      <div class="empty">

        <div class="empty-title">
          아직 책이 없어요.
        </div>

        <div class="empty-text">
          읽은 책을 한 권 꽂아보세요.
        </div>

      </div>

    `;

    return;

  }


  const shelves =
    splitIntoShelves(
      currentBooks
    );


  shelves.forEach(
    function(
      books,
      shelfIndex
    ) {

      const unit =
        document.createElement(
          "div"
        );


      unit.className =
        "shelf-unit";


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "books-row";


      /*
        실제 책 두께 비율 계산.

        ★ 10권인 칸:
        반드시 선반 가로폭 전체를 사용.

        ★ 10권 미만:
        실제 비율 그대로 사용하되
        화면을 넘는 경우만 축소.
      */

      const widths =
        calculateShelfWidths(
          books,
          shelfList.clientWidth
        );


      books.forEach(
        function(
          book,
          index
        ) {

          const bookElement =
            createBook(
              book,
              widths[index],
              index
            );


          row.appendChild(
            bookElement
          );

        }
      );


      const board =
        document.createElement(
          "div"
        );


      board.className =
        "shelf-board";


      const number =
        document.createElement(
          "div"
        );


      number.className =
        "shelf-number";


      number.textContent =
        String(
          shelfIndex + 1
        ).padStart(
          2,
          "0"
        );


      unit.appendChild(
        row
      );


      unit.appendChild(
        board
      );


      unit.appendChild(
        number
      );


      shelfList.appendChild(
        unit
      );

    }
  );

}


/* =========================
   핵심:
   책 10권이면 선반 꽉 채우기
========================= */

function calculateShelfWidths(
  books,
  containerWidth
) {

  /*
    books-row 좌우 padding이
    각각 10px이므로 20px 제외.
  */

  const usableWidth =
    Math.max(
      220,
      containerWidth - 20
    );


  /*
    각 책의 실제 두께 비율.
  */

  const rawWidths =
    books.map(
      function(book) {

        return getRawBookWidth(
          book
        );

      }
    );


  const rawTotal =
    rawWidths.reduce(
      function(sum, value) {

        return sum + value;

      },
      0
    );


  if (!rawTotal) {

    return books.map(
      function() {

        return usableWidth /
          Math.max(
            books.length,
            1
          );

      }
    );

  }


  /*
    ★ 정확히 10권이면

    실제 두께 비율을 유지하면서
    선반 가로폭 전체에 맞춤.

    예:
      얇은책 15
      일반책 20
      두꺼운책 35

    이 비율 자체는 유지됨.
  */

  if (
    books.length === 10
  ) {

    const scale =
      usableWidth /
      rawTotal;


    return rawWidths.map(
      function(width) {

        return width * scale;

      }
    );

  }


  /*
    ★ 마지막 칸처럼 10권 미만

    화면에 들어가면 실제 크기대로.
  */

  if (
    rawTotal <= usableWidth
  ) {

    return rawWidths;

  }


  /*
    10권 미만인데도
    너무 두꺼워 화면을 넘는 경우만
    비율을 유지하며 축소.
  */

  const scale =
    usableWidth /
    rawTotal;


  return rawWidths.map(
    function(width) {

      return width * scale;

    }
  );

}


/* =========================
   실제 두께 → 상대 너비
========================= */

function getRawBookWidth(
  book
) {

  const thickness =
    Number(
      book.bookThickness ||
      0
    );


  if (
    thickness > 0
  ) {

    return clamp(
      thickness * 1.6,
      14,
      65
    );

  }


  /*
    두께를 못 구한 책
  */

  return 27;

}


/* =========================
   BOOK
========================= */

function createBook(
  book,
  width,
  index
) {

  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "book";


  button.style.width =
    width +
    "px";


  button.style.height =
    getVisualHeight(
      book
    ) +
    "px";


  const image =
    document.createElement(
      "img"
    );


  image.referrerPolicy =
    "no-referrer";


  image.decoding =
    "async";


  const spineUrl =
    book.spineUrl ||
    makeSpineUrl(
      book.itemId
    );


  if (spineUrl) {

    image.src =
      spineUrl;


    image.alt =
      book.title +
      " 책등";


    /*
      URL은 정상인데
      YES24에서 '이미지 준비중'
      대체이미지를 보내는 경우가 있음.

      그래서 onerror뿐 아니라
      onload에서도 원본 이미지 비율을 확인.
    */

    image.addEventListener(
      "load",
      function() {

        const naturalWidth =
          image.naturalWidth;


        const naturalHeight =
          image.naturalHeight;


        if (
          !naturalWidth ||
          !naturalHeight
        ) {

          return;

        }


        const ratio =
          naturalWidth /
          naturalHeight;


        /*
          실제 책등은 보통
          세로가 훨씬 긴 형태.

          YES24 이미지 준비중 같은
          일반 대체 이미지는
          지나치게 넓거나 정사각형에 가까움.

          그런 경우 자동 책등으로 교체.
        */

        if (
          ratio > 0.58
        ) {

          showFallbackSpine(
            button,
            book,
            index
          );

        }

      }
    );


    /*
      아예 이미지가 존재하지 않는 경우
    */

    image.addEventListener(
      "error",
      function() {

        const automaticUrl =
          makeSpineUrl(
            book.itemId
          );


        /*
          저장돼 있던 URL이 실패했지만
          자동 /side 주소와 다르면
          /side 주소로 한 번 더 시도.
        */

        if (
          automaticUrl &&
          image.dataset.retry !== "1" &&
          normalizeUrl(image.src) !==
          normalizeUrl(automaticUrl)
        ) {

          image.dataset.retry =
            "1";


          image.src =
            automaticUrl;


          return;

        }


        showFallbackSpine(
          button,
          book,
          index
        );

      }
    );


    button.appendChild(
      image
    );


  } else {

    showFallbackSpine(
      button,
      book,
      index
    );

  }


  button.addEventListener(
    "click",
    function() {

      openDetail(
        book
      );

    }
  );


  return button;

}


/* =========================
   YES24 /side 주소
========================= */

function makeSpineUrl(
  itemId
) {

  if (!itemId) {
    return "";
  }


  return (
    "https://image.yes24.com/goods/detail/" +
    encodeURIComponent(
      itemId
    ) +
    "/side"
  );

}


/* =========================
   자동 책등
========================= */

function showFallbackSpine(
  button,
  book,
  index
) {

  button.innerHTML =
    "";


  const colors = [

    {
      background: "#0e4b37",
      text: "#f7f3e9"
    },

    {
      background: "#e8ddc4",
      text: "#20241f"
    },

    {
      background: "#d97968",
      text: "#20241f"
    },

    {
      background: "#e9b936",
      text: "#20241f"
    },

    {
      background: "#24362d",
      text: "#f7f3e9"
    },

    {
      background: "#eee9dc",
      text: "#0e4b37"
    }

  ];


  const colorIndex =
    getBookColorIndex(
      book,
      colors.length
    );


  const color =
    colors[colorIndex];


  const fallback =
    document.createElement(
      "div"
    );


  fallback.className =
    "fallback-spine";


  fallback.style.background =
    color.background;


  fallback.style.color =
    color.text;


  const title =
    document.createElement(
      "span"
    );


  title.className =
    "fallback-title";


  title.textContent =
    book.title ||
    "BOOK";


  fallback.appendChild(
    title
  );


  button.appendChild(
    fallback
  );

}


/* 같은 책은 항상 같은 색 */

function getBookColorIndex(
  book,
  length
) {

  const text =
    String(
      book.itemId ||
      book.title ||
      ""
    );


  let hash =
    0;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    hash =
      (
        hash * 31 +
        text.charCodeAt(i)
      ) >>> 0;

  }


  return hash %
    length;

}


/* =========================
   책 높이
========================= */

function getVisualHeight(
  book
) {

  const title =
    String(
      book.title ||
      ""
    );


  let value =
    0;


  for (
    let i = 0;
    i < title.length;
    i++
  ) {

    value +=
      title.charCodeAt(i);

  }


  return (
    188 +
    (
      value %
      28
    )
  );

}

/* =========================
   DETAIL
========================= */

async function openDetail(
  book
) {

  selectedBook =
    book;


  const cover =
    document.getElementById(
      "detailCover"
    );


  cover.referrerPolicy =
    "no-referrer";


  cover.src =
    book.coverUrl ||
    "";


  document
    .getElementById(
      "detailTitle"
    )
    .textContent =
    book.title ||
    "";


  document
    .getElementById(
      "detailAuthor"
    )
    .textContent =
    book.author ||
    "";


  document
    .getElementById(
      "detailPublisher"
    )
    .textContent =
    book.publisher ||
    "";


  document
    .getElementById(
      "detailFinishDate"
    )
    .textContent =
    formatDate(
      book.finishDate
    );


  document
    .getElementById(
      "detailRating"
    )
    .textContent =
    makeStars(
      Number(
        book.rating ||
        0
      )
    );


  document
    .getElementById(
      "detailPublishDate"
    )
    .textContent =
    "-";


  document
    .getElementById(
      "detailPages"
    )
    .textContent =
    "-";


  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "show"
    );


  if (!book.itemId) {
    return;
  }


  try {

    const response =
      await fetch(
        API_URL +
        "?action=detail&itemId=" +
        encodeURIComponent(
          book.itemId
        ) +
        "&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (
      !data.success ||
      !data.book
    ) {

      return;

    }


    const detail =
      data.book;


    document
      .getElementById(
        "detailPublishDate"
      )
      .textContent =
      formatPublishDate(
        detail.publishDate
      ) ||
      "-";


    document
      .getElementById(
        "detailPages"
      )
      .textContent =
      detail.pages
        ? detail.pages +
          "쪽"
        : "-";


  } catch (error) {

    console.error(error);

  }

}

      }


      try {

        const response =

            API_URL,

              },

              body:

                  action:
                    "deleteBook",

                  id:
                    selectedBook.id
                })
            }
          );


        const data =
          JSON.parse(
            await response.text()
          );


        if (!data.success) {

          throw new Error(
            data.message ||
            "삭제 실패"
          );

        }


        closeDetail();


        loadBooks();


      } catch (error) {

        console.error(error);


        alert(
          "삭제하지 못했어요."
        );

      }

    }
  );

/* =========================
   HELPERS
========================= */

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function normalizeUrl(
  value
) {

  return String(
    value ||
    ""
  )
    .replace(
      /^https?:\/\//,
      ""
    )
    .replace(
      /\/+$/,
      ""
    );

}


function makeStars(
  value
) {

  let text =
    "";


  for (
    let i = 1;
    i <= 5;
    i++
  ) {

    text +=
      i <= value
        ? "★"
        : "☆";

  }


  return text;

}


function formatDate(
  value
) {

  if (!value) {
    return "-";
  }


  return String(
    value
  ).replace(
    /-/g,
    "."
  );

}


function formatPublishDate(
  value
) {

  if (!value) {
    return "";
  }


  const text =
    String(
      value
    ).replace(
      /\D/g,
      ""
    );


  if (
    text.length === 8
  ) {

    return (
      text.slice(0,4) +
      "." +
      text.slice(4,6) +
      "." +
      text.slice(6,8)
    );

  }


  return value;

}
