<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">

  <title>나의 책장</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
      background: #ebe6df;
      color: #433c37;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding-bottom: 105px;
      background:
        linear-gradient(
          180deg,
          #fbf9f5,
          #f2ede6
        );
    }

    .top {
      display: flex;
      align-items: center;
      padding: 18px 20px 0;
    }

    .back {
      display: flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: white;
      color: #675e57;
      text-decoration: none;
      font-size: 23px;
    }

    .logo {
      margin-left: auto;
      color: #a0978f;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .header {
      padding: 28px 20px 8px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 29px;
      letter-spacing: -1.2px;
    }

    .header p {
      margin: 7px 0 0;
      color: #9a918a;
      font-size: 12px;
    }

    .month {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 17px;
      margin-top: 18px;
    }

    .month button {
      display: flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: #736a63;
      font-size: 25px;
      cursor: pointer;
    }

    .month-info {
      width: 170px;
      text-align: center;
    }

    .month-info strong {
      display: block;
      font-size: 20px;
    }

    .month-info span {
      display: block;
      margin-top: 5px;
      color: #a19891;
      font-size: 11px;
    }

    .shelf-area {
      padding: 42px 16px 0;
    }

    .books {
      display: flex;
      min-height: 240px;
      align-items: flex-end;
      gap: 3px;
      padding: 0 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .books::-webkit-scrollbar {
      display: none;
    }

    .spine {
      flex-shrink: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 3px 3px 1px 1px;
      background: #8b7567;
      box-shadow:
        1px 1px 3px
        rgba(52,40,32,.16);
      cursor: pointer;
      transition: transform .15s ease;
    }

    .spine:active {
      transform: translateY(-6px);
    }

    .spine-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .fallback {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 5px 3px;
    }

    .fallback span {
      max-height: 94%;
      overflow: hidden;
      writing-mode: vertical-rl;
      color: white;
      font-size: 9px;
      font-weight: 700;
    }

    .wood {
      position: relative;
      height: 17px;
      border-radius: 2px 2px 6px 6px;
      background:
        linear-gradient(
          180deg,
          #ba8c68,
          #966b4d 60%,
          #80583e
        );
      box-shadow:
        0 8px 10px
        rgba(64,45,32,.17);
    }

    .wood::after {
      position: absolute;
      right: 4%;
      bottom: -6px;
      left: 4%;
      height: 6px;
      border-radius: 0 0 6px 6px;
      background: #714c35;
      content: "";
    }

    .empty {
      padding: 80px 10px 105px;
      color: #9c948d;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    .add {
      position: fixed;
      left: 50%;
      bottom: 22px;
      width: calc(100% - 40px);
      max-width: 470px;
      padding: 16px;
      transform: translateX(-50%);
      border-radius: 17px;
      background: #817168;
      box-shadow:
        0 8px 20px
        rgba(66,49,39,.14);
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: 800;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(42,38,34,.4);
      backdrop-filter: blur(4px);
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      padding: 12px 22px 28px;
      border-radius: 27px 27px 0 0;
      background: #fbf9f5;
    }

    .handle {
      width: 40px;
      height: 4px;
      margin: 0 auto 23px;
      border-radius: 5px;
      background: #d6cfc9;
    }

    .modal-top {
      display: flex;
      gap: 18px;
    }

    .cover {
      width: 105px;
      height: 150px;
      flex-shrink: 0;
      border-radius: 5px;
      background: #e4ddd7;
      object-fit: cover;
      box-shadow:
        0 6px 16px
        rgba(49,37,28,.13);
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .info h2 {
      margin: 2px 0 8px;
      font-size: 20px;
      line-height: 1.4;
    }

    .info .author {
      color: #70675f;
      font-size: 13px;
    }

    .info .publisher {
      margin-top: 4px;
      color: #9c938c;
      font-size: 12px;
    }

    .rating-label {
      display: block;
      margin-top: 16px;
      color: #a0978f;
      font-size: 10px;
      font-weight: 800;
    }

    .stars {
      margin-top: 3px;
      color: #d29a43;
      font-size: 19px;
      letter-spacing: 1px;
    }

    .details {
      margin-top: 23px;
      padding: 14px 0;
      border-top: 1px solid #e5ded8;
      border-bottom: 1px solid #e5ded8;
    }

    .row {
      display: flex;
      gap: 12px;
      padding: 5px 0;
      font-size: 12px;
    }

    .label {
      width: 65px;
      flex-shrink: 0;
      color: #a09790;
    }

    .value {
      color: #5d554f;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .buttons button {
      padding: 13px;
      border: 0;
      border-radius: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .edit {
      background: #817168;
      color: white;
    }

    .delete {
      background: #eee5df;
      color: #9c5e58;
    }

    .close {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 0;
      background: transparent;
      color: #99908a;
      cursor: pointer;
    }
  </style>
</head>

<body>

<main class="app">

  <div class="top">

    <a
      class="back"
      href="index.html"
    >
      ‹
    </a>

    <div class="logo">
      MONTHLY BOOKSHELF
    </div>

  </div>

  <header class="header">

    <h1 id="owner"></h1>

    <p>
      한 달 동안 읽은 책들
    </p>

  </header>

  <div class="month">

    <button id="prev" type="button">
      ‹
    </button>

    <div class="month-info">

      <strong id="monthTitle"></strong>

      <span id="count"></span>

    </div>

    <button id="next" type="button">
      ›
    </button>

  </div>

  <section class="shelf-area">

    <div
      class="books"
      id="books"
    ></div>

    <div
      class="empty"
      id="empty"
      style="display:none;"
    >
      이번 달에는 아직 책이 없어요.<br>
      첫 책을 꽂아볼까요?
    </div>

    <div class="wood"></div>

  </section>

</main>

<a
  class="add"
  id="add"
>
  ＋ 새 책 꽂기
</a>

<div
  class="overlay"
  id="overlay"
>

  <div class="modal">

    <div class="handle"></div>

    <div class="modal-top">

      <img
        class="cover"
        id="cover"
        alt="책 표지"
        referrerpolicy="no-referrer"
      >

      <div class="info">

        <h2 id="title"></h2>

        <div
          class="author"
          id="author"
        ></div>

        <div
          class="publisher"
          id="publisher"
        ></div>

        <span class="rating-label">
          내 별점
        </span>

        <div
          class="stars"
          id="stars"
        ></div>

      </div>

    </div>

    <div class="details">

      <div class="row">
        <span class="label">완독일</span>
        <span class="value" id="finishDate"></span>
      </div>

      <div class="row">
        <span class="label">출간일</span>
        <span class="value" id="publishDate"></span>
      </div>

      <div class="row">
        <span class="label">페이지</span>
        <span class="value" id="pages"></span>
      </div>

      <div class="row">
        <span class="label">판형</span>
        <span class="value" id="size"></span>
      </div>

    </div>

    <div class="buttons">

      <button
        class="edit"
        id="edit"
        type="button"
      >
        수정
      </button>

      <button
        class="delete"
        id="delete"
        type="button"
      >
        삭제
      </button>

    </div>

    <button
      class="close"
      id="close"
      type="button"
    >
      닫기
    </button>

  </div>

</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


const params =
  new URLSearchParams(
    location.search
  );


const user =
  params.get("user") ||
  localStorage.getItem(
    "currentBookUser"
  ) ||
  "";


if (!user) {
  location.href = "index.html";
}


localStorage.setItem(
  "currentBookUser",
  user
);


document
  .getElementById("owner")
  .textContent =
    user + "의 책장";


const today =
  new Date();


let year =
  Number(
    params.get("year")
  ) ||
  today.getFullYear();


let month =
  Number(
    params.get("month")
  ) ||
  today.getMonth() + 1;


let selectedBook = null;


document
  .getElementById("add")
  .href =
    "write.html?user=" +
    encodeURIComponent(user);


document
  .getElementById("prev")
  .onclick =
    function() {

      month--;

      if (month < 1) {
        month = 12;
        year--;
      }

      loadBooks();

    };


document
  .getElementById("next")
  .onclick =
    function() {

      month++;

      if (month > 12) {
        month = 1;
        year++;
      }

      loadBooks();

    };


loadBooks();


async function loadBooks() {

  document
    .getElementById("monthTitle")
    .textContent =
      year +
      "년 " +
      month +
      "월";


  document
    .getElementById("count")
    .textContent =
      "불러오는 중…";


  try {

    const response =
      await fetch(
        API_URL +
        "?action=books" +
        "&user=" +
        encodeURIComponent(user) +
        "&year=" +
        year +
        "&month=" +
        month +
        "&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {
      throw new Error(data.message);
    }


    const books =
      data.books || [];


    document
      .getElementById("count")
      .textContent =
        books.length +
        "권 읽었어요";


    renderBooks(books);


  } catch (error) {

    console.error(error);

    document
      .getElementById("count")
      .textContent =
        "연결 오류";

  }

}


function renderBooks(books) {

  const container =
    document.getElementById(
      "books"
    );


  const empty =
    document.getElementById(
      "empty"
    );


  container.innerHTML = "";


  if (!books.length) {

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  books.forEach(
    function(book, index) {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "spine";

      button.type =
        "button";


      /*
       * 실제 책 세로 크기와 두께를
       * 책등 크기에 반영
       */
      const realLength =
        Number(
          book.bookLength || 195
        );


      const realThickness =
        Number(
          book.bookHeight || 20
        );


      const height =
        clamp(
          realLength * 0.95,
          165,
          230
        );


      const width =
        clamp(
          realThickness * 1.5,
          20,
          52
        );


      button.style.height =
        height + "px";


      button.style.width =
        width + "px";


      if (book.spineUrl) {

        const image =
          document.createElement(
            "img"
          );


        image.className =
          "spine-image";


        image.referrerPolicy =
          "no-referrer";


        image.src =
          book.spineUrl;


        image.alt =
          book.title;


        image.onerror =
          function() {

            button.innerHTML = "";

            fallback(
              button,
              book,
              index
            );

          };


        button.appendChild(
          image
        );


      } else {

        fallback(
          button,
          book,
          index
        );

      }


      button.onclick =
        function() {

          openBook(book);

        };


      container.appendChild(
        button
      );

    }
  );

}


function fallback(
  button,
  book,
  index
) {

  const colors = [
    "#927068",
    "#71806e",
    "#ad895e",
    "#736760",
    "#a37b6e",
    "#6c7b86",
    "#8e7a68"
  ];


  button.style.background =
    colors[
      index %
      colors.length
    ];


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "fallback";


  const span =
    document.createElement(
      "span"
    );


  span.textContent =
    book.title;


  div.appendChild(span);

  button.appendChild(div);

}


function openBook(book) {

  selectedBook = book;


  document
    .getElementById("title")
    .textContent =
      book.title || "";


  document
    .getElementById("author")
    .textContent =
      book.author || "";


  document
    .getElementById("publisher")
    .textContent =
      book.publisher || "";


  const cover =
    document.getElementById(
      "cover"
    );


  cover.referrerPolicy =
    "no-referrer";


  cover.src =
    book.coverUrl || "";


  const rating =
    Math.round(
      Number(
        book.rating || 0
      )
    );


  document
    .getElementById("stars")
    .textContent =
      "★".repeat(rating) +
      "☆".repeat(
        Math.max(
          0,
          5 - rating
        )
      );


  document
    .getElementById("finishDate")
    .textContent =
      formatDate(
        book.finishDate
      );


  document
    .getElementById("publishDate")
    .textContent =
      formatPublishDate(
        book.publishDate
      );


  document
    .getElementById("pages")
    .textContent =
      book.pages
        ? book.pages + "쪽"
        : "-";


  const w =
    Number(
      book.bookWidth || 0
    );

  const l =
    Number(
      book.bookLength || 0
    );

  const h =
    Number(
      book.bookHeight || 0
    );


  document
    .getElementById("size")
    .textContent =
      w && l && h
        ? w +
          " × " +
          l +
          " × " +
          h +
          " mm"
        : "-";


  document
    .getElementById("overlay")
    .classList.add(
      "show"
    );

}


document
  .getElementById("edit")
  .onclick =
    function() {

      if (!selectedBook) {
        return;
      }


      sessionStorage.setItem(
        "editBook",
        JSON.stringify(
          selectedBook
        )
      );


      location.href =
        "write.html?mode=edit&user=" +
        encodeURIComponent(user);

    };


document
  .getElementById("delete")
  .onclick =
    async function() {

      if (!selectedBook) {
        return;
      }


      if (
        !confirm(
          "「" +
          selectedBook.title +
          "」을 삭제할까요?"
        )
      ) {
        return;
      }


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify({
                  action: "deleteBook",
                  id: selectedBook.id
                })
            }
          );


        const data =
          JSON.parse(
            await response.text()
          );


        if (!data.success) {
          throw new Error(data.message);
        }


        closeModal();

        loadBooks();


      } catch (error) {

        console.error(error);

        alert(
          "삭제하지 못했어요."
        );

      }

    };


document
  .getElementById("close")
  .onclick =
    closeModal;


document
  .getElementById("overlay")
  .onclick =
    function(event) {

      if (
        event.target === this
      ) {

        closeModal();

      }

    };


function closeModal() {

  document
    .getElementById("overlay")
    .classList.remove(
      "show"
    );

}


function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function formatDate(value) {

  if (!value) {
    return "-";
  }

  return String(value)
    .replace(/-/g, ".");

}


function formatPublishDate(value) {

  const text =
    String(
      value || ""
    );


  if (
    /^\d{8}$/.test(text)
  ) {

    return (
      text.slice(0,4) +
      "." +
      text.slice(4,6) +
      "." +
      text.slice(6,8)
    );

  }


  return text || "-";

}

</script>

</body>
</html>
