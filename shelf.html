<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>나의 책장</title>

<style>

:root {
  --cream: #f7f3e9;
  --paper: #fffdf7;
  --green: #0e4b37;
  --ink: #20241f;
  --muted: #77766e;
  --yellow: #e9b936;
  --coral: #d97968;
  --line: #ddd6c7;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: #ebe8e0;
  color: var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Apple SD Gothic Neo",
    sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  margin: 0 auto;
  padding-bottom: 65px;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 50% 13%,
      rgba(255,255,255,.5),
      transparent 30%
    ),
    var(--cream);
}


/* HEADER */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 25px 0;
}

.back {
  width: 45px;
  height: 45px;
  padding: 0;
  border: 1px solid var(--green);
  border-radius: 50%;
  background: transparent;
  color: var(--green);
  font-size: 28px;
}

.header-label {
  color: var(--green);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 3px;
}


/* TITLE */

.title-area {
  padding: 48px 29px 0;
}

h1 {
  margin: 0;
  color: var(--green);
  font-size: 42px;
  line-height: 1;
  letter-spacing: -3px;
}

.subtitle {
  margin: 11px 0 0;
  color: var(--muted);
  font-size: 14px;
}


/* MONTH */

.month-area {
  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;
  margin: 47px 29px 0;
}

.month-button {
  width: 45px;
  height: 45px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--green);
  font-size: 32px;
}

.month-center {
  text-align: center;
}

.month {
  color: var(--green);
  font-size: 28px;
  font-weight: 950;
  letter-spacing: -1.5px;
}

.count {
  margin-top: 6px;
  color: var(--muted);
  font-size: 13px;
}


/* BOOKSHELF */

.shelf-area {
  padding: 54px 20px 0;
}

.shelf-list {
  width: 100%;
}

.shelf-unit {
  position: relative;
  margin-bottom: 39px;
}


/*
  책들이 들어가는 실제 공간.

  JS가 이 영역의 너비를 측정한 다음
  실제 책등 너비를 더해서
  몇 권까지 들어가는지 계산한다.
*/

.books-row {
  display: flex;
  min-height: 225px;
  align-items: flex-end;
  justify-content: flex-start;
  padding: 0 12px;
  overflow: hidden;
}


/* BOOK */

.book {
  position: relative;
  flex: 0 0 auto;
  height: 202px;
  padding: 0;
  overflow: hidden;
  border: 0;
  border-radius: 2px 2px 0 0;
  background: #ded5c3;
  box-shadow:
    inset -1px 0 rgba(0,0,0,.14);
}


/*
  실제 책등 이미지.
  책 전체가 잘리지 않게 fill 사용.
*/

.book img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
}


/* 책등 이미지가 아예 없을 때 */

.fallback-spine {
  display: flex;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  padding: 7px 3px;
  background: var(--green);
  color: #f8f1df;
}

.fallback-title {
  overflow: hidden;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.15;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  white-space: nowrap;
}


/* 선반 */

.shelf-board {
  position: relative;
  width: 100%;
  height: 18px;
  border-radius: 10px;
  background: var(--green);
}

.shelf-board::after {
  position: absolute;
  left: 13px;
  right: 13px;
  bottom: -7px;
  height: 7px;
  border-radius: 0 0 5px 5px;
  background: #d5ba84;
  content: "";
}


/* EMPTY */

.empty {
  padding: 70px 20px;
  color: var(--muted);
  text-align: center;
}

.empty-title {
  color: var(--green);
  font-size: 19px;
  font-weight: 900;
}

.empty-text {
  margin-top: 8px;
  font-size: 13px;
}


/* ADD */

.add-area {
  padding: 2px 29px 0;
}

.add-button {
  width: 100%;
  height: 59px;
  border: 0;
  background: var(--green);
  color: white;
  font-size: 15px;
  font-weight: 900;
}


/* LOADING */

.loading {
  padding: 80px 20px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}


/* DETAIL OVERLAY */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: rgba(10,31,24,.48);
}

.overlay.show {
  display: flex;
}

.detail {
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  padding: 18px 25px 31px;
  overflow-y: auto;
  border-radius: 28px 28px 0 0;
  background: var(--paper);
}

.handle {
  width: 45px;
  height: 5px;
  margin: 0 auto 27px;
  border-radius: 10px;
  background: #d4cfc5;
}

.detail-top {
  display: grid;
  grid-template-columns: 105px 1fr;
  gap: 18px;
}

.detail-cover {
  width: 105px;
  height: 151px;
  object-fit: cover;
  background: #e9e4da;
}

.detail-title {
  margin-top: 5px;
  font-size: 23px;
  font-weight: 950;
  line-height: 1.25;
  letter-spacing: -1px;
}

.detail-author {
  margin-top: 12px;
  color: #555950;
  font-size: 14px;
}

.detail-publisher {
  margin-top: 5px;
  color: var(--muted);
  font-size: 13px;
}

.rating-label {
  margin-top: 22px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}

.rating {
  margin-top: 4px;
  color: var(--yellow);
  font-size: 27px;
  letter-spacing: 1px;
}

.info {
  margin-top: 27px;
  padding: 21px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.info-row {
  display: grid;
  grid-template-columns: 82px 1fr;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 13px;
}

.info-row:last-child {
  margin-bottom: 0;
}

.info-label {
  color: #99948b;
  font-weight: 700;
}

.info-value {
  color: #565951;
}


/* INTRO */

.intro {
  display: none;
  padding: 23px 0 0;
}

.intro.show {
  display: block;
}

.intro-label {
  margin-bottom: 9px;
  color: var(--green);
  font-size: 12px;
  font-weight: 900;
}

.intro-text {
  color: #5e6059;
  font-size: 13px;
  line-height: 1.75;
}


/* ACTION */

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 27px;
}

.action {
  height: 52px;
  border: 0;
  font-weight: 900;
}

.edit {
  background: var(--green);
  color: white;
}

.delete {
  background: #eee7dc;
  color: #a05750;
}

.close {
  width: 100%;
  height: 48px;
  margin-top: 5px;
  border: 0;
  background: transparent;
  color: #8c887f;
  font-weight: 700;
}


@media (max-width: 370px) {

  .shelf-area {
    padding-left: 14px;
    padding-right: 14px;
  }

  .books-row {
    padding-left: 9px;
    padding-right: 9px;
  }

}

</style>

</head>


<body>

<main class="app">

  <header class="header">

      class="back"
      id="backButton"
      type="button"

      ‹
    </button>

    <div class="header-label">
      MONTHLY BOOKSHELF
    </div>

  </header>


  <section class="title-area">

    <h1 id="shelfTitle">

    </h1>

    </p>

  </section>


  <section class="month-area">

      class="month-button"

    </button>

    <div class="month-center">

        class="month"

    <button
      class="month-button"

    </button>

      class="shelf-list"

      </div>
    </div>

    </button>

<!-- 상세 팝업 -->

<div
  class="overlay"
  id="overlay"
>

  <div class="detail">

    <div class="handle"></div>

    <div class="detail-top">

      <img
        class="detail-cover"
        id="detailCover"
        alt=""
      >

      <div>

        <div
          class="detail-title"
          id="detailTitle"
        ></div>

        <div
          class="detail-author"
          id="detailAuthor"
        ></div>

        <div
          class="detail-publisher"
          id="detailPublisher"
        ></div>

        <div class="rating-label">
          내 별점
        </div>

        <div
          class="rating"
          id="detailRating"
        ></div>

      </div>

    </div>


    <div class="info">

      <div class="info-row">

        <div class="info-label">
          완독일
        </div>

        <div
          class="info-value"
          id="detailFinishDate"
        ></div>

      </div>


      <div class="info-row">

        <div class="info-label">
          출간일
        </div>

        <div
          class="info-value"
          id="detailPublishDate"
        >
          -
        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          페이지
        </div>

        <div
          class="info-value"
          id="detailPages"
        >
          -
        </div>

      </div>

    </div>


    <div
      class="intro"
      id="intro"
    >

      <div class="intro-label">
        책 소개
      </div>

      <div
        class="intro-text"
        id="introText"
      ></div>

    </div>


    <div class="actions">

      <button
        class="action edit"
        id="editButton"
        type="button"
      >
        수정
      </button>

      <button
        class="action delete"
        id="deleteButton"
        type="button"
      >
        삭제
      </button>

    </div>

    <button
      class="close"
      id="closeButton"
      type="button"
    >
      닫기
    </button>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


const params =
  new URLSearchParams(
    window.location.search
  );

const user =
  params.get("user") ||
  localStorage.getItem(
    "currentBookUser"
  ) ||
  "";


let currentDate =
  new Date();

currentDate.setDate(1);

let currentBooks = [];
let selectedBook = null;

let resizeTimer = null;


document
  .getElementById("shelfTitle")
  .textContent =
  user
    ? user + "의 책장"
    : "나의 책장";


loadBooks();


/* ================================
   LOAD
================================ */

async function loadBooks() {

  updateMonth();

  const shelfList =
    document.getElementById(
      "shelfList"
    );

  shelfList.innerHTML =
    '<div class="loading">책장을 불러오는 중…</div>';


  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth() + 1;


  try {

    const response =
      await fetch(
        API_URL +
        "?action=books" +
        "&user=" +
        encodeURIComponent(user) +
        "&year=" +
        year +
        "&month=" +
        month +
        "&t=" +
        Date.now()
      );

    const data =
      JSON.parse(
        await response.text()
      );

    if (!data.success) {

      throw new Error(
        data.message ||
        "불러오기 실패"
      );

    }

    currentBooks =
      data.books || [];


    /*
      예전에 저장한 책에는 책두께가 없다.

      그런 책만 YES24 상세정보를 조회해서
      화면에서 실제 두께를 사용한다.
    */

    await fillMissingThickness(
      currentBooks
    );


    document
      .getElementById(
        "bookCount"
      )
      .textContent =
      currentBooks.length +
      "권 읽었어요";


    renderShelves();


  } catch (error) {

    console.error(error);

    shelfList.innerHTML =
      '<div class="empty">책장을 불러오지 못했어요.</div>';

  }

}


/* ================================
   기존 책 두께 보완
================================ */

async function fillMissingThickness(
  books
) {

  const targets =
    books.filter(function(book) {

      return (
        !Number(book.bookThickness) &&
        book.itemId
      );

    });


  /*
    한꺼번에 너무 많은 요청을 보내지 않도록
    순서대로 처리.
  */

  for (
    const book of targets
  ) {

    try {

      const response =
        await fetch(
          API_URL +
          "?action=detail&itemId=" +
          encodeURIComponent(
            book.itemId
          ) +
          "&t=" +
          Date.now()
        );

      const data =
        JSON.parse(
          await response.text()
        );

      if (
        data.success &&
        data.book
      ) {

        book.bookThickness =
          Number(
            data.book.bookHeight ||
            0
          );

        if (!book.spineUrl) {

          book.spineUrl =
            data.book.spineUrl ||
            makeSpineUrl(
              book.itemId
            );

        }

      }

    } catch (error) {

      console.error(error);

    }

  }

}


/* ================================
   SHELF
================================ */

function renderShelves() {

  const shelfList =
    document.getElementById(
      "shelfList"
    );

  shelfList.innerHTML = "";


  if (!currentBooks.length) {

    shelfList.innerHTML = `

      <div class="empty">

        <div class="empty-title">
          아직 책이 없어요.
        </div>

        <div class="empty-text">
          읽은 책을 한 권 꽂아보세요.
        </div>

      </div>

    `;

    return;

  }


  /*
    현재 모바일 화면에서
    실제 사용할 수 있는 너비.
  */

  const availableWidth =
    Math.max(
      220,
      shelfList.clientWidth - 24
    );


  /*
    책을 선반별로 나눈다.
  */

  const shelves =
    packBooks(
      currentBooks,
      availableWidth
    );


  shelves.forEach(
    function(books) {

      const unit =
        document.createElement(
          "div"
        );

      unit.className =
        "shelf-unit";


      const row =
        document.createElement(
          "div"
        );

      row.className =
        "books-row";


      books.forEach(
        function(book) {

          row.appendChild(
            createBook(book)
          );

        }
      );


      const board =
        document.createElement(
          "div"
        );

      board.className =
        "shelf-board";


      unit.appendChild(row);
      unit.appendChild(board);

      shelfList.appendChild(unit);

    }
  );

}


/* ================================
   책을 몇 번째 선반에 놓을지 계산
================================ */

function packBooks(
  books,
  availableWidth
) {

  const shelves = [];

  let row = [];
  let usedWidth = 0;


  books.forEach(function(book) {

    const width =
      getBookWidth(book);


    /*
      현재 줄에 추가하면
      화면을 넘는 경우
      새 선반을 만든다.
    */

    if (
      row.length > 0 &&
      usedWidth + width >
      availableWidth
    ) {

      shelves.push(row);

      row = [];
      usedWidth = 0;

    }


    row.push(book);

    usedWidth += width;

  });


  if (row.length) {
    shelves.push(row);
  }


  return shelves;

}


/* ================================
   실제 두께 → 화면 너비
================================ */

function getBookWidth(book) {

  const thickness =
    Number(
      book.bookThickness || 0
    );


  /*
    YES24의 책 두께는 mm.

    예:
    12mm → 얇은 책
    20mm → 일반 단행본
    35mm → 두꺼운 책

    화면에서는 모바일 가독성을 위해
    완전히 1:1이 아니라 약간 확대한다.
  */

  if (thickness > 0) {

    return clamp(
      Math.round(
        thickness * 1.15
      ),
      15,
      58
    );

  }


  /*
    두께 정보를 얻을 수 없는 책만
    기본 23px.
  */

  return 23;

}


function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(max, value)
  );

}


/* ================================
   BOOK
================================ */

function createBook(book) {

  const button =
    document.createElement(
      "button"
    );

  button.type = "button";
  button.className = "book";


  const width =
    getBookWidth(book);


  button.style.width =
    width + "px";


  /*
    판형은 화면에 표시하지 않는다.

    책 높이는 너무 들쑥날쑥하지 않게
    제목을 기준으로 살짝 차이만 준다.
  */

  button.style.height =
    getVisualHeight(book) +
    "px";


  const image =
    document.createElement(
      "img"
    );


  /*
    저장된 책등 URL 우선.

    없으면 YES24가 안내한 주소 규칙:
    image.yes24.com/goods/detail/상품번호/side
  */

  const spineUrl =
    book.spineUrl ||
    makeSpineUrl(
      book.itemId
    );


  if (spineUrl) {

    image.src =
      spineUrl;

    image.alt =
      book.title + " 책등";

    image.addEventListener(
      "error",
      function() {

        /*
          저장되어 있던 URL이 실패했는데
          그 URL이 자동 생성 주소와 다르다면
          YES24 /side 주소를 한 번 더 시도.
        */

        const fallbackUrl =
          makeSpineUrl(
            book.itemId
          );


        if (
          fallbackUrl &&
          image.dataset.retry !== "1" &&
          image.src !== fallbackUrl
        ) {

          image.dataset.retry = "1";
          image.src = fallbackUrl;
          return;

        }


        /*
          YES24에도 책등 이미지가 없는 경우
        */

        showFallbackSpine(
          button,
          book
        );

      }
    );


    button.appendChild(image);

  } else {

    showFallbackSpine(
      button,
      book
    );

  }


  button.addEventListener(
    "click",
    function() {

      openDetail(book);

    }
  );


  return button;

}


/* ================================
   YES24 책등 URL
================================ */

function makeSpineUrl(itemId) {

  if (!itemId) return "";

  /*
    YES24가 안내한 방식

    상품 페이지:
    m.yes24.com/Goods/Detail/108422348

    책등:
    image.yes24.com/goods/detail/108422348/side
  */

  return (
    "https://image.yes24.com/goods/detail/" +
    encodeURIComponent(itemId) +
    "/side"
  );

}


/* ================================
   책등 없는 책
================================ */

function showFallbackSpine(
  button,
  book
) {

  button.innerHTML = "";


  const fallback =
    document.createElement(
      "div"
    );

  fallback.className =
    "fallback-spine";


  const title =
    document.createElement(
      "span"
    );

  title.className =
    "fallback-title";

  title.textContent =
    book.title || "BOOK";


  fallback.appendChild(title);

  button.appendChild(fallback);

}


/* ================================
   책 높이
================================ */

function getVisualHeight(book) {

  /*
    이번 요청에서는 판형 정보를
    사용하지 않기로 했으므로
    높이는 장식적인 작은 차이만 준다.

    랜덤을 쓰면 새로고침할 때마다
    바뀌기 때문에 제목 문자열로 고정.
  */

  const title =
    String(book.title || "");

  let value = 0;

  for (
    let i = 0;
    i < title.length;
    i++
  ) {

    value +=
      title.charCodeAt(i);

  }

  return (
    184 +
    (value % 29)
  );

}

/* ================================
   DETAIL
================================ */

async function openDetail(book) {

  selectedBook = book;


  document
    .getElementById(
      "detailCover"
    )
    .src =
    book.coverUrl || "";


  document
    .getElementById(
      "detailTitle"
    )
    .textContent =
    book.title || "";


  document
    .getElementById(
      "detailAuthor"
    )
    .textContent =
    book.author || "";


  document
    .getElementById(
      "detailPublisher"
    )
    .textContent =
    book.publisher || "";


  document
    .getElementById(
      "detailFinishDate"
    )
    .textContent =
    formatDate(
      book.finishDate
    );


  document
    .getElementById(
      "detailRating"
    )
    .textContent =
    makeStars(
      Number(book.rating || 0)
    );


  document
    .getElementById(
      "detailPublishDate"
    )
    .textContent = "-";


  document
    .getElementById(
      "detailPages"
    )
    .textContent = "-";


  document
    .getElementById(
      "intro"
    )
    .classList
    .remove("show");


  document
    .getElementById(
      "introText"
    )
    .textContent = "";


  document
    .getElementById(
      "overlay"
    )
    .classList
    .add("show");


  if (!book.itemId) {
    return;
  }


  try {

    const response =
      await fetch(
        API_URL +
        "?action=detail&itemId=" +
        encodeURIComponent(
          book.itemId
        ) +
        "&t=" +
        Date.now()
      );

    const data =
      JSON.parse(
        await response.text()
      );


    if (
      !data.success ||
      !data.book
    ) {
      return;
    }


    const detail =
      data.book;


    document
      .getElementById(
        "detailPublishDate"
      )
      .textContent =
      formatPublishDate(
        detail.publishDate
      ) || "-";


    document
      .getElementById(
        "detailPages"
      )
      .textContent =
      detail.pages
        ? detail.pages + "쪽"
        : "-";


    if (
      detail.bookIntroduction
    ) {

      document
        .getElementById(
          "introText"
        )
        .textContent =
        detail.bookIntroduction;


      document
        .getElementById(
          "intro"
        )
        .classList
        .add("show");

    }

  } catch (error) {

    console.error(error);

  }

}


/* ================================
   EDIT / DELETE
================================ */

document
  .getElementById("editButton")
  .addEventListener(
    "click",
    function() {

      if (!selectedBook) return;


      sessionStorage.setItem(
        "selectedBook",
        JSON.stringify(
          selectedBook
        )
      );


      window.location.href =
        "./write.html?mode=edit&user=" +
        encodeURIComponent(user);

    }
  );


document
  .getElementById("deleteButton")
  .addEventListener(
    "click",
    async function() {

      if (!selectedBook) return;


      const ok =
        confirm(
          "이 책 기록을 삭제할까요?"
        );

      if (!ok) return;


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify({
                  action: "deleteBook",
                  id: selectedBook.id
                })
            }
          );


        const data =
          JSON.parse(
            await response.text()
          );


        if (!data.success) {

          throw new Error(
            data.message ||
            "삭제 실패"
          );

        }


        closeDetail();

        loadBooks();


      } catch (error) {

        console.error(error);

        alert(
          "삭제하지 못했어요."
        );

      }

    }
  );

/* ================================
   HELPERS
================================ */

function makeStars(value) {

  let text = "";

  for (
    let i = 1;
    i <= 5;
    i++
  ) {

    text +=
      i <= value
        ? "★"
        : "☆";

  }

  return text;

}


function formatDate(value) {

  if (!value) return "-";

  return String(value)
    .replace(/-/g, ".");

}


function formatPublishDate(value) {

  if (!value) return "";

  const text =
    String(value)
      .replace(/\D/g, "");

  if (text.length === 8) {

    return (
      text.slice(0,4) +
      "." +
      text.slice(4,6) +
      "." +
      text.slice(6,8)
    );

  }

  return value;

}
