<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">

  <title>우리의 책장</title>

  <style>
    :root {
      --cream: #f6f2e9;
      --paper: #fffdf8;
      --green: #123d2b;
      --ink: #171b18;
      --muted: #77766e;
      --mustard: #e4b63d;
      --coral: #d98272;
      --line: rgba(23, 27, 24, .18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e9e6df;
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 120px;
      background: var(--cream);
    }

    .top {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 22px 22px 0;
    }

    .back {
      display: flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      font-size: 34px;
      font-weight: 300;
    }

    .top-title {
      color: var(--green);
      text-align: center;
      font-size: 16px;
      font-weight: 900;
    }

    .grid-icon {
      display: grid;
      width: 23px;
      height: 23px;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      justify-self: end;
    }

    .grid-icon i {
      border: 2px solid var(--green);
    }

    .month-wrap {
      padding: 62px 30px 0;
    }

    .month-row {
      display: flex;
      align-items: flex-end;
      gap: 20px;
    }

    .month-number {
      color: var(--green);
      font-family:
        Georgia,
        "Times New Roman",
        serif;
      font-size: 100px;
      line-height: .75;
      letter-spacing: -8px;
    }

    .month-meta {
      padding-bottom: 4px;
    }

    .month-meta strong {
      display: block;
      color: var(--ink);
      font-size: 18px;
      font-weight: 700;
    }

    .month-meta span {
      display: block;
      margin-top: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .coral-dot {
      width: 35px;
      height: 35px;
      margin-left: auto;
      margin-bottom: 5px;
      border-radius: 50%;
      background: var(--coral);
    }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 30px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--green);
    }

    .month-nav button {
      padding: 7px 10px;
      border: 0;
      background: transparent;
      color: var(--green);
      font-size: 26px;
    }

    .month-name {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    /* 책장 */

    .shelf-area {
      padding: 70px 20px 0;
    }

    .books {
      display: flex;
      min-height: 285px;
      align-items: flex-end;
      gap: 2px;
      padding: 0 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .books::-webkit-scrollbar {
      display: none;
    }

    .spine {
      flex-shrink: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 3px 3px 1px 1px;
      background: #ebe6d9;
      box-shadow:
        2px 3px 6px rgba(26, 30, 25, .15);
      transition: transform .16s ease;
    }

    .spine:active {
      transform: translateY(-7px);
    }

    .spine img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .fallback {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 8px 3px;
    }

    .fallback span {
      max-height: 92%;
      overflow: hidden;
      writing-mode: vertical-rl;
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
    }

    .shelf-line {
      height: 8px;
      border-radius: 2px;
      background: var(--green);
      box-shadow:
        0 5px 8px rgba(21, 54, 40, .1);
    }

    .empty {
      padding: 100px 15px 115px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    /* 새 책 */

    .add-book {
      position: fixed;
      right: max(24px, calc((100vw - 520px) / 2 + 24px));
      bottom: 28px;
      z-index: 30;
      display: flex;
      width: 112px;
      height: 112px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 0;
      border-radius: 50%;
      background: var(--green);
      color: white;
      box-shadow:
        0 10px 24px rgba(18,61,43,.2);
    }

    .add-book .plus {
      font-size: 43px;
      font-weight: 200;
      line-height: .8;
    }

    .add-book .text {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 800;
    }

    /* 상세 */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 26, 20, .52);
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      max-height: 89vh;
      overflow-y: auto;
      padding: 30px 25px 28px;
      background: var(--cream);
      border-top: 7px solid var(--green);
    }

    .detail-number {
      margin-bottom: 19px;
      color: var(--coral);
      font-family: Georgia, serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .detail-top {
      display: flex;
      gap: 19px;
      align-items: flex-start;
    }

    .cover {
      width: 106px;
      height: 153px;
      flex-shrink: 0;
      border: 1px solid var(--line);
      object-fit: cover;
      background: #e6e1d5;
    }

    .detail-info {
      min-width: 0;
      flex: 1;
    }

    .detail-info h2 {
      margin: 0 0 9px;
      color: var(--green);
      font-family:
        Georgia,
        "Noto Serif KR",
        serif;
      font-size: 26px;
      line-height: 1.25;
    }

    .author {
      font-size: 13px;
      line-height: 1.5;
    }

    .publisher {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .rating-label {
      display: block;
      margin-top: 17px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .stars {
      margin-top: 5px;
      color: var(--green);
      font-size: 21px;
      letter-spacing: 2px;
    }

    .detail-table {
      margin-top: 25px;
      padding: 16px 0;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--line);
    }

    .detail-row {
      display: grid;
      grid-template-columns: 80px 1fr;
      padding: 7px 0;
      font-size: 13px;
    }

    .detail-label {
      color: var(--muted);
      font-weight: 700;
    }

    .detail-value {
      font-weight: 600;
    }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .detail-actions button {
      height: 50px;
      border: 1px solid var(--green);
      font-weight: 800;
    }

    .edit {
      background: var(--green);
      color: white;
    }

    .delete {
      background: transparent;
      color: var(--green);
    }

    .close {
      width: 100%;
      padding: 15px;
      margin-top: 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
    }
  </style>
</head>

<body>

<main class="app">

  <div class="top">

    <a
      class="back"
      href="./index.html"
    >
      ‹
    </a>

    <div class="top-title">
      우리의 책장
    </div>

    <div class="grid-icon">
      <i></i><i></i><i></i><i></i>
    </div>

  </div>


  <section class="month-wrap">

    <div class="month-row">

      <div
        class="month-number"
        id="monthNumber"
      ></div>

      <div class="month-meta">

        <strong id="yearLabel"></strong>

        <span id="count"></span>

      </div>

      <div class="coral-dot"></div>

    </div>

    <div class="month-nav">

      <button
        id="prev"
        type="button"
      >
        ‹
      </button>

      <div
        class="month-name"
        id="monthName"
      ></div>

      <button
        id="next"
        type="button"
      >
        ›
      </button>

    </div>

  </section>


  <section class="shelf-area">

    <div
      class="books"
      id="books"
    ></div>

    <div
      class="empty"
      id="empty"
      style="display:none;"
    >
      이번 달에는 아직 책이 없어요.
    </div>

    <div class="shelf-line"></div>

  </section>

</main>


<button
  class="add-book"
  id="addBook"
  type="button"
>
  <span class="plus">＋</span>
  <span class="text">새 책 꽂기</span>
</button>


<div
  class="overlay"
  id="overlay"
>

  <div class="modal">

    <div class="detail-number">
      READING RECORD
    </div>

    <div class="detail-top">

      <img
        class="cover"
        id="cover"
        referrerpolicy="no-referrer"
        alt="책 표지"
      >

      <div class="detail-info">

        <h2 id="detailTitle"></h2>

        <div
          class="author"
          id="author"
        ></div>

        <div
          class="publisher"
          id="publisher"
        ></div>

        <span class="rating-label">
          MY RATING
        </span>

        <div
          class="stars"
          id="stars"
        ></div>

      </div>

    </div>


    <div class="detail-table">

      <div class="detail-row">
        <span class="detail-label">완독일</span>
        <span class="detail-value" id="finishDate"></span>
      </div>

      <div class="detail-row">
        <span class="detail-label">출간일</span>
        <span class="detail-value" id="publishDate"></span>
      </div>

      <div class="detail-row">
        <span class="detail-label">페이지</span>
        <span class="detail-value" id="pages"></span>
      </div>

    </div>


    <div class="detail-actions">

      <button
        class="edit"
        id="edit"
        type="button"
      >
        수정
      </button>

      <button
        class="delete"
        id="delete"
        type="button"
      >
        삭제
      </button>

    </div>

    <button
      class="close"
      id="close"
      type="button"
    >
      닫기
    </button>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


const params =
  new URLSearchParams(
    location.search
  );


const user =
  params.get("user") ||
  localStorage.getItem(
    "currentBookUser"
  ) ||
  "";


if (!user) {

  window.location.href =
    "./index.html";

}


localStorage.setItem(
  "currentBookUser",
  user
);


const today =
  new Date();


let year =
  Number(
    params.get("year")
  ) ||
  today.getFullYear();


let month =
  Number(
    params.get("month")
  ) ||
  today.getMonth() + 1;


let selectedBook =
  null;


const englishMonths = [
  "",
  "JAN",
  "FEB",
  "MAR",
  "APR",
  "MAY",
  "JUN",
  "JUL",
  "AUG",
  "SEP",
  "OCT",
  "NOV",
  "DEC"
];


document
  .getElementById("addBook")
  .onclick =
    function() {

      window.location.href =
        "./write.html?user=" +
        encodeURIComponent(user);

    };


document
  .getElementById("prev")
  .onclick =
    function() {

      month--;

      if (month < 1) {

        month = 12;
        year--;

      }

      loadBooks();

    };


document
  .getElementById("next")
  .onclick =
    function() {

      month++;

      if (month > 12) {

        month = 1;
        year++;

      }

      loadBooks();

    };


loadBooks();


async function loadBooks() {

  updateMonthUI();


  try {

    const response =
      await fetch(
        API_URL +
        "?action=books" +
        "&user=" +
        encodeURIComponent(user) +
        "&year=" +
        year +
        "&month=" +
        month +
        "&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    const books =
      data.books || [];


    document
      .getElementById("count")
      .textContent =
        books.length +
        "권 읽었어요";


    renderBooks(
      books
    );


  } catch (error) {

    console.error(error);


    document
      .getElementById("count")
      .textContent =
        "연결 오류";

  }

}


function updateMonthUI() {

  document
    .getElementById("monthNumber")
    .textContent =
      String(month)
        .padStart(
          2,
          "0"
        );


  document
    .getElementById("yearLabel")
    .textContent =
      year +
      " / " +
      englishMonths[month];


  document
    .getElementById("monthName")
    .textContent =
      user +
      " · " +
      year +
      "." +
      String(month).padStart(2, "0");


  document
    .getElementById("count")
    .textContent =
      "불러오는 중…";

}


function renderBooks(books) {

  const container =
    document.getElementById(
      "books"
    );


  const empty =
    document.getElementById(
      "empty"
    );


  container.innerHTML =
    "";


  if (!books.length) {

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  books.forEach(
    function(book, index) {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "spine";


      const realLength =
        Number(
          book.bookLength || 195
        );


      const realThickness =
        Number(
          book.bookHeight || 20
        );


      const screenHeight =
        clamp(
          realLength * 1.06,
          205,
          285
        );


      const screenWidth =
        clamp(
          realThickness * 1.55,
          25,
          60
        );


      button.style.height =
        screenHeight + "px";


      button.style.width =
        screenWidth + "px";


      if (book.spineUrl) {

        const image =
          document.createElement(
            "img"
          );


        image.referrerPolicy =
          "no-referrer";


        image.src =
          book.spineUrl;


        image.alt =
          book.title;


        image.onerror =
          function() {

            button.innerHTML =
              "";


            fallback(
              button,
              book,
              index
            );

          };


        button.appendChild(
          image
        );


      } else {

        fallback(
          button,
          book,
          index
        );

      }


      button.onclick =
        function() {

          openDetail(
            book
          );

        };


      container.appendChild(
        button
      );

    }
  );

}


function fallback(
  button,
  book,
  index
) {

  const colors = [
    "#b5574d",
    "#ebe4d5",
    "#123d2b",
    "#f1ede3",
    "#d9b247"
  ];


  button.style.background =
    colors[
      index %
      colors.length
    ];


  const wrap =
    document.createElement(
      "div"
    );


  wrap.className =
    "fallback";


  const span =
    document.createElement(
      "span"
    );


  span.textContent =
    book.title;


  if (
    index % colors.length === 0 ||
    index % colors.length === 2
  ) {

    span.style.color =
      "#fffdf8";

  }


  wrap.appendChild(
    span
  );


  button.appendChild(
    wrap
  );

}


async function openDetail(book) {

  selectedBook =
    { ...book };


  fillDetail(
    selectedBook
  );


  document
    .getElementById("overlay")
    .classList.add(
      "show"
    );


  /*
   * 예전에 저장한 책이라
   * 출간일/페이지가 비어 있으면
   * 검색 결과에서 보충
   */

  if (
    !selectedBook.publishDate ||
    !selectedBook.pages
  ) {

    try {

      const response =
        await fetch(
          API_URL +
          "?action=search&q=" +
          encodeURIComponent(
            selectedBook.title
          ) +
          "&t=" +
          Date.now()
        );


      const data =
        JSON.parse(
          await response.text()
        );


      if (
        data.success &&
        Array.isArray(data.books)
      ) {

        let matched =
          data.books.find(
            function(item) {

              return (
                String(item.itemId) ===
                String(
                  selectedBook.itemId
                )
              );

            }
          );


        if (!matched) {

          matched =
            data.books.find(
              function(item) {

                return (
                  item.title ===
                  selectedBook.title
                );

              }
            );

        }


        if (matched) {

          selectedBook = {
            ...selectedBook,
            ...matched,
            id: book.id,
            user: book.user,
            finishDate: book.finishDate,
            rating: book.rating
          };


          fillDetail(
            selectedBook
          );

        }

      }

    } catch (error) {

      console.error(error);

    }

  }

}


function fillDetail(book) {

  document
    .getElementById("detailTitle")
    .textContent =
      book.title || "";


  document
    .getElementById("author")
    .textContent =
      book.author || "";


  document
    .getElementById("publisher")
    .textContent =
      book.publisher || "";


  const cover =
    document.getElementById(
      "cover"
    );


  cover.referrerPolicy =
    "no-referrer";


  if (book.coverUrl) {

    cover.src =
      book.coverUrl;

    cover.style.display =
      "block";

  } else {

    cover.style.display =
      "none";

  }


  const rating =
    Math.round(
      Number(
        book.rating || 0
      )
    );


  document
    .getElementById("stars")
    .textContent =
      "★".repeat(rating) +
      "☆".repeat(
        Math.max(
          0,
          5 - rating
        )
      );


  document
    .getElementById("finishDate")
    .textContent =
      formatDate(
        book.finishDate
      );


  document
    .getElementById("publishDate")
    .textContent =
      formatPublishDate(
        book.publishDate
      );


  document
    .getElementById("pages")
    .textContent =
      book.pages
        ? book.pages + "쪽"
        : "-";

}


document
  .getElementById("edit")
  .onclick =
    function() {

      if (!selectedBook) {
        return;
      }


      sessionStorage.setItem(
        "editBook",
        JSON.stringify(
          selectedBook
        )
      );


      window.location.href =
        "./write.html?mode=edit&user=" +
        encodeURIComponent(user);

    };


document
  .getElementById("delete")
  .onclick =
    async function() {

      if (!selectedBook) {
        return;
      }


      if (
        !confirm(
          "「" +
          selectedBook.title +
          "」을 삭제할까요?"
        )
      ) {

        return;

      }


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify({
                  action: "deleteBook",
                  id: selectedBook.id
                })
            }
          );


        const data =
          JSON.parse(
            await response.text()
          );


        if (!data.success) {

          throw new Error(
            data.message
          );

        }


        closeModal();

        loadBooks();


      } catch (error) {

        console.error(error);

        alert(
          "삭제하지 못했어요."
        );

      }

    };


document
  .getElementById("close")
  .onclick =
    closeModal;


document
  .getElementById("overlay")
  .onclick =
    function(event) {

      if (
        event.target === this
      ) {

        closeModal();

      }

    };


function closeModal() {

  document
    .getElementById("overlay")
    .classList.remove(
      "show"
    );

}


function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function formatDate(value) {

  if (!value) {
    return "-";
  }


  return String(value)
    .replace(/-/g, ".");

}


function formatPublishDate(value) {

  const text =
    String(
      value || ""
    );


  if (
    /^\d{8}$/.test(text)
  ) {

    return (
      text.slice(0,4) +
      "." +
      text.slice(4,6) +
      "." +
      text.slice(6,8)
    );

  }


  return text || "-";

}

</script>

</body>
</html>
