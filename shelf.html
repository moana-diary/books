<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="referrer"
    content="no-referrer"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <meta
    http-equiv="Pragma"
    content="no-cache"
  >

  <meta
    http-equiv="Expires"
    content="0"
  >

  <title>우리의 책장</title>


  <style>

    :root {
      --cream: #f7f3e9;
      --paper: #fffdf7;
      --green: #0e4b37;
      --green-dark: #093d2c;
      --ink: #20241f;
      --muted: #77766e;
      --yellow: #e9b936;
      --coral: #d97968;
      --beige: #d5ba84;
      --line: #ddd6c7;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
    }


    body {
      background: #ebe8e0;
      color: var(--ink);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
    }


    button {
      font: inherit;
      cursor: pointer;
    }


    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;

      margin: 0 auto;

      padding-bottom: 70px;

      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 50% 13%,
          rgba(255,255,255,.5),
          transparent 31%
        ),
        var(--cream);
    }



    /* =========================================
       HEADER
    ========================================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 28px 25px 0;
    }


    .back {
      display: flex;

      width: 45px;
      height: 45px;

      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid var(--green);
      border-radius: 50%;

      background: transparent;

      color: var(--green);

      font-size: 28px;
      line-height: 1;

      -webkit-appearance: none;
      appearance: none;
    }


    .header-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }


    .header-circle {
      width: 15px;
      height: 15px;

      border-radius: 50%;

      background: var(--yellow);
    }


    .header-square {
      width: 15px;
      height: 15px;

      background: var(--green);
    }



    /* =========================================
       TITLE
    ========================================= */

    .title-area {
      padding: 48px 29px 0;
    }


    .eyebrow {
      margin-bottom: 11px;

      color: var(--green);

      font-size: 11px;
      font-weight: 900;

      letter-spacing: 3px;
    }


    h1 {
      margin: 0;

      color: var(--green);

      font-size: 43px;
      font-weight: 950;

      line-height: 1;

      letter-spacing: -3px;
    }


    .subtitle {
      margin: 12px 0 0;

      color: var(--muted);

      font-size: 14px;
    }



    /* =========================================
       MONTH
    ========================================= */

    .month-area {
      display: grid;

      grid-template-columns:
        48px
        1fr
        48px;

      align-items: center;

      margin: 46px 29px 0;
    }


    .month-button {
      display: flex;

      width: 45px;
      height: 45px;

      align-items: center;
      justify-content: center;

      padding: 0;

      border: 0;

      background: transparent;

      color: var(--green);

      font-size: 33px;

      -webkit-appearance: none;
      appearance: none;
    }


    .month-center {
      text-align: center;
    }


    .month {
      color: var(--green);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 31px;
      font-weight: 700;

      letter-spacing: -1.5px;
    }


    .count {
      margin-top: 7px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }



    /* =========================================
       BOOK SHELF
    ========================================= */

    .shelf-area {
      padding: 57px 19px 0;
    }


    .shelf-list {
      width: 100%;
    }


    .shelf-unit {
      position: relative;

      width: 100%;

      margin-bottom: 46px;
    }


    /*
      권수 제한 없음.

      실제 책등 너비를 합산하다가
      화면 폭을 넘기려는 책부터
      다음 선반으로 이동.
    */

    .books-row {
      display: flex;

      width: 100%;

      min-height: 265px;

      align-items: flex-end;
      justify-content: flex-start;

      gap: 2px;

      padding: 0 10px;

      overflow: hidden;
    }



    /* =========================================
       BOOK

       iOS Safari에서 버튼 기본 높이가
       개입하지 못하도록 appearance와
       min/max-height를 명시적으로 제거.
    ========================================= */

    .book {
      position: relative;

      display: block;

      flex: 0 0 auto;

      padding: 0;
      margin: 0;

      overflow: hidden;

      border: 0;
      border-radius: 2px 2px 0 0;

      background: #ded5c3;

      box-shadow:
        inset -1px 0 rgba(0,0,0,.12),
        1px 2px 3px rgba(32,36,31,.08);

      -webkit-appearance: none;
      appearance: none;

      min-width: 0;
      min-height: 0;

      max-width: none;
      max-height: none;

      font-size: 0;
      line-height: 0;

      vertical-align: bottom;

      transform-origin: bottom center;

      transition:
        transform .14s ease;
    }


    .book:active {
      transform:
        translateY(-5px);
    }


    .book img {
      display: block;

      width: 100%;
      height: 100%;

      min-height: 0;
      max-height: none;

      border: 0;

      object-fit: fill;

      pointer-events: none;
    }



    /* =========================================
       FALLBACK SPINE
    ========================================= */

    .fallback-spine {
      position: relative;

      display: flex;

      width: 100%;
      height: 100%;

      min-height: 0;

      align-items: center;
      justify-content: center;

      padding: 10px 3px;

      overflow: hidden;
    }


    .fallback-spine::before {
      position: absolute;

      top: 10px;
      left: 22%;
      right: 22%;

      height: 2px;

      background: currentColor;

      opacity: .45;

      content: "";
    }


    .fallback-spine::after {
      position: absolute;

      left: 24%;
      right: 24%;
      bottom: 11px;

      height: 5px;

      border-top:
        1px solid currentColor;

      border-bottom:
        1px solid currentColor;

      opacity: .45;

      content: "";
    }


    .fallback-title {
      max-height: 75%;

      overflow: hidden;

      font-size: 10px;
      font-weight: 850;

      line-height: 1.15;

      writing-mode: vertical-rl;
      text-orientation: mixed;
    }



    /* =========================================
       SHELF BOARD
    ========================================= */

    .shelf-board {
      position: relative;

      width: 100%;
      height: 17px;

      border-radius: 10px;

      background: var(--green);
    }


    .shelf-board::after {
      position: absolute;

      left: 13px;
      right: 13px;
      bottom: -7px;

      height: 7px;

      border-radius:
        0 0 5px 5px;

      background: var(--beige);

      content: "";
    }


    .shelf-number {
      margin-top: 14px;

      color: #aaa295;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 2px;

      text-align: right;
    }



    /* =========================================
       EMPTY
    ========================================= */

    .empty {
      padding: 72px 20px 85px;

      color: var(--muted);

      text-align: center;
    }


    .empty-mark {
      width: 29px;
      height: 29px;

      margin: 0 auto 17px;

      border-radius: 50%;

      background: var(--yellow);
    }


    .empty-title {
      color: var(--green);

      font-size: 19px;
      font-weight: 900;
    }


    .empty-text {
      margin-top: 8px;

      font-size: 13px;
    }



    /* =========================================
       LOADING
    ========================================= */

    .loading {
      padding: 85px 20px;

      color: var(--muted);

      text-align: center;

      font-size: 13px;
    }



    /* =========================================
       ADD BOOK
    ========================================= */

    .add-area {
      padding: 0 29px;
    }


    .add-button {
      width: 100%;
      height: 59px;

      border: 0;

      background: var(--green);

      color: white;

      font-size: 15px;
      font-weight: 900;

      letter-spacing: -.3px;

      -webkit-appearance: none;
      appearance: none;
    }



    /* =========================================
       DETAIL OVERLAY
    ========================================= */

    .overlay {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      align-items: flex-end;
      justify-content: center;

      background:
        rgba(8,36,26,.52);
    }


    .overlay.show {
      display: flex;
    }


    .detail {
      width: 100%;
      max-width: 520px;

      max-height: 89vh;

      padding: 17px 25px 31px;

      overflow-y: auto;

      border-radius:
        28px 28px 0 0;

      background: var(--paper);
    }


    .handle {
      width: 44px;
      height: 5px;

      margin: 0 auto 28px;

      border-radius: 20px;

      background: #d5d0c6;
    }


    .detail-top {
      display: grid;

      grid-template-columns:
        106px minmax(0, 1fr);

      gap: 18px;
    }


    .detail-cover {
      width: 106px;
      height: 153px;

      object-fit: cover;

      background: #e8e3d8;
    }


    .detail-title {
      margin-top: 4px;

      color: var(--green);

      font-size: 23px;
      font-weight: 950;

      line-height: 1.28;

      letter-spacing: -1px;

      word-break: keep-all;
    }


    .detail-author {
      margin-top: 11px;

      color: #50544d;

      font-size: 14px;

      line-height: 1.5;
    }


    .detail-publisher {
      margin-top: 4px;

      color: var(--muted);

      font-size: 13px;
    }


    .rating-label {
      margin-top: 20px;

      color: #9a958c;

      font-size: 10px;
      font-weight: 900;

      letter-spacing: 1.3px;
    }


    .rating {
      margin-top: 5px;

      color: var(--yellow);

      font-size: 25px;

      letter-spacing: 1px;
    }



    /* =========================================
       DETAIL INFO
    ========================================= */

    .info {
      margin-top: 27px;

      padding: 20px 0;

      border-top:
        1px solid var(--line);

      border-bottom:
        1px solid var(--line);
    }


    .info-row {
      display: grid;

      grid-template-columns:
        82px 1fr;

      gap: 10px;

      margin-bottom: 12px;

      font-size: 13px;
    }


    .info-row:last-child {
      margin-bottom: 0;
    }


    .info-label {
      color: #99948b;

      font-weight: 700;
    }


    .info-value {
      color: #50544d;

      font-weight: 600;
    }



    /* =========================================
       ACTIONS
    ========================================= */

    .actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-top: 27px;
    }


    .action {
      height: 52px;

      border: 0;

      font-weight: 900;

      -webkit-appearance: none;
      appearance: none;
    }


    .edit {
      background: var(--green);

      color: white;
    }


    .delete {
      background: #eee7dc;

      color: #a05750;
    }


    .close {
      width: 100%;
      height: 48px;

      margin-top: 5px;

      border: 0;

      background: transparent;

      color: #8c887f;

      font-weight: 700;

      -webkit-appearance: none;
      appearance: none;
    }



    @media (max-width: 370px) {

      .shelf-area {
        padding-left: 13px;
        padding-right: 13px;
      }


      .books-row {
        padding-left: 7px;
        padding-right: 7px;
      }


      .title-area {
        padding-left: 24px;
        padding-right: 24px;
      }


      .month-area {
        margin-left: 22px;
        margin-right: 22px;
      }

    }

  </style>

</head>


<body>


<main class="app">


  <header class="header">

    <button
      class="back"
      id="backButton"
      type="button"
      aria-label="메인으로 돌아가기"
    >
      ‹
    </button>


    <div class="header-right">

      <span class="header-circle"></span>

      <span class="header-square"></span>

    </div>

  </header>



  <section class="title-area">

    <div class="eyebrow">
      MONTHLY READING ARCHIVE
    </div>

    <h1 id="shelfTitle">
      나의 책장
    </h1>

    <p class="subtitle">
      한 달 동안 읽은 책들
    </p>

  </section>



  <section class="month-area">

    <button
      class="month-button"
      id="prevMonth"
      type="button"
      aria-label="이전 달"
    >
      ‹
    </button>


    <div class="month-center">

      <div
        class="month"
        id="monthLabel"
      ></div>

      <div
        class="count"
        id="bookCount"
      >
        불러오는 중…
      </div>

    </div>


    <button
      class="month-button"
      id="nextMonth"
      type="button"
      aria-label="다음 달"
    >
      ›
    </button>

  </section>



  <section class="shelf-area">

    <div
      class="shelf-list"
      id="shelfList"
    >

      <div class="loading">
        책장을 불러오는 중…
      </div>

    </div>

  </section>



  <section class="add-area">

    <button
      class="add-button"
      id="addBook"
      type="button"
    >
      ＋ 새 책 꽂기
    </button>

  </section>


</main>



<!-- 책 상세 -->

<div
  class="overlay"
  id="overlay"
>

  <div class="detail">

    <div class="handle"></div>


    <div class="detail-top">

      <img
        class="detail-cover"
        id="detailCover"
        referrerpolicy="no-referrer"
        alt="책 표지"
      >


      <div>

        <div
          class="detail-title"
          id="detailTitle"
        ></div>


        <div
          class="detail-author"
          id="detailAuthor"
        ></div>


        <div
          class="detail-publisher"
          id="detailPublisher"
        ></div>


        <div class="rating-label">
          MY RATING
        </div>


        <div
          class="rating"
          id="detailRating"
        ></div>

      </div>

    </div>



    <div class="info">

      <div class="info-row">

        <div class="info-label">
          완독일
        </div>

        <div
          class="info-value"
          id="detailFinishDate"
        ></div>

      </div>


      <div class="info-row">

        <div class="info-label">
          출간일
        </div>

        <div
          class="info-value"
          id="detailPublishDate"
        ></div>

      </div>


      <div class="info-row">

        <div class="info-label">
          페이지
        </div>

        <div
          class="info-value"
          id="detailPages"
        ></div>

      </div>

    </div>



    <div class="actions">

      <button
        class="action edit"
        id="editButton"
        type="button"
      >
        수정
      </button>


      <button
        class="action delete"
        id="deleteButton"
        type="button"
      >
        삭제
      </button>

    </div>


    <button
      class="close"
      id="closeButton"
      type="button"
    >
      닫기
    </button>

  </div>

</div>



<script>


/* =========================================================
   API
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwZYQkLeKQ0C-IZyp4Wx7N-UEybymNhX2Cmp7BCRdxL6HMAzzJJN_iKxJFxfo1W2XBK/exec";



/* =========================================================
   USER
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const user =
  params.get("user") ||
  localStorage.getItem(
    "currentBookUser"
  ) ||
  "";


if (!user) {

  window.location.href =
    "./index.html";

}


localStorage.setItem(
  "currentBookUser",
  user
);



/* =========================================================
   MONTH
========================================================= */

const today =
  new Date();


let year =
  Number(
    params.get("year")
  ) ||
  today.getFullYear();


let month =
  Number(
    params.get("month")
  ) ||
  today.getMonth() + 1;



let currentBooks = [];

let selectedBook = null;

let resizeTimer = null;



document
  .getElementById(
    "shelfTitle"
  )
  .textContent =
  user + "의 책장";


loadBooks();



/* =========================================================
   BOOKS LOAD
========================================================= */

async function loadBooks() {

  updateMonth();


  const shelfList =
    document.getElementById(
      "shelfList"
    );


  shelfList.innerHTML = `

    <div class="loading">
      책장을 불러오는 중…
    </div>

  `;


  document
    .getElementById(
      "bookCount"
    )
    .textContent =
    "불러오는 중…";


  try {

    const response =
      await fetch(
        API_URL +
        "?action=books" +
        "&user=" +
        encodeURIComponent(user) +
        "&year=" +
        year +
        "&month=" +
        month +
        "&t=" +
        Date.now()
      );


    const text =
      await response.text();


    const data =
      JSON.parse(text);


    if (!data.success) {

      throw new Error(
        data.message ||
        "책 목록을 불러오지 못했습니다."
      );

    }


    currentBooks =
      Array.isArray(data.books)
        ? data.books
        : [];
        
        console.log("책 데이터 확인", currentBooks);

    document
      .getElementById(
        "bookCount"
      )
      .textContent =
      currentBooks.length +
      "권 읽었어요";


    renderShelves();


  } catch (error) {

    console.error(
      error
    );


    shelfList.innerHTML = `

      <div class="empty">

        <div class="empty-mark"></div>

        <div class="empty-title">
          책장을 불러오지 못했어요.
        </div>

        <div class="empty-text">
          잠시 후 다시 시도해주세요.
        </div>

      </div>

    `;


    document
      .getElementById(
        "bookCount"
      )
      .textContent =
      "연결 오류";

  }

}



/* =========================================================
   SHELF PACKING

   권수 제한 없음.
   폭을 넘으려는 책부터 다음 선반.
========================================================= */

function packBooksIntoShelves(
  books,
  availableWidth
) {

  const shelves = [];


  let currentShelf = [];

  let usedWidth = 0;


  const gap = 2;


  books.forEach(
    function(book) {

      const width =
        getBookWidth(
          book
        );


      const gapBefore =
        currentShelf.length > 0
          ? gap
          : 0;


      const requiredWidth =
        usedWidth +
        gapBefore +
        width;


      if (
        currentShelf.length > 0 &&
        requiredWidth >
        availableWidth
      ) {

        shelves.push(
          currentShelf
        );


        currentShelf = [];

        usedWidth = 0;

      }


      const actualGap =
        currentShelf.length > 0
          ? gap
          : 0;


      currentShelf.push(
        book
      );


      usedWidth +=
        actualGap +
        width;

    }
  );


  if (
    currentShelf.length > 0
  ) {

    shelves.push(
      currentShelf
    );

  }


  return shelves;

}



/* =========================================================
   RENDER SHELVES
========================================================= */

function renderShelves() {

  const shelfList =
    document.getElementById(
      "shelfList"
    );


  shelfList.innerHTML =
    "";


  if (
    !currentBooks.length
  ) {

    shelfList.innerHTML = `

      <div class="empty">

        <div class="empty-mark"></div>

        <div class="empty-title">
          아직 책이 없어요.
        </div>

        <div class="empty-text">
          읽은 책을 한 권 꽂아보세요.
        </div>

      </div>

    `;

    return;

  }


  const availableWidth =
    Math.max(
      180,
      shelfList.clientWidth - 20
    );


  const shelves =
    packBooksIntoShelves(
      currentBooks,
      availableWidth
    );


  shelves.forEach(
    function(
      books,
      shelfIndex
    ) {

      const unit =
        document.createElement(
          "div"
        );


      unit.className =
        "shelf-unit";


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "books-row";


      books.forEach(
        function(book) {

          row.appendChild(
            createBook(
              book
            )
          );

        }
      );


      const board =
        document.createElement(
          "div"
        );


      board.className =
        "shelf-board";


      const shelfNumber =
        document.createElement(
          "div"
        );


      shelfNumber.className =
        "shelf-number";


      shelfNumber.textContent =
        String(
          shelfIndex + 1
        )
        .padStart(
          2,
          "0"
        );


      unit.appendChild(
        row
      );


      unit.appendChild(
        board
      );


      unit.appendChild(
        shelfNumber
      );


      shelfList.appendChild(
        unit
      );

    }
  );

}



/* =========================================================
   Q열 두께mm → 책등 너비
========================================================= */

function getBookWidth(
  book
) {

  const thickness =
    Number(
      book.bookHeight ||
      book.bookThickness ||
      0
    );


  if (
    Number.isFinite(thickness) &&
    thickness > 0
  ) {

    return clamp(
      Math.round(
        thickness * 1.5
      ),
      13,
      68
    );

  }


  return 27;

}



/* =========================================================
   P열 세로mm → 책 높이

   모바일에서도 차이가 눈에 띄도록
   실제 판형 차이를 약간 강조해서 표현.

   예)
   180mm → 약 181px
   194mm → 약 199px
   210mm → 약 220px
   230mm → 약 246px
========================================================= */

function getBookHeight(
  book
) {

  const length =
    Number(
      book.bookLength ||
      0
    );


  if (
    Number.isFinite(length) &&
    length > 0
  ) {

    return clamp(
      Math.round(
        (length - 150) *
        1.3 +
        142
      ),
      168,
      246
    );

  }


  return 202;

}



/* =========================================================
   CREATE BOOK
========================================================= */

function createBook(
  book
) {

  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "book";


  const bookWidth =
    getBookWidth(
      book
    );


  const bookHeight =
    getBookHeight(
      book
    );


  /*
    iOS에서 style.height가
    명확하게 적용되도록
    width / height / minHeight / maxHeight
    전부 같은 값으로 지정.
  */

  button.style.width =
    bookWidth +
    "px";


  button.style.minWidth =
    bookWidth +
    "px";


  button.style.maxWidth =
    bookWidth +
    "px";


  button.style.height =
    bookHeight +
    "px";


  button.style.minHeight =
    bookHeight +
    "px";


  button.style.maxHeight =
    bookHeight +
    "px";


  button.setAttribute(
    "aria-label",
    book.title ||
    "책 상세 보기"
  );


  const spineUrl =
    book.spineUrl ||
    makeSpineUrl(
      book.itemId
    );


  if (
    spineUrl
  ) {

    attachSpineImage(
      button,
      book,
      spineUrl
    );


  } else {

    showFallbackSpine(
      button,
      book
    );

  }


  button.addEventListener(
    "click",
    function() {

      openDetail(
        book
      );

    }
  );


  return button;

}



/* =========================================================
   SPINE IMAGE
========================================================= */

function attachSpineImage(
  button,
  book,
  url
) {

  const image =
    document.createElement(
      "img"
    );


  image.referrerPolicy =
    "no-referrer";


  image.decoding =
    "async";


  image.src =
    url;


  image.alt =
    (
      book.title ||
      ""
    ) +
    " 책등";


  image.addEventListener(
    "load",
    function() {

      const naturalWidth =
        Number(
          image.naturalWidth
        );


      const naturalHeight =
        Number(
          image.naturalHeight
        );


      if (
        !naturalWidth ||
        !naturalHeight
      ) {

        return;

      }


      const ratio =
        naturalWidth /
        naturalHeight;


      /*
        책등이라 보기 어려울 정도로
        넓은 이미지면
        YES24 대체 이미지로 판단.
      */

      if (
        ratio > 0.62
      ) {

        showFallbackSpine(
          button,
          book
        );

      }

    }
  );


  image.addEventListener(
    "error",
    function() {

      const automaticUrl =
        makeSpineUrl(
          book.itemId
        );


      if (
        automaticUrl &&
        image.dataset.retry !== "1" &&
        normalizeUrl(
          image.src
        ) !==
        normalizeUrl(
          automaticUrl
        )
      ) {

        image.dataset.retry =
          "1";


        image.src =
          automaticUrl;


        return;

      }


      showFallbackSpine(
        button,
        book
      );

    }
  );


  button.appendChild(
    image
  );

}



/* =========================================================
   YES24 SIDE URL
========================================================= */

function makeSpineUrl(
  itemId
) {

  if (
    !itemId
  ) {

    return "";

  }


  return (
    "https://image.yes24.com/goods/detail/" +
    encodeURIComponent(
      itemId
    ) +
    "/side"
  );

}



/* =========================================================
   FALLBACK SPINE
========================================================= */

function showFallbackSpine(
  button,
  book
) {

  button.innerHTML =
    "";


  const palettes = [

    {
      background: "#0e4b37",
      text: "#f7f3e9"
    },

    {
      background: "#e8ddc4",
      text: "#20241f"
    },

    {
      background: "#d97968",
      text: "#20241f"
    },

    {
      background: "#e9b936",
      text: "#20241f"
    },

    {
      background: "#24362d",
      text: "#f7f3e9"
    },

    {
      background: "#eee9dc",
      text: "#0e4b37"
    },

    {
      background: "#9f695e",
      text: "#fff9ed"
    },

    {
      background: "#d6c29d",
      text: "#183e31"
    }

  ];


  const index =
    getBookColorIndex(
      book,
      palettes.length
    );


  const palette =
    palettes[index];


  const fallback =
    document.createElement(
      "div"
    );


  fallback.className =
    "fallback-spine";


  fallback.style.background =
    palette.background;


  fallback.style.color =
    palette.text;


  const title =
    document.createElement(
      "span"
    );


  title.className =
    "fallback-title";


  title.textContent =
    book.title ||
    "BOOK";


  fallback.appendChild(
    title
  );


  button.appendChild(
    fallback
  );

}



/* =========================================================
   같은 책은 항상 같은 색
========================================================= */

function getBookColorIndex(
  book,
  paletteLength
) {

  const text =
    String(
      book.itemId ||
      book.title ||
      ""
    );


  let hash =
    0;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    hash =
      (
        hash * 31 +
        text.charCodeAt(i)
      ) >>> 0;

  }


  return (
    hash %
    paletteLength
  );

}



/* =========================================================
   MONTH
========================================================= */

function updateMonth() {

  document
    .getElementById(
      "monthLabel"
    )
    .textContent =
    year +
    " · " +
    String(month)
      .padStart(
        2,
        "0"
      );

}



/* 이전 달 */

document
  .getElementById(
    "prevMonth"
  )
  .addEventListener(
    "click",
    function() {

      month--;


      if (
        month < 1
      ) {

        month =
          12;


        year--;

      }


      updateAddress();


      loadBooks();

    }
  );



/* 다음 달 */

document
  .getElementById(
    "nextMonth"
  )
  .addEventListener(
    "click",
    function() {

      month++;


      if (
        month > 12
      ) {

        month =
          1;


        year++;

      }


      updateAddress();


      loadBooks();

    }
  );



function updateAddress() {

  const next =
    "./shelf.html" +
    "?user=" +
    encodeURIComponent(
      user
    ) +
    "&year=" +
    year +
    "&month=" +
    month;


  window.history.replaceState(
    null,
    "",
    next
  );

}

   RESIZE
========================================================= */

window.addEventListener(

      resizeTimer
    );


    resizeTimer =

          ) {

);



/* =========================================================
   DETAIL
========================================================= */

function openDetail(
  book
) {

  selectedBook =
    book;


  const cover =
    document.getElementById(
      "detailCover"
    );


  cover.referrerPolicy =
    "no-referrer";


  if (
    book.coverUrl
  ) {

    cover.src =
      book.coverUrl;


    cover.style.display =
      "block";


  } else {

    cover.removeAttribute(
      "src"
    );


    cover.style.display =
      "none";

  }


  document
    .getElementById(
      "detailTitle"
    )
    .textContent =
    book.title ||
    "";


  document
    .getElementById(
      "detailAuthor"
    )
    .textContent =
    book.author ||
    "";


  document
    .getElementById(
      "detailPublisher"
    )
    .textContent =
    book.publisher ||
    "";


  document
    .getElementById(
      "detailRating"
    )
    .textContent =
    makeStars(
      Number(
        book.rating ||
        0
      )
    );


  document
    .getElementById(
      "detailFinishDate"
    )
    .textContent =
    formatDate(
      book.finishDate
    );


  document
    .getElementById(
      "detailPublishDate"
    )
    .textContent =
    formatPublishDate(
      book.publishDate
    ) ||
    "-";


  document
    .getElementById(
      "detailPages"
    )
    .textContent =
    Number(
      book.pages
    ) > 0
      ? Number(
          book.pages
        ) +
        "쪽"

      : "-";


  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "show"
    );

}



/* =========================================================
   EDIT
========================================================= */

document
  .getElementById(
    "editButton"
  )
  .addEventListener(
    "click",
    function() {

      if (
        !selectedBook
      ) {

        return;

      }


      sessionStorage.setItem(
        "selectedBook",
        JSON.stringify(
          selectedBook
        )
      );


      window.location.href =

          user
        );

    }
  );



/* =========================================================
   DELETE
========================================================= */

document
  .getElementById(
    "deleteButton"
  )
  .addEventListener(
    "click",
    async function() {

      if (
        !selectedBook
      ) {

        return;

      }


      const ok =
        confirm(
          "「" +
          (
            selectedBook.title ||
            "이 책"
          ) +
          "」 기록을 삭제할까요?"
        );


      if (
        !ok
      ) {

        return;

      }


      try {

        const response =
          await fetch(
            API_URL,
            {

              method:
                "POST",


              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },


              body:
                JSON.stringify({

                  action:
                    "deleteBook",

                  id:
                    selectedBook.id

                })

            }
          );


        const text =
          await response.text();


        const data =
          JSON.parse(
            text
          );


        if (
          !data.success
        ) {

          throw new Error(
            data.message ||
            "삭제 실패"
          );

        }


        closeDetail();


        await loadBooks();


      } catch (error) {

        console.error(
          error
        );


        alert(
          "책 기록을 삭제하지 못했어요."
        );

      }

    }
  );



/* =========================================================
   CLOSE
========================================================= */

function closeDetail() {

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );

}



document
  .getElementById(
    "closeButton"
  )
  .addEventListener(
    "click",

  );



document
  .getElementById(

  )
  .addEventListener(
    "click",

      if (
        event.target ===

      ) {

      }

    }
  );

/* =========================================================
   HELPERS
========================================================= */

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}



function normalizeUrl(
  value
) {

  return String(
    value ||
    ""
  )
  .replace(
    /^https?:\/\//,
    ""
  )
  .replace(
    /\/+$/,
    ""
  );

}



function makeStars(
  value
) {

  const score =
    clamp(
      Math.round(
        Number(value) || 0
      ),
      0,
      5
    );


  return (
    "★".repeat(
      score
    ) +
    "☆".repeat(
      5 - score
    )
  );

}



function formatDate(
  value
) {

  if (
    !value
  ) {

    return "-";

  }


  const original =
    String(value);


  const match =
    original.match(
      /(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/
    );


  if (
    match
  ) {

    return (
      match[1] +
      "." +
      String(
        match[2]
      )
      .padStart(
        2,
        "0"
      ) +
      "." +
      String(
        match[3]
      )
      .padStart(
        2,
        "0"
      )
    );

  }


  return original;

}



function formatPublishDate(
  value
) {

  if (
    !value
  ) {

    return "";

  }


  const original =
    String(value)
      .trim();


  const digits =
    original.replace(
      /\D/g,
      ""
    );


  if (
    digits.length >= 8
  ) {

    return (
      digits.slice(
        0,
        4
      ) +
      "." +
      digits.slice(
        4,
        6
      ) +
      "." +
      digits.slice(
        6,
        8
      )
    );

  }


  return original;

}
