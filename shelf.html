<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">

  <title>나의 책장</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
      background: #ebe7e1;
      color: #403a35;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 105px;
      background:
        linear-gradient(
          180deg,
          #faf8f4,
          #f2ede7
        );
    }

    /* 상단 */

    .top {
      display: flex;
      align-items: center;
      padding: 18px 20px 0;
    }

    .back {
      display: flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: white;
      color: #685f58;
      text-decoration: none;
      font-size: 24px;
    }

    .logo {
      margin-left: auto;
      color: #9b918a;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.7px;
    }

    /* 제목 */

    .header {
      padding: 27px 20px 8px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -1.3px;
    }

    .header p {
      margin: 7px 0 0;
      color: #999088;
      font-size: 12px;
    }

    /* 월 */

    .month-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 20px;
    }

    .month-button {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: #716860;
      font-size: 27px;
    }

    .month-info {
      width: 170px;
      text-align: center;
    }

    .month-title {
      display: block;
      font-size: 21px;
      font-weight: 800;
    }

    .month-count {
      display: block;
      margin-top: 5px;
      color: #9f968f;
      font-size: 11px;
    }

    /* 책장 */

    .shelf-area {
      padding: 45px 17px 0;
    }

    .books {
      display: flex;
      min-height: 245px;
      align-items: flex-end;
      gap: 3px;
      padding: 0 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .books::-webkit-scrollbar {
      display: none;
    }

    .spine {
      flex-shrink: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 3px 3px 1px 1px;
      background: #8d786b;
      box-shadow:
        1px 1px 3px rgba(45,35,28,.15);
      transition: transform .15s ease;
    }

    .spine:active {
      transform: translateY(-6px);
    }

    .spine img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .fallback {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 5px 3px;
    }

    .fallback span {
      max-height: 94%;
      overflow: hidden;
      writing-mode: vertical-rl;
      color: white;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.3;
    }

    /* 나무판 */

    .wood {
      position: relative;
      height: 18px;
      background:
        linear-gradient(
          180deg,
          #bc906d,
          #9a6e50 58%,
          #825a40
        );
      border-radius: 2px 2px 6px 6px;
      box-shadow:
        0 8px 10px rgba(60,43,31,.17);
    }

    .wood::after {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: -6px;
      height: 6px;
      background: #724d35;
      border-radius: 0 0 6px 6px;
      content: "";
    }

    .empty {
      padding: 80px 15px 105px;
      color: #9c938c;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    /* 새 책 */

    .add-button {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 20;
      width: calc(100% - 40px);
      max-width: 470px;
      padding: 16px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 17px;
      background: #82736a;
      color: white;
      font-weight: 800;
      box-shadow:
        0 8px 20px rgba(64,49,40,.15);
    }

    /* 공통 팝업 */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(43,39,35,.42);
      backdrop-filter: blur(4px);
    }

    .overlay.show {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      padding: 12px 22px 28px;
      overflow-y: auto;
      border-radius: 27px 27px 0 0;
      background: #fbf9f5;
    }

    .handle {
      width: 42px;
      height: 4px;
      margin: 0 auto 23px;
      border-radius: 5px;
      background: #d3ccc6;
    }

    /* 상세 팝업 */

    .detail-top {
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .detail-cover {
      width: 105px;
      height: 150px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 6px;
      background: #e8e2dc;
      box-shadow:
        0 6px 16px rgba(50,38,29,.13);
    }

    .detail-info {
      min-width: 0;
      flex: 1;
    }

    .detail-info h2 {
      margin: 2px 0 8px;
      font-size: 20px;
      line-height: 1.4;
    }

    .author {
      color: #6f665e;
      font-size: 13px;
      line-height: 1.5;
    }

    .publisher {
      margin-top: 4px;
      color: #9b928b;
      font-size: 12px;
    }

    .rating-label {
      display: block;
      margin-top: 16px;
      color: #a09891;
      font-size: 10px;
      font-weight: 800;
    }

    .detail-stars {
      margin-top: 3px;
      color: #d59a3c;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .detail-table {
      margin-top: 23px;
      padding: 14px 0;
      border-top: 1px solid #e4ddd7;
      border-bottom: 1px solid #e4ddd7;
    }

    .detail-row {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      font-size: 12px;
    }

    .detail-label {
      width: 65px;
      flex-shrink: 0;
      color: #9e958e;
    }

    .detail-value {
      color: #5d554f;
    }

    .detail-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .detail-buttons button {
      padding: 13px;
      border: 0;
      border-radius: 14px;
      font-weight: 800;
    }

    .edit-button {
      background: #82736a;
      color: white;
    }

    .delete-button {
      background: #eee5df;
      color: #a15f57;
    }

    .close-button {
      width: 100%;
      margin-top: 7px;
      padding: 13px;
      border: 0;
      background: transparent;
      color: #99908a;
    }

    /* 새 책 팝업 */

    .add-title {
      margin: 0 0 5px;
      font-size: 24px;
      letter-spacing: -.8px;
    }

    .add-description {
      margin: 0 0 22px;
      color: #958b83;
      font-size: 12px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input,
    .date-input {
      width: 100%;
      height: 50px;
      padding: 0 13px;
      border: 1px solid #ddd4cc;
      border-radius: 14px;
      outline: none;
      background: white;
      color: #453e39;
    }

    .search-button {
      width: 70px;
      flex-shrink: 0;
      border: 0;
      border-radius: 14px;
      background: #82736a;
      color: white;
      font-weight: 800;
    }

    .search-results {
      margin-top: 12px;
    }

    .search-status {
      padding: 18px 5px;
      color: #9b928b;
      text-align: center;
      font-size: 12px;
    }

    .search-item {
      display: flex;
      width: 100%;
      gap: 12px;
      padding: 11px 2px;
      border: 0;
      border-bottom: 1px solid #ebe3dd;
      background: transparent;
      text-align: left;
    }

    .search-item img {
      width: 49px;
      height: 70px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 4px;
      background: #e9e3dd;
    }

    .search-item strong {
      display: block;
      margin: 3px 0 5px;
      color: #443d38;
      font-size: 14px;
      line-height: 1.4;
    }

    .search-item span {
      color: #928981;
      font-size: 11px;
      line-height: 1.5;
    }

    /* 선택한 책 */

    .selected-book {
      display: none;
      gap: 14px;
      align-items: center;
      margin-bottom: 21px;
      padding: 15px;
      border-radius: 17px;
      background: #f0ebe5;
    }

    .selected-book.show {
      display: flex;
    }

    .selected-book img {
      width: 66px;
      height: 95px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 5px;
    }

    .selected-book h3 {
      margin: 0 0 5px;
      font-size: 16px;
      line-height: 1.4;
    }

    .selected-book p {
      margin: 3px 0;
      color: #91877f;
      font-size: 11px;
    }

    /* 별점 입력 */

    .rating-input {
      display: flex;
      gap: 4px;
    }

    .rating-star {
      padding: 0;
      border: 0;
      background: transparent;
      color: #d2c9bf;
      font-size: 33px;
    }

    .rating-star.active {
      color: #d59a3c;
    }

    .save-book {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 17px;
      background: #82736a;
      color: white;
      font-weight: 800;
    }

    .save-book:disabled {
      opacity: .5;
    }

    .add-message {
      display: none;
      margin-top: 11px;
      padding: 12px;
      border-radius: 12px;
      background: #f5e8e5;
      color: #9b5b54;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>

<main class="app">

  <div class="top">

    <a
      class="back"
      href="index.html"
    >
      ‹
    </a>

    <div class="logo">
      MONTHLY BOOKSHELF
    </div>

  </div>

  <header class="header">

    <h1 id="ownerTitle"></h1>

    <p>
      한 달 동안 읽은 책들
    </p>

  </header>

  <section class="month-row">

    <button
      class="month-button"
      id="prevMonth"
      type="button"
    >
      ‹
    </button>

    <div class="month-info">

      <strong
        class="month-title"
        id="monthTitle"
      ></strong>

      <span
        class="month-count"
        id="monthCount"
      ></span>

    </div>

    <button
      class="month-button"
      id="nextMonth"
      type="button"
    >
      ›
    </button>

  </section>

  <section class="shelf-area">

    <div
      class="books"
      id="books"
    ></div>

    <div
      class="empty"
      id="empty"
      style="display:none;"
    >
      이번 달에는 아직 책이 없어요.<br>
      첫 책을 꽂아볼까요?
    </div>

    <div class="wood"></div>

  </section>

</main>

<button
  class="add-button"
  id="openAddBook"
  type="button"
>
  ＋ 새 책 꽂기
</button>


<!-- =========================
     책 상세 팝업
========================= -->

<div
  class="overlay"
  id="detailOverlay"
>

  <div class="sheet">

    <div class="handle"></div>

    <div class="detail-top">

      <img
        class="detail-cover"
        id="detailCover"
        alt="책 표지"
        referrerpolicy="no-referrer"
      >

      <div class="detail-info">

        <h2 id="detailTitle"></h2>

        <div
          class="author"
          id="detailAuthor"
        ></div>

        <div
          class="publisher"
          id="detailPublisher"
        ></div>

        <span class="rating-label">
          내 별점
        </span>

        <div
          class="detail-stars"
          id="detailStars"
        ></div>

      </div>

    </div>

    <div class="detail-table">

      <div class="detail-row">
        <span class="detail-label">완독일</span>
        <span class="detail-value" id="detailFinishDate"></span>
      </div>

      <div class="detail-row">
        <span class="detail-label">출간일</span>
        <span class="detail-value" id="detailPublishDate"></span>
      </div>

      <div class="detail-row">
        <span class="detail-label">페이지</span>
        <span class="detail-value" id="detailPages"></span>
      </div>

      <div class="detail-row">
        <span class="detail-label">판형</span>
        <span class="detail-value" id="detailSize"></span>
      </div>

    </div>

    <div class="detail-buttons">

      <button
        class="edit-button"
        id="editBook"
        type="button"
      >
        수정
      </button>

      <button
        class="delete-button"
        id="deleteBook"
        type="button"
      >
        삭제
      </button>

    </div>

    <button
      class="close-button"
      id="closeDetail"
      type="button"
    >
      닫기
    </button>

  </div>

</div>


<!-- =========================
     새 책 추가 팝업
========================= -->

<div
  class="overlay"
  id="addOverlay"
>

  <div class="sheet">

    <div class="handle"></div>

    <h2
      class="add-title"
      id="addTitle"
    >
      새 책 꽂기
    </h2>

    <p class="add-description">
      YES24에서 책을 검색한 뒤 완독일과 별점을 기록해요.
    </p>

    <div
      class="field"
      id="searchField"
    >

      <label>
        책 검색
      </label>

      <div class="search-row">

        <input
          class="search-input"
          id="searchInput"
          type="search"
          placeholder="예: 채식주의자"
        >

        <button
          class="search-button"
          id="searchButton"
          type="button"
        >
          검색
        </button>

      </div>

      <div
        class="search-results"
        id="searchResults"
      ></div>

    </div>


    <div
      class="selected-book"
      id="selectedBookBox"
    >

      <img
        id="selectedCover"
        alt="선택한 책"
        referrerpolicy="no-referrer"
      >

      <div>

        <h3 id="selectedTitle"></h3>

        <p id="selectedAuthor"></p>

        <p id="selectedPublisher"></p>

      </div>

    </div>


    <div class="field">

      <label>
        완독일
      </label>

      <input
        class="date-input"
        id="finishDateInput"
        type="date"
      >

    </div>


    <div class="field">

      <label>
        별점
      </label>

      <div class="rating-input">

        <button class="rating-star" data-rating="1" type="button">★</button>
        <button class="rating-star" data-rating="2" type="button">★</button>
        <button class="rating-star" data-rating="3" type="button">★</button>
        <button class="rating-star" data-rating="4" type="button">★</button>
        <button class="rating-star" data-rating="5" type="button">★</button>

      </div>

    </div>


    <button
      class="save-book"
      id="saveBook"
      type="button"
    >
      책장에 꽂기
    </button>

    <div
      class="add-message"
      id="addMessage"
    ></div>

    <button
      class="close-button"
      id="closeAdd"
      type="button"
    >
      취소
    </button>

  </div>

</div>


<script>

/* =========================
   연결 주소
========================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


/* =========================
   기본 사용자 / 날짜
========================= */

const params =
  new URLSearchParams(
    location.search
  );


const currentUser =
  params.get("user") ||
  localStorage.getItem(
    "currentBookUser"
  ) ||
  "";


if (!currentUser) {

  location.href =
    "index.html";

}


localStorage.setItem(
  "currentBookUser",
  currentUser
);


document
  .getElementById("ownerTitle")
  .textContent =
    currentUser +
    "의 책장";


const now =
  new Date();


let currentYear =
  Number(
    params.get("year")
  ) ||
  now.getFullYear();


let currentMonth =
  Number(
    params.get("month")
  ) ||
  now.getMonth() + 1;


let selectedDetailBook =
  null;


let selectedAddBook =
  null;


let currentRating =
  0;


let editMode =
  false;


/* =========================
   월 이동
========================= */

document
  .getElementById("prevMonth")
  .onclick =
    function() {

      currentMonth--;

      if (currentMonth < 1) {

        currentMonth = 12;
        currentYear--;

      }

      loadBooks();

    };


document
  .getElementById("nextMonth")
  .onclick =
    function() {

      currentMonth++;

      if (currentMonth > 12) {

        currentMonth = 1;
        currentYear++;

      }

      loadBooks();

    };


/* =========================
   책 목록
========================= */

loadBooks();


async function loadBooks() {

  document
    .getElementById("monthTitle")
    .textContent =
      currentYear +
      "년 " +
      currentMonth +
      "월";


  document
    .getElementById("monthCount")
    .textContent =
      "불러오는 중…";


  try {

    const response =
      await fetch(
        API_URL +
        "?action=books" +
        "&user=" +
        encodeURIComponent(
          currentUser
        ) +
        "&year=" +
        currentYear +
        "&month=" +
        currentMonth +
        "&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    const books =
      data.books || [];


    document
      .getElementById("monthCount")
      .textContent =
        books.length +
        "권 읽었어요";


    renderBooks(
      books
    );


  } catch (error) {

    console.error(error);


    document
      .getElementById("monthCount")
      .textContent =
        "연결 오류";

  }

}


function renderBooks(books) {

  const container =
    document.getElementById(
      "books"
    );


  const empty =
    document.getElementById(
      "empty"
    );


  container.innerHTML =
    "";


  if (!books.length) {

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  books.forEach(
    function(book, index) {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "spine";


      /*
       * YES24 실제 판형
       * length = 책 세로
       * height = 책 두께
       */

      const realLength =
        Number(
          book.bookLength || 195
        );


      const realThickness =
        Number(
          book.bookHeight || 20
        );


      const screenHeight =
        clamp(
          realLength * 0.95,
          165,
          230
        );


      const screenWidth =
        clamp(
          realThickness * 1.45,
          21,
          55
        );


      button.style.height =
        screenHeight +
        "px";


      button.style.width =
        screenWidth +
        "px";


      if (book.spineUrl) {

        const image =
          document.createElement(
            "img"
          );


        image.src =
          book.spineUrl;


        image.alt =
          book.title;


        image.referrerPolicy =
          "no-referrer";


        image.onerror =
          function() {

            button.innerHTML =
              "";

            makeFallback(
              button,
              book,
              index
            );

          };


        button.appendChild(
          image
        );


      } else {

        makeFallback(
          button,
          book,
          index
        );

      }


      button.onclick =
        function() {

          openDetail(
            book
          );

        };


      container.appendChild(
        button
      );

    }
  );

}


function makeFallback(
  button,
  book,
  index
) {

  const colors = [
    "#937068",
    "#70806c",
    "#ad895e",
    "#746760",
    "#a27b6e",
    "#6c7c87",
    "#8d7968"
  ];


  button.style.background =
    colors[
      index %
      colors.length
    ];


  const wrap =
    document.createElement(
      "div"
    );


  wrap.className =
    "fallback";


  const title =
    document.createElement(
      "span"
    );


  title.textContent =
    book.title;


  wrap.appendChild(
    title
  );


  button.appendChild(
    wrap
  );

}


/* =========================
   상세 팝업
========================= */

function openDetail(book) {

  selectedDetailBook =
    book;


  const cover =
    document.getElementById(
      "detailCover"
    );


  cover.src =
    book.coverUrl ||
    "";


  cover.referrerPolicy =
    "no-referrer";


  document
    .getElementById("detailTitle")
    .textContent =
      book.title || "";


  document
    .getElementById("detailAuthor")
    .textContent =
      book.author || "";


  document
    .getElementById("detailPublisher")
    .textContent =
      book.publisher || "";


  const rating =
    Math.round(
      Number(
        book.rating || 0
      )
    );


  document
    .getElementById("detailStars")
    .textContent =
      "★".repeat(rating) +
      "☆".repeat(
        Math.max(
          0,
          5 - rating
        )
      );


  document
    .getElementById("detailFinishDate")
    .textContent =
      formatDate(
        book.finishDate
      );


  document
    .getElementById("detailPublishDate")
    .textContent =
      formatPublishDate(
        book.publishDate
      );


  document
    .getElementById("detailPages")
    .textContent =
      book.pages
        ? book.pages +
          "쪽"
        : "-";


  const width =
    Number(
      book.bookWidth || 0
    );


  const length =
    Number(
      book.bookLength || 0
    );


  const thickness =
    Number(
      book.bookHeight || 0
    );


  document
    .getElementById("detailSize")
    .textContent =
      width &&
      length &&
      thickness
        ? width +
          " × " +
          length +
          " × " +
          thickness +
          " mm"
        : "-";


  document
    .getElementById("detailOverlay")
    .classList.add(
      "show"
    );

}


document
  .getElementById("closeDetail")
  .onclick =
    function() {

      document
        .getElementById("detailOverlay")
        .classList.remove(
          "show"
        );

    };


/* =========================
   새 책 창
========================= */

document
  .getElementById("openAddBook")
  .onclick =
    function() {

      editMode =
        false;


      selectedAddBook =
        null;


      currentRating =
        0;


      document
        .getElementById("addTitle")
        .textContent =
          "새 책 꽂기";


      document
        .getElementById("searchField")
        .style.display =
          "block";


      document
        .getElementById("selectedBookBox")
        .classList.remove(
          "show"
        );


      document
        .getElementById("searchInput")
        .value =
          "";


      document
        .getElementById("searchResults")
        .innerHTML =
          "";


      document
        .getElementById("saveBook")
        .textContent =
          "책장에 꽂기";


      document
        .getElementById("addMessage")
        .style.display =

      setToday();

      document
        .getElementById("addOverlay")

document
  .getElementById("closeAdd")
  .onclick =

/* =========================
   검색
========================= */

document
  .getElementById("searchButton")
  .onclick =
    searchBooks;


document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        searchBooks();

      }

    }
  );


async function searchBooks() {

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim();


  if (!query) {

    showAddMessage(
      "책 제목을 입력해주세요."
    );

    return;

  }


  const results =
    document.getElementById(
      "searchResults"
    );


  results.innerHTML = `
    <div class="search-status">
      YES24에서 책을 찾고 있어요…
    </div>
  `;


  try {

    const response =
      await fetch(
        API_URL +
        "?action=search&q=" +
        encodeURIComponent(
          query
        ) +
        "&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    renderSearchResults(
      data.books || []
    );


  } catch (error) {

    console.error(error);


    results.innerHTML = `
      <div class="search-status">
        검색하지 못했어요.
      </div>
    `;

  }

}


function renderSearchResults(books) {

  const container =
    document.getElementById(
      "searchResults"
    );


  container.innerHTML =
    "";


  if (!books.length) {

    container.innerHTML = `
      <div class="search-status">
        검색 결과가 없어요.
      </div>
    `;

    return;

  }


  books.forEach(
    function(book) {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "search-item";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        book.coverUrl ||
        "";


      image.referrerPolicy =
        "no-referrer";


      image.alt =
        book.title ||
        "";


      const text =
        document.createElement(
          "div"
        );


      const title =
        document.createElement(
          "strong"
        );


      title.textContent =
        book.title ||
        "";


      const meta =
        document.createElement(
          "span"
        );


      let metaText =
        book.author ||
        "";


      if (book.publisher) {

        metaText +=
          " · " +
          book.publisher;

      }


      if (book.publishDate) {

        metaText +=
          "\n" +
          formatPublishDate(
            book.publishDate
          );

      }


      if (book.pages) {

        metaText +=
          " · " +
          book.pages +
          "쪽";

      }


      meta.style.whiteSpace =
        "pre-line";


      meta.textContent =
        metaText;


      text.appendChild(
        title
      );


      text.appendChild(
        meta
      );


      button.appendChild(
        image
      );


      button.appendChild(
        text
      );


      button.onclick =
        function() {

          selectedAddBook =
            book;


          showSelectedBook();


          container.innerHTML =
            "";

        };


      container.appendChild(
        button
      );

    }
  );

}


/* =========================
   선택한 책
========================= */

function showSelectedBook() {

  if (!selectedAddBook) {
    return;
  }


  const cover =
    document.getElementById(
      "selectedCover"
    );


  cover.src =
    selectedAddBook.coverUrl ||
    "";


  cover.referrerPolicy =
    "no-referrer";


  document
    .getElementById("selectedTitle")
    .textContent =
      selectedAddBook.title ||
      "";


  document
    .getElementById("selectedAuthor")
    .textContent =
      selectedAddBook.author ||
      "";


  document
    .getElementById("selectedPublisher")
    .textContent =
      selectedAddBook.publisher ||
      "";


  document
    .getElementById("selectedBookBox")
    .classList.add(
      "show"
    );

}


/* =========================
   별점
========================= */

document
  .querySelectorAll(
    ".rating-star"
  )
  .forEach(
    function(button) {

      button.onclick =
        function() {

          currentRating =
            Number(
              button.dataset.rating
            );


          paintRating();

        };

    }
  );


function paintRating() {

  document
    .querySelectorAll(
      ".rating-star"
    )
    .forEach(
      function(button) {

        const value =
          Number(
            button.dataset.rating
          );


        button.classList.toggle(
          "active",
          value <= currentRating
        );

      }
    );

}


/* =========================
   저장
========================= */

document
  .getElementById("saveBook")
  .onclick =
    saveBook;


async function saveBook() {

  if (!selectedAddBook) {

    showAddMessage(
      "먼저 책을 검색해서 선택해주세요."
    );

    return;

  }


  const finishDate =
    document
      .getElementById("finishDateInput")
      .value;


  if (!finishDate) {

    showAddMessage(
      "완독일을 선택해주세요."
    );

    return;

  }


  if (!currentRating) {

    showAddMessage(
      "별점을 선택해주세요."
    );

    return;

  }


  const button =
    document.getElementById(
      "saveBook"
    );


  button.disabled =
    true;


  button.textContent =
    editMode
      ? "수정 중…"
      : "책장에 꽂는 중…";


  const body = {

    action:
      editMode
        ? "updateBook"
        : "saveBook",

    id:
      editMode &&
      selectedDetailBook
        ? selectedDetailBook.id
        : "",

    user:
      currentUser,

    finishDate:
      finishDate,

    rating:
      currentRating,

    itemId:
      selectedAddBook.itemId ||
      "",

    title:
      selectedAddBook.title ||
      "",

    author:
      selectedAddBook.author ||
      "",

    publisher:
      selectedAddBook.publisher ||
      "",

    publishDate:
      selectedAddBook.publishDate ||
      "",

    pages:
      selectedAddBook.pages ||
      0,

    coverUrl:
      selectedAddBook.coverUrl ||
      "",

    spineUrl:
      selectedAddBook.spineUrl ||
      "",

    bookWidth:
      selectedAddBook.bookWidth ||
      0,

    bookLength:
      selectedAddBook.bookLength ||
      0,

    bookHeight:
      selectedAddBook.bookHeight ||
      0

  };


  try {

    const response =
      await fetch(
        API_URL,
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              body
            )
        }
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    const savedDate =
      new Date(
        finishDate +
        "T12:00:00"
      );


    currentYear =
      savedDate.getFullYear();


    currentMonth =
      savedDate.getMonth() + 1;


    closeAdd();


    document
      .getElementById("detailOverlay")
      .classList.remove(
        "show"
      );


    await loadBooks();


  } catch (error) {

    console.error(error);


    showAddMessage(
      error.message ||
      "저장하지 못했어요."
    );


  } finally {

    button.disabled =
      false;


    button.textContent =
      editMode
        ? "수정 내용 저장"
        : "책장에 꽂기";

  }

}


/* =========================
   수정
========================= */

document
  .getElementById("editBook")
  .onclick =
    function() {

      if (!selectedDetailBook) {
        return;
      }


      editMode =
        true;


      selectedAddBook =
        { ...selectedDetailBook };


      currentRating =
        Number(
          selectedDetailBook.rating ||
          0
        );


      document
        .getElementById("addTitle")
        .textContent =
          "책 기록 수정";


      /*
       * 수정할 때는 책 자체를 다시
       * 검색할 필요 없이 날짜/별점만 수정
       */
      document
        .getElementById("searchField")
        .style.display =
          "none";


      document
        .getElementById("finishDateInput")
        .value =
          selectedDetailBook.finishDate ||
          "";


      document
        .getElementById("saveBook")
        .textContent =
          "수정 내용 저장";


      showSelectedBook();

      paintRating();


      document
        .getElementById("detailOverlay")
        .classList.remove(
          "show"
        );


      document
        .getElementById("addOverlay")
        .classList.add(
          "show"
        );

    };


/* =========================
   삭제
========================= */

document
  .getElementById("deleteBook")
  .onclick =
    async function() {

      if (!selectedDetailBook) {
        return;
      }


      const ok =
        confirm(
          "「" +
          selectedDetailBook.title +
          "」을 삭제할까요?"
        );


      if (!ok) {
        return;
      }


      try {

        const response =
          await fetch(
            API_URL,
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify({
                  action:
                    "deleteBook",

                  id:
                    selectedDetailBook.id
                })
            }
          );


        const data =
          JSON.parse(
            await response.text()
          );


        if (!data.success) {

          throw new Error(
            data.message
          );

        }


        document
          .getElementById("detailOverlay")
          .classList.remove(
            "show"
          );


        loadBooks();


      } catch (error) {

        console.error(error);


        alert(
          "삭제하지 못했어요."
        );

      }

    };


/* =========================
   기타
========================= */

function closeAdd() {

  document
    .getElementById("addOverlay")
    .classList.remove(
      "show"
    );

}


function showAddMessage(text) {

  const message =
    document.getElementById(
      "addMessage"
    );


  message.style.display =
    "block";


  message.textContent =
    text;

}


function setToday() {

  const today =
    new Date();


  document
    .getElementById("finishDateInput")
    .value =
      today.getFullYear() +
      "-" +
      String(
        today.getMonth() + 1
      ).padStart(
        2,
        "0"
      ) +
      "-" +
      String(
        today.getDate()
      ).padStart(
        2,
        "0"
      );

}


function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function formatDate(value) {

  if (!value) {
    return "-";
  }


  return String(value)
    .replace(
      /-/g,
      "."
    );

}


function formatPublishDate(value) {

  const text =
    String(
      value || ""
    );


  if (
    /^\d{8}$/.test(text)
  ) {

    return (
      text.slice(0,4) +
      "." +
      text.slice(4,6) +
      "." +
      text.slice(6,8)
    );

  }


  return text || "-";

}
