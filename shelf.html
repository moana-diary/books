<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="referrer"
    content="no-referrer"
  >

  <title>나의 책장</title>


  <style>

    :root {
      --cream: #f7f3e9;
      --paper: #fffdf7;
      --green: #0e4b37;
      --ink: #20241f;
      --muted: #77766e;
      --yellow: #e9b936;
      --coral: #d97968;
      --line: #ddd6c7;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
    }


    body {
      background: #ebe8e0;
      color: var(--ink);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
    }


    button {
      font: inherit;
      cursor: pointer;
    }


    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;

      margin: 0 auto;

      padding-bottom: 65px;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 13%,
          rgba(255,255,255,.5),
          transparent 30%
        ),
        var(--cream);
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 28px 25px 0;
    }


    .back {
      width: 45px;
      height: 45px;

      padding: 0;

      border: 1px solid var(--green);
      border-radius: 50%;

      background: transparent;

      color: var(--green);

      font-size: 28px;
    }


    .header-label {
      color: var(--green);

      font-size: 11px;
      font-weight: 900;

      letter-spacing: 3px;
    }


    /* =========================
       TITLE
    ========================= */

    .title-area {
      padding: 48px 29px 0;
    }


    h1 {
      margin: 0;

      color: var(--green);

      font-size: 42px;
      line-height: 1;

      letter-spacing: -3px;
    }


    .subtitle {
      margin: 11px 0 0;

      color: var(--muted);

      font-size: 14px;
    }


    /* =========================
       MONTH
    ========================= */

    .month-area {
      display: grid;

      grid-template-columns:
        48px
        1fr
        48px;

      align-items: center;

      margin: 47px 29px 0;
    }


    .month-button {
      width: 45px;
      height: 45px;

      padding: 0;

      border: 0;

      background: transparent;

      color: var(--green);

      font-size: 32px;
    }


    .month-center {
      text-align: center;
    }


    .month {
      color: var(--green);

      font-size: 28px;
      font-weight: 950;

      letter-spacing: -1.5px;
    }


    .count {
      margin-top: 6px;

      color: var(--muted);

      font-size: 13px;
    }


    /* =========================
       BOOKSHELF
    ========================= */

    .shelf-area {
      padding: 54px 20px 0;
    }


    .shelf-list {
      width: 100%;
    }


    .shelf-unit {
      position: relative;

      margin-bottom: 42px;
    }


    /*
      책 개수 제한 없음.

      들어가는 만큼 한 줄에 배치하고
      화면을 넘기 직전에 JS가
      다음 선반으로 넘긴다.
    */

    .books-row {
      display: flex;

      width: 100%;
      min-height: 235px;

      align-items: flex-end;
      justify-content: flex-start;

      gap: 2px;

      padding: 0 10px;

      overflow: hidden;
    }


    /* =========================
       BOOK
    ========================= */

    .book {
      position: relative;

      flex: 0 0 auto;

      padding: 0;

      overflow: hidden;

      border: 0;

      border-radius:
        2px 2px 0 0;

      background: #ded5c3;

      box-shadow:
        inset -1px 0
        rgba(0,0,0,.13);

      transition:
        transform .15s ease;
    }


    .book:active {
      transform:
        translateY(-5px);
    }


    /*
      실제 YES24 책등 이미지
    */

    .book img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: fill;
    }


    /* =========================
       자동 생성 책등
    ========================= */

    .fallback-spine {
      position: relative;

      display: flex;

      width: 100%;
      height: 100%;

      align-items: center;
      justify-content: center;

      padding: 8px 3px;

      color: #f8f1df;
    }


    .fallback-spine::before {
      position: absolute;

      top: 9px;
      left: 22%;
      right: 22%;

      height: 2px;

      background: currentColor;

      opacity: .4;

      content: "";
    }


    .fallback-spine::after {
      position: absolute;

      left: 24%;
      right: 24%;
      bottom: 10px;

      height: 5px;

      border-top:
        1px solid currentColor;

      border-bottom:
        1px solid currentColor;

      opacity: .45;

      content: "";
    }


    .fallback-title {
      max-height: 78%;

      overflow: hidden;

      font-size: 10px;
      font-weight: 800;

      line-height: 1.18;

      writing-mode: vertical-rl;
      text-orientation: mixed;
    }


    /* =========================
       SHELF BOARD
    ========================= */

    .shelf-board {
      position: relative;

      width: 100%;
      height: 18px;

      border-radius: 10px;

      background: var(--green);
    }


    .shelf-board::after {
      position: absolute;

      left: 13px;
      right: 13px;
      bottom: -7px;

      height: 7px;

      border-radius:
        0 0 5px 5px;

      background: #d5ba84;

      content: "";
    }


    .shelf-number {
      margin-top: 13px;

      color: #aaa295;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 2px;

      text-align: right;
    }


    /* =========================
       EMPTY
    ========================= */

    .empty {
      padding: 70px 20px;

      color: var(--muted);

      text-align: center;
    }


    .empty-title {
      color: var(--green);

      font-size: 19px;
      font-weight: 900;
    }


    .empty-text {
      margin-top: 8px;

      font-size: 13px;
    }


    /* =========================
       ADD
    ========================= */

    .add-area {
      padding: 2px 29px 0;
    }


    .add-button {
      width: 100%;
      height: 59px;

      border: 0;

      background: var(--green);

      color: white;

      font-size: 15px;
      font-weight: 900;
    }


    /* =========================
       LOADING
    ========================= */

    .loading {
      padding: 80px 20px;

      color: var(--muted);

      text-align: center;

      font-size: 13px;
    }


    /* =========================
       DETAIL
    ========================= */

    .overlay {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      align-items: flex-end;
      justify-content: center;

      background:
        rgba(10,31,24,.48);
    }


    .overlay.show {
      display: flex;
    }


    .detail {
      width: 100%;
      max-width: 520px;

      max-height: 88vh;

      padding: 18px 25px 31px;

      overflow-y: auto;

      border-radius:
        28px 28px 0 0;

      background: var(--paper);
    }


    .handle {
      width: 45px;
      height: 5px;

      margin: 0 auto 27px;

      border-radius: 10px;

      background: #d4cfc5;
    }


    .detail-top {
      display: grid;

      grid-template-columns:
        105px 1fr;

      gap: 18px;
    }


    .detail-cover {
      width: 105px;
      height: 151px;

      object-fit: cover;

      background: #e9e4da;
    }


    .detail-title {
      margin-top: 5px;

      font-size: 23px;
      font-weight: 950;

      line-height: 1.25;

      letter-spacing: -1px;
    }


    .detail-author {
      margin-top: 12px;

      color: #555950;

      font-size: 14px;
    }


    .detail-publisher {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
    }


    .rating-label {
      margin-top: 22px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 800;
    }


    .rating {
      margin-top: 4px;

      color: var(--yellow);

      font-size: 27px;

      letter-spacing: 1px;
    }


    .info {
      margin-top: 27px;

      padding: 21px 0;

      border-top:
        1px solid var(--line);

      border-bottom:
        1px solid var(--line);
    }


    .info-row {
      display: grid;

      grid-template-columns:
        82px 1fr;

      gap: 10px;

      margin-bottom: 12px;

      font-size: 13px;
    }


    .info-row:last-child {
      margin-bottom: 0;
    }


    .info-label {
      color: #99948b;

      font-weight: 700;
    }


    .info-value {
      color: #565951;
    }


    /* =========================
       ACTIONS
    ========================= */

    .actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-top: 27px;
    }


    .action {
      height: 52px;

      border: 0;

      font-weight: 900;
    }


    .edit {
      background: var(--green);

      color: white;
    }


    .delete {
      background: #eee7dc;

      color: #a05750;
    }


    .close {
      width: 100%;
      height: 48px;

      margin-top: 5px;

      border: 0;

      background: transparent;

      color: #8c887f;

      font-weight: 700;
    }


    @media (max-width: 370px) {

      .shelf-area {
        padding-left: 14px;
        padding-right: 14px;
      }


      .books-row {
        padding-left: 7px;
        padding-right: 7px;
      }

    }

  </style>

</head>


<body>


<main class="app">


  <!-- 상단 -->

  <header class="header">

    <button
      class="back"
      id="backButton"
      type="button"
    >
      ‹
    </button>


    <div class="header-label">
      MONTHLY BOOKSHELF
    </div>

  </header>


  <!-- 제목 -->

  <section class="title-area">

    <h1 id="shelfTitle">
      나의 책장
    </h1>

    <p class="subtitle">
      한 달 동안 읽은 책들
    </p>

  </section>


  <!-- 월 이동 -->

  <section class="month-area">

    <button
      class="month-button"
      id="prevMonth"
      type="button"
    >
      ‹
    </button>


    <div class="month-center">

      <div
        class="month"
        id="monthLabel"
      ></div>

      <div
        class="count"
        id="bookCount"
      ></div>

    </div>


    <button
      class="month-button"
      id="nextMonth"
      type="button"
    >
      ›
    </button>

  </section>


  <!-- 책장 -->

  <section class="shelf-area">

    <div
      class="shelf-list"
      id="shelfList"
    >

      <div class="loading">
        책장을 불러오는 중…
      </div>

    </div>

  </section>


  <!-- 새 책 -->

  <section class="add-area">

    <button
      class="add-button"
      id="addBook"
      type="button"
    >
      ＋ 새 책 꽂기
    </button>

  </section>


</main>



<!-- =========================
     책 상세 팝업
========================= -->

<div
  class="overlay"
  id="overlay"
>

  <div class="detail">

    <div class="handle"></div>


    <div class="detail-top">

      <img
        class="detail-cover"
        id="detailCover"
        referrerpolicy="no-referrer"
        alt="책 표지"
      >


      <div>

        <div
          class="detail-title"
          id="detailTitle"
        ></div>


        <div
          class="detail-author"
          id="detailAuthor"
        ></div>


        <div
          class="detail-publisher"
          id="detailPublisher"
        ></div>


        <div class="rating-label">
          내 별점
        </div>


        <div
          class="rating"
          id="detailRating"
        ></div>

      </div>

    </div>


    <div class="info">

      <div class="info-row">

        <div class="info-label">
          완독일
        </div>

        <div
          class="info-value"
          id="detailFinishDate"
        ></div>

      </div>


      <div class="info-row">

        <div class="info-label">
          출간일
        </div>

        <div
          class="info-value"
          id="detailPublishDate"
        >
          -
        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          페이지
        </div>

        <div
          class="info-value"
          id="detailPages"
        >
          -
        </div>

      </div>

    </div>


    <div class="actions">

      <button
        class="action edit"
        id="editButton"
        type="button"
      >
        수정
      </button>


      <button
        class="action delete"
        id="deleteButton"
        type="button"
      >
        삭제
      </button>

    </div>


    <button
      class="close"
      id="closeButton"
      type="button"
    >
      닫기
    </button>

  </div>

</div>



<script>


/* =========================
   기본 설정
========================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


const params =
  new URLSearchParams(
    window.location.search
  );


const user =
  params.get("user") ||
  localStorage.getItem(
    "currentBookUser"
  ) ||
  "";


if (!user) {

  window.location.href =
    "./index.html";

}


localStorage.setItem(
  "currentBookUser",
  user
);



/* =========================
   날짜
========================= */

const today =
  new Date();


let year =
  Number(
    params.get("year")
  ) ||
  today.getFullYear();


let month =
  Number(
    params.get("month")
  ) ||
  today.getMonth() + 1;



let currentBooks = [];

let selectedBook = null;

let resizeTimer = null;



document
  .getElementById(
    "shelfTitle"
  )
  .textContent =
  user + "의 책장";



loadBooks();



/* =========================
   책 목록 불러오기
========================= */

async function loadBooks() {

  updateMonth();


  const shelfList =
    document.getElementById(
      "shelfList"
    );


  shelfList.innerHTML = `
    <div class="loading">
      책장을 불러오는 중…
    </div>
  `;


  try {

    const response =
      await fetch(
        API_URL +
        "?action=books" +
        "&user=" +
        encodeURIComponent(user) +
        "&year=" +
        year +
        "&month=" +
        month +
        "&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message ||
        "불러오기 실패"
      );

    }


    currentBooks =
      data.books || [];


    /*
      기존에 저장해서 두께 정보가 없는 책은
      YES24 상세정보를 다시 확인한다.
    */

    await fillMissingThickness(
      currentBooks
    );


    document
      .getElementById(
        "bookCount"
      )
      .textContent =
      currentBooks.length +
      "권 읽었어요";


    renderShelves();


  } catch (error) {

    console.error(error);


    shelfList.innerHTML = `

      <div class="empty">

        <div class="empty-title">
          책장을 불러오지 못했어요.
        </div>

        <div class="empty-text">
          잠시 후 다시 시도해주세요.
        </div>

      </div>

    `;

  }

}



/* =========================
   기존 책 두께 보완
========================= */

async function fillMissingThickness(
  books
) {

  const targets =
    books.filter(
      function(book) {

        return (
          !Number(
            book.bookThickness
          ) &&
          book.itemId
        );

      }
    );


  for (
    const book of targets
  ) {

    try {

      const response =
        await fetch(
          API_URL +
          "?action=detail" +
          "&itemId=" +
          encodeURIComponent(
            book.itemId
          ) +
          "&t=" +
          Date.now()
        );


      const data =
        JSON.parse(
          await response.text()
        );


      if (
        data.success &&
        data.book
      ) {

        /*
          YES24의 bookHeight 값이
          책의 실제 두께.
        */

        book.bookThickness =
          Number(
            data.book.bookHeight ||
            data.book.bookThickness ||
            0
          );


        /*
          기존 데이터에 책등 URL이 없으면
          자동 책등 주소도 넣는다.
        */

        if (!book.spineUrl) {

          book.spineUrl =
            data.book.spineUrl ||
            makeSpineUrl(
              book.itemId
            );

        }

      }


    } catch (error) {

      console.error(
        "두께 정보 확인 실패:",
        book.title,
        error
      );

    }

  }

}



/* ======================================
   핵심

   책 개수 제한 없음.

   실제 두께를 순서대로 더하다가
   모바일 선반 폭을 넘어가려고 하면
   그 책부터 다음 선반으로 이동.
====================================== */

function packBooksIntoShelves(
  books,
  availableWidth
) {

  const shelves = [];


  let currentShelf = [];

  let usedWidth = 0;


  /*
    책 사이 실제 간격
  */

  const gap = 2;


  books.forEach(
    function(book) {

      const bookWidth =
        getBookWidth(
          book
        );


      const gapBefore =
        currentShelf.length > 0
          ? gap
          : 0;


      const nextTotal =
        usedWidth +
        gapBefore +
        bookWidth;


      /*
        다음 책을 현재 선반에 넣으면
        화면 밖으로 넘어가는 경우.

        지금까지 책은 현재 선반에 두고
        해당 책부터 새 선반으로 이동한다.
      */

      if (
        currentShelf.length > 0 &&
        nextTotal >
        availableWidth
      ) {

        shelves.push(
          currentShelf
        );


        currentShelf = [];

        usedWidth = 0;

      }


      /*
        새 선반의 첫 책이면 gap 없음.
      */

      const actualGap =
        currentShelf.length > 0
          ? gap
          : 0;


      currentShelf.push(
        book
      );


      usedWidth +=
        actualGap +
        bookWidth;

    }
  );


  /*
    마지막 선반
  */

  if (
    currentShelf.length > 0
  ) {

    shelves.push(
      currentShelf
    );

  }


  return shelves;

}



/* =========================
   책장 그리기
========================= */

function renderShelves() {

  const shelfList =
    document.getElementById(
      "shelfList"
    );


  shelfList.innerHTML = "";


  if (!currentBooks.length) {

    shelfList.innerHTML = `

      <div class="empty">

        <div class="empty-title">
          아직 책이 없어요.
        </div>

        <div class="empty-text">
          읽은 책을 한 권 꽂아보세요.
        </div>

      </div>

    `;

    return;

  }


  /*
    shelfList 전체 폭에서
    books-row의 좌우 padding
    10px씩 제외.
  */

  const availableWidth =
    Math.max(
      180,
      shelfList.clientWidth - 20
    );


  const shelves =
    packBooksIntoShelves(
      currentBooks,
      availableWidth
    );


  shelves.forEach(
    function(
      books,
      shelfIndex
    ) {

      const unit =
        document.createElement(
          "div"
        );


      unit.className =
        "shelf-unit";


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "books-row";


      books.forEach(
        function(book) {

          row.appendChild(
            createBook(
              book
            )
          );

        }
      );


      const board =
        document.createElement(
          "div"
        );


      board.className =
        "shelf-board";


      const number =
        document.createElement(
          "div"
        );


      number.className =
        "shelf-number";


      number.textContent =
        String(
          shelfIndex + 1
        )
        .padStart(
          2,
          "0"
        );


      unit.appendChild(
        row
      );


      unit.appendChild(
        board
      );


      unit.appendChild(
        number
      );


      shelfList.appendChild(
        unit
      );

    }
  );

}



/* =========================
   실제 두께 → 책등 너비
========================= */

function getBookWidth(
  book
) {

  const thickness =
    Number(
      book.bookThickness ||
      book.bookHeight ||
      0
    );


  if (
    thickness > 0
  ) {

    /*
      실제 mm 비율을 반영.

      예:
      10mm → 약 15px
      20mm → 약 30px
      30mm → 약 45px

      선반을 채운다고 억지로
      확대하지 않는다.
    */

    return clamp(
      Math.round(
        thickness * 1.5
      ),
      14,
      65
    );

  }


  /*
    YES24에서도 두께를
    얻지 못한 책의 기본값.
  */

  return 27;

}



/* =========================
   책 만들기
========================= */

function createBook(
  book
) {

  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "book";


  /*
    실제 두께 사용
  */

  button.style.width =
    getBookWidth(
      book
    ) +
    "px";


  button.style.height =
    getVisualHeight(
      book
    ) +
    "px";


  /*
    실제 책등 이미지
  */

  const image =
    document.createElement(
      "img"
    );


  image.referrerPolicy =
    "no-referrer";


  image.decoding =
    "async";


  /*
    1순위
    시트에 저장된 책등 URL

    2순위
    YES24 상품번호로 자동 생성한 URL
  */

  const spineUrl =
    book.spineUrl ||
    makeSpineUrl(
      book.itemId
    );


  if (spineUrl) {

    image.src =
      spineUrl;


    image.alt =
      (book.title || "") +
      " 책등";


    /*
      URL은 정상인데 YES24에서
      '이미지 준비중' 등의
      대체 이미지를 내려주는 경우.

      실제 책등과 너무 다른 비율이면
      가상 책등으로 변경한다.
    */

    image.addEventListener(
      "load",
      function() {

        const naturalWidth =
          image.naturalWidth;


        const naturalHeight =
          image.naturalHeight;


        if (
          !naturalWidth ||
          !naturalHeight
        ) {

          return;

        }


        const ratio =
          naturalWidth /
          naturalHeight;


        /*
          책등은 일반적으로 매우 길쭉한
          세로 이미지.

          정사각형이나 표지처럼 넓은 이미지는
          실제 책등이 아닐 가능성이 높다.
        */

        if (
          ratio > 0.58
        ) {

          showFallbackSpine(
            button,
            book
          );

        }

      }
    );


    /*
      이미지 자체가 없는 경우
    */

    image.addEventListener(
      "error",
      function() {

        const automaticUrl =
          makeSpineUrl(
            book.itemId
          );


        /*
          기존 저장 URL이 실패했고
          자동 /side URL과 다르면
          /side를 한 번 더 시도.
        */

        if (
          automaticUrl &&
          image.dataset.retry !== "1" &&
          normalizeUrl(
            image.src
          ) !==
          normalizeUrl(
            automaticUrl
          )
        ) {

          image.dataset.retry =
            "1";


          image.src =
            automaticUrl;


          return;

        }


        /*
          그것도 실패하면
          자동 디자인 책등.
        */

        showFallbackSpine(
          button,
          book
        );

      }
    );


    button.appendChild(
      image
    );


  } else {

    showFallbackSpine(
      button,
      book
    );

  }


  button.addEventListener(
    "click",
    function() {

      openDetail(
        book
      );

    }
  );


  return button;

}



/* =========================
   YES24 책등 자동 URL
========================= */

function makeSpineUrl(
  itemId
) {

  if (!itemId) {

    return "";

  }


  return (
    "https://image.yes24.com/goods/detail/" +
    encodeURIComponent(
      itemId
    ) +
    "/side"
  );

}



/* =========================
   실제 책등이 없는 경우
========================= */

function showFallbackSpine(
  button,
  book
) {

  button.innerHTML = "";


  /*
    현재 웹 색상과 어울리는
    자동 책등 팔레트.
  */

  const colors = [

    {
      background:
        "#0e4b37",

      text:
        "#f7f3e9"
    },

    {
      background:
        "#e8ddc4",

      text:
        "#20241f"
    },

    {
      background:
        "#d97968",

      text:
        "#20241f"
    },

    {
      background:
        "#e9b936",

      text:
        "#20241f"
    },

    {
      background:
        "#24362d",

      text:
        "#f7f3e9"
    },

    {
      background:
        "#eee9dc",

      text:
        "#0e4b37"
    }

  ];


  const colorIndex =
    getBookColorIndex(
      book,
      colors.length
    );


  const color =
    colors[
      colorIndex
    ];


  const fallback =
    document.createElement(
      "div"
    );


  fallback.className =
    "fallback-spine";


  fallback.style.background =
    color.background;


  fallback.style.color =
    color.text;


  const title =
    document.createElement(
      "span"
    );


  title.className =
    "fallback-title";


  title.textContent =
    book.title ||
    "BOOK";


  fallback.appendChild(
    title
  );


  button.appendChild(
    fallback
  );

}



/* =========================
   자동 책등 색상 고정
========================= */

function getBookColorIndex(
  book,
  length
) {

  const text =
    String(
      book.itemId ||
      book.title ||
      ""
    );


  let hash = 0;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    hash =
      (
        hash * 31 +
        text.charCodeAt(i)
      ) >>> 0;

  }


  return (
    hash %
    length
  );

}



/* =========================
   책 높이
========================= */

function getVisualHeight(
  book
) {

  /*
    현재는 화면에 판형 정보를
    표시하지 않는 방향이므로
    높이는 자연스럽게만 차이를 둔다.

    랜덤은 사용하지 않아
    새로고침해도 같은 책은
    항상 같은 높이.
  */

  const title =
    String(
      book.title ||
      ""
    );


  let value = 0;


  for (
    let i = 0;
    i < title.length;
    i++
  ) {

    value +=
      title.charCodeAt(i);

  }


  return (
    188 +
    (
      value %
      28
    )
  );

}

/* =========================
   상세 팝업
========================= */

async function openDetail(
  book
) {

  selectedBook =
    book;


  const cover =
    document.getElementById(
      "detailCover"
    );


  cover.referrerPolicy =
    "no-referrer";


  if (
    book.coverUrl
  ) {

    cover.src =
      book.coverUrl;


    cover.style.display =
      "block";


  } else {

    cover.removeAttribute(
      "src"
    );


    cover.style.display =
      "none";

  }


  document
    .getElementById(
      "detailTitle"
    )
    .textContent =
    book.title ||
    "";


  document
    .getElementById(
      "detailAuthor"
    )
    .textContent =
    book.author ||
    "";


  document
    .getElementById(
      "detailPublisher"
    )
    .textContent =
    book.publisher ||
    "";


  document
    .getElementById(
      "detailFinishDate"
    )
    .textContent =
    formatDate(
      book.finishDate
    );


  document
    .getElementById(
      "detailRating"
    )
    .textContent =
    makeStars(
      Number(
        book.rating ||
        0
      )
    );


  document
    .getElementById(
      "detailPublishDate"
    )
    .textContent =
    book.publishDate
      ? formatPublishDate(
          book.publishDate
        )
      : "-";


  document
    .getElementById(
      "detailPages"
    )
    .textContent =
    book.pages
      ? book.pages +
        "쪽"
      : "-";


  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "show"
    );


  /*
    현재 books 응답에
    출간일/페이지가 없는 경우
    YES24 상세 API로 보완한다.
  */

  if (
    !book.itemId ||
    (
      book.publishDate &&
      book.pages
    )
  ) {

    return;

  }


  try {

    const response =
      await fetch(
        API_URL +
        "?action=detail" +
        "&itemId=" +
        encodeURIComponent(
          book.itemId
        ) +
        "&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (
      !data.success ||
      !data.book
    ) {

      return;

    }


    const detail =
      data.book;


    /*
      나중에 수정 화면에서도
      활용할 수 있도록 메모리에 합침.
    */

    Object.assign(
      book,
      detail,
      {
        id:
          book.id,

        user:
          book.user,

        finishDate:
          book.finishDate,

        rating:
          book.rating
      }
    );


    document
      .getElementById(
        "detailPublishDate"
      )
      .textContent =
      formatPublishDate(
        detail.publishDate
      ) ||
      "-";


    document
      .getElementById(
        "detailPages"
      )
      .textContent =
      detail.pages
        ? detail.pages +
          "쪽"
        : "-";


  } catch (error) {

    console.error(
      error
    );

  }

}

document

  )
  .addEventListener(
    "click",
    async function() {

      if (
        !selectedBook
      ) {

        return;

      }


      const ok =
        confirm(
          "「" +
          (
            selectedBook.title ||
            "이 책"
          ) +
          "」 기록을 삭제할까요?"
        );


      if (!ok) {

        return;

      }


      try {

        const response =
          await fetch(
            API_URL,
            {

              method:
                "POST",


              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },


              body:
                JSON.stringify({

                  action:
                    "deleteBook",

                  id:
                    selectedBook.id

                })

            }
          );


        const data =
          JSON.parse(
            await response.text()
          );


        if (
          !data.success
        ) {

          throw new Error(
            data.message ||
            "삭제 실패"
          );

        }


        closeDetail();


        await loadBooks();


      } catch (error) {

        console.error(
          error
        );


        alert(
          "책 기록을 삭제하지 못했어요."
        );

      }

    }
  );

/* =========================
   HELPERS
========================= */

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}



function normalizeUrl(
  value
) {

  return String(
    value ||
    ""
  )
  .replace(
    /^https?:\/\//,
    ""
  )
  .replace(
    /\/+$/,
    ""
  );

}



function makeStars(
  value
) {

  let text = "";


  for (
    let i = 1;
    i <= 5;
    i++
  ) {

    text +=
      i <= value
        ? "★"
        : "☆";

  }


  return text;

}



function formatDate(
  value
) {

  if (!value) {

    return "-";

  }


  return String(
    value
  )
  .replace(
    /-/g,
    "."
  );

}



function formatPublishDate(
  value
) {

  if (!value) {

    return "";

  }


  const original =
    String(
      value
    );


  const text =
    original.replace(
      /\D/g,
      ""
    );


  if (
    text.length === 8
  ) {

    return (
      text.slice(
        0,
        4
      ) +
      "." +
      text.slice(
        4,
        6
      ) +
      "." +
      text.slice(
        6,
        8
      )
    );

  }


  return original;

}
