<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">

  <title>새 책 추가</title>

  <style>
    :root {
      --cream: #f6f2e9;
      --paper: #fffdf8;
      --green: #123d2b;
      --ink: #171b18;
      --muted: #77766e;
      --mustard: #e4b63d;
      --coral: #d98272;
      --line: rgba(23, 27, 24, .18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e9e6df;
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 45px;
      background: var(--cream);
    }

    .top {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 22px 22px 0;
    }

    .back {
      display: flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      text-decoration: none;
      font-size: 34px;
      font-weight: 300;
    }

    .top-title {
      color: var(--green);
      text-align: center;
      font-size: 16px;
      font-weight: 900;
    }

    .bookmark {
      justify-self: end;
      width: 22px;
      height: 31px;
      border: 2px solid var(--green);
      border-bottom: 0;
      position: relative;
    }

    .bookmark::after {
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: -9px;
      width: 14px;
      height: 14px;
      margin: auto;
      transform: rotate(45deg);
      border-right: 2px solid var(--green);
      border-bottom: 2px solid var(--green);
      background: var(--cream);
      content: "";
    }

    .content {
      padding: 55px 22px 0;
    }

    .step-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 17px;
      color: var(--green);
      font-size: 16px;
      font-weight: 900;
    }

    .step-number {
      padding-bottom: 3px;
      border-bottom: 3px solid var(--mustard);
    }

    .square-mark {
      width: 10px;
      height: 10px;
      background: var(--mustard);
    }

    .circle-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
    }

    /* 검색 */

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      min-width: 0;
      height: 52px;
      flex: 1;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      background: var(--paper);
      color: var(--ink);
    }

    .search-button {
      width: 74px;
      border: 0;
      background: var(--green);
      color: white;
      font-weight: 800;
    }

    .search-button:disabled {
      opacity: .5;
    }

    .results {
      margin-top: 13px;
      border: 1px solid var(--line);
      background: rgba(255,253,248,.5);
    }

    .results:empty {
      display: none;
    }

    .result {
      display: flex;
      width: 100%;
      gap: 13px;
      padding: 16px 13px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
    }

    .result:last-child {
      border-bottom: 0;
    }

    .result img {
      width: 53px;
      height: 76px;
      flex-shrink: 0;
      object-fit: cover;
      background: #e9e4d9;
    }

    .result-info {
      min-width: 0;
      flex: 1;
    }

    .result-title {
      margin: 2px 0 6px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.4;
    }

    .result-meta {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .result-plus {
      align-self: center;
      color: var(--green);
      font-family: Georgia, serif;
      font-size: 28px;
    }

    .search-status {
      padding: 21px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    /* Step 2 */

    .record-section {
      margin-top: 50px;
    }

    .selected {
      display: none;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .selected.show {
      display: flex;
    }

    .selected img {
      width: 70px;
      height: 101px;
      flex-shrink: 0;
      object-fit: cover;
      background: #e9e4da;
    }

    .selected-info {
      min-width: 0;
      flex: 1;
    }

    .selected-info h2 {
      margin: 0 0 7px;
      color: var(--green);
      font-family:
        Georgia,
        "Noto Serif KR",
        serif;
      font-size: 20px;
      line-height: 1.35;
    }

    .selected-info p {
      margin: 3px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .remove-book {
      align-self: flex-start;
      padding: 2px 5px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 23px;
    }

    .form {
      margin-top: 12px;
      padding: 18px 15px;
      border: 1px solid var(--line);
      background: rgba(255,253,248,.42);
    }

    .field {
      display: grid;
      grid-template-columns: 75px 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      height: 47px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      background: var(--paper);
      color: var(--ink);
    }

    .stars {
      display: flex;
      gap: 5px;
    }

    .star {
      padding: 0;
      border: 0;
      background: transparent;
      color: #b9b4aa;
      font-size: 31px;
      line-height: 1;
    }

    .star.active {
      color: var(--green);
    }

    .save {
      width: 100%;
      height: 57px;
      margin-top: 17px;
      border: 0;
      background: var(--green);
      color: white;
      font-size: 14px;
      font-weight: 900;
    }

    .save:disabled {
      opacity: .5;
    }

    .message {
      display: none;
      margin-top: 11px;
      padding: 12px;
      border-left: 5px solid var(--coral);
      background: rgba(217,130,114,.1);
      color: #7b433b;
      font-size: 12px;
    }
  </style>
</head>

<body>

<main class="app">

  <div class="top">

    <a
      class="back"
      id="back"
      href="./shelf.html"
    >
      ‹
    </a>

    <div
      class="top-title"
      id="topTitle"
    >
      새 책 추가
    </div>

    <div class="bookmark"></div>

  </div>


  <div class="content">

    <section
      id="searchSection"
    >

      <div class="step-title">

        <span class="step-number">
          STEP 1.
        </span>

        <span>
          책 검색
        </span>

        <span class="square-mark"></span>

      </div>

      <div class="search-row">

        <input
          class="search-input"
          id="query"
          type="search"
          placeholder="예: 채식주의자"
        >

        <button
          class="search-button"
          id="searchButton"
          type="button"
        >
          검색
        </button>

      </div>

      <div
        class="results"
        id="results"
      ></div>

    </section>


    <section class="record-section">

      <div class="step-title">

        <span class="step-number">
          STEP 2.
        </span>

        <span>
          기록하기
        </span>

        <span class="circle-mark"></span>

      </div>


      <div
        class="selected"
        id="selected"
      >

        <img
          id="selectedCover"
          referrerpolicy="no-referrer"
          alt="책 표지"
        >

        <div class="selected-info">

          <h2 id="selectedTitle"></h2>

          <p id="selectedAuthor"></p>

          <p id="selectedPublisher"></p>

          <p id="selectedMeta"></p>

        </div>

        <button
          class="remove-book"
          id="removeBook"
          type="button"
        >
          ×
        </button>

      </div>


      <div class="form">

        <div class="field">

          <label for="reader">
            읽은 사람
          </label>

          <select id="reader"></select>

        </div>

        <div class="field">

          <label for="finishDate">
            완독일
          </label>

          <input
            id="finishDate"
            type="date"
          >

        </div>

        <div class="field">

          <label>
            별점
          </label>

          <div class="stars">

            <button class="star" data-value="1" type="button">★</button>
            <button class="star" data-value="2" type="button">★</button>
            <button class="star" data-value="3" type="button">★</button>
            <button class="star" data-value="4" type="button">★</button>
            <button class="star" data-value="5" type="button">★</button>

          </div>

        </div>

      </div>


      <button
        class="save"
        id="saveButton"
        type="button"
      >
        책장에 꽂기
      </button>

      <div
        class="message"
        id="message"
      ></div>

    </section>

  </div>

</main>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


const params =
  new URLSearchParams(
    location.search
  );


const user =
  params.get("user") ||
  localStorage.getItem(
    "currentBookUser"
  ) ||
  "";


if (!user) {

  window.location.href =
    "./index.html";

}


localStorage.setItem(
  "currentBookUser",
  user
);


const isEdit =
  params.get("mode") ===
  "edit";


let selectedBook =
  null;


let editBook =
  null;


let rating =
  0;


document
  .getElementById("back")
  .href =
    "./shelf.html?user=" +
    encodeURIComponent(user);


setToday();

setupStars();

setupEdit();

loadUsers();


document
  .getElementById("searchButton")
  .onclick =
    searchBooks;


document
  .getElementById("query")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        searchBooks();

      }

    }
  );


document
  .getElementById("removeBook")
  .onclick =
    function() {

      if (isEdit) {
        return;
      }


      selectedBook =
        null;


      document
        .getElementById("selected")
        .classList.remove(
          "show"
        );

    };


document
  .getElementById("saveButton")
  .onclick =
    saveBook;


function setupEdit() {

  if (!isEdit) {
    return;
  }


  const stored =
    sessionStorage.getItem(
      "editBook"
    );


  if (!stored) {

    showMessage(
      "수정할 책 정보를 찾지 못했어요."
    );

    return;

  }


  try {

    editBook =
      JSON.parse(stored);


    selectedBook =
      { ...editBook };


    document
      .getElementById("topTitle")
      .textContent =
        "기록 수정";


    document
      .getElementById("searchSection")
      .style.display =
        "none";


    document
      .getElementById("removeBook")
      .style.display =
        "none";


    document
      .getElementById("saveButton")
      .textContent =
        "수정 내용 저장";


    document
      .getElementById("finishDate")
      .value =
        normalizeDate(
          editBook.finishDate
        );


    rating =
      Number(
        editBook.rating || 0
      );


    paintStars();

    showSelectedBook();


  } catch (error) {

    console.error(error);

  }

}


async function loadUsers() {

  const select =
    document.getElementById(
      "reader"
    );


  try {

    const response =
      await fetch(
        API_URL +
        "?action=users&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    select.innerHTML =
      "";


    (data.users || [])
      .forEach(
        function(item) {

          const name =
            typeof item === "string"
              ? item
              : item.name;


          if (!name) {
            return;
          }


          const option =
            document.createElement(
              "option"
            );


          option.value =
            name;


          option.textContent =
            name;


          const target =
            isEdit &&
            editBook
              ? editBook.user
              : user;


          if (
            name === target
          ) {

            option.selected =
              true;

          }


          select.appendChild(
            option
          );

        }
      );


    if (
      select.options.length === 0 &&
      user
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        user;


      option.textContent =
        user;


      select.appendChild(
        option
      );

    }


  } catch (error) {

    console.error(error);


    select.innerHTML =
      "";


    const option =
      document.createElement(
        "option"
      );


    option.value =
      user;


    option.textContent =
      user;


    select.appendChild(
      option
    );

  }

}


async function searchBooks() {

  const query =
    document
      .getElementById("query")
      .value
      .trim();


  if (!query) {

    showMessage(
      "책 제목을 입력해주세요."
    );

    return;

  }


  const results =
    document.getElementById(
      "results"
    );


  const searchButton =
    document.getElementById(
      "searchButton"
    );


  hideMessage();


  results.innerHTML = `
    <div class="search-status">
      YES24에서 찾는 중…
    </div>
  `;


  searchButton.disabled =
    true;


  try {

    const response =
      await fetch(
        API_URL +
        "?action=search&q=" +
        encodeURIComponent(query) +
        "&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    renderResults(
      data.books || []
    );


  } catch (error) {

    console.error(error);


    results.innerHTML = `
      <div class="search-status">
        검색하지 못했어요.
      </div>
    `;


  } finally {

    searchButton.disabled =
      false;

  }

}


function renderResults(books) {

  const results =
    document.getElementById(
      "results"
    );


  results.innerHTML =
    "";


  if (!books.length) {

    results.innerHTML = `
      <div class="search-status">
        검색 결과가 없어요.
      </div>
    `;

    return;

  }


  books.forEach(
    function(book) {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "result";


      const image =
        document.createElement(
          "img"
        );


      image.referrerPolicy =
        "no-referrer";


      image.src =
        book.coverUrl || "";


      image.alt =
        book.title || "";


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "result-info";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "result-title";


      title.textContent =
        book.title || "";


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "result-meta";


      let metaText =
        book.author || "";


      if (book.publisher) {

        metaText +=
          "  |  " +
          book.publisher;

      }


      if (
        book.publishDate ||
        book.pages
      ) {

        metaText +=
          "\n";


        if (book.publishDate) {

          metaText +=
            formatPublishDate(
              book.publishDate
            );

        }


        if (book.pages) {

          if (book.publishDate) {

            metaText +=
              "  |  ";

          }


          metaText +=
            book.pages +
            "쪽";

        }

      }


      meta.textContent =
        metaText;


      const plus =
        document.createElement(
          "div"
        );


      plus.className =
        "result-plus";


      plus.textContent =
        "+";


      info.appendChild(
        title
      );


      info.appendChild(
        meta
      );


      button.appendChild(
        image
      );


      button.appendChild(
        info
      );


      button.appendChild(
        plus
      );


      button.onclick =
        function() {

          selectedBook =
            { ...book };


          showSelectedBook();


          results.innerHTML =
            "";

        };


      results.appendChild(
        button
      );

    }
  );

}


function showSelectedBook() {

  if (!selectedBook) {
    return;
  }


  const cover =
    document.getElementById(
      "selectedCover"
    );


  cover.referrerPolicy =
    "no-referrer";


  cover.src =
    selectedBook.coverUrl ||
    "";


  document
    .getElementById("selectedTitle")
    .textContent =
      selectedBook.title ||
      "";


  document
    .getElementById("selectedAuthor")
    .textContent =
      selectedBook.author ||
      "";


  document
    .getElementById("selectedPublisher")
    .textContent =
      selectedBook.publisher ||
      "";


  let meta =
    "";


  if (
    selectedBook.publishDate
  ) {

    meta +=
      formatPublishDate(
        selectedBook.publishDate
      );

  }


  if (
    selectedBook.pages
  ) {

    if (meta) {

      meta +=
        "  |  ";

    }


    meta +=
      selectedBook.pages +
      "쪽";

  }


  document
    .getElementById("selectedMeta")
    .textContent =
      meta;


  document
    .getElementById("selected")
    .classList.add(
      "show"
    );

}


function setupStars() {

  document
    .querySelectorAll(
      ".star"
    )
    .forEach(
      function(button) {

        button.onclick =
          function() {

            rating =
              Number(
                button.dataset.value
              );


            paintStars();

          };

      }
    );

}


function paintStars() {

  document
    .querySelectorAll(
      ".star"
    )
    .forEach(
      function(button) {

        button.classList.toggle(
          "active",
          Number(
            button.dataset.value
          ) <= rating
        );

      }
    );

}


async function saveBook() {

  if (!selectedBook) {

    showMessage(
      "먼저 책을 선택해주세요."
    );

    return;

  }


  const reader =
    document
      .getElementById("reader")
      .value;


  const finishDate =
    document
      .getElementById("finishDate")
      .value;


  if (!reader) {

    showMessage(
      "읽은 사람을 선택해주세요."
    );

    return;

  }


  if (!finishDate) {

    showMessage(
      "완독일을 선택해주세요."
    );

    return;

  }


  if (!rating) {

    showMessage(
      "별점을 선택해주세요."
    );

    return;

  }


  hideMessage();


  const body = {

    action:
      isEdit
        ? "updateBook"
        : "saveBook",

    id:
      isEdit &&
      editBook
        ? editBook.id
        : "",

    user:
      reader,

    finishDate:
      finishDate,

    rating:
      rating,

    itemId:
      selectedBook.itemId ||
      "",

    title:
      selectedBook.title ||
      "",

    author:
      selectedBook.author ||
      "",

    publisher:
      selectedBook.publisher ||
      "",

    publishDate:
      selectedBook.publishDate ||
      "",

    pages:
      Number(
        selectedBook.pages ||
        0
      ),

    coverUrl:
      selectedBook.coverUrl ||
      "",

    spineUrl:
      selectedBook.spineUrl ||
      "",

    /*
     * 화면에는 판형을 표시하지 않지만
     * 책등 크기를 위해 저장은 유지
     */

    bookWidth:
      Number(
        selectedBook.bookWidth ||
        0
      ),

    bookLength:
      Number(
        selectedBook.bookLength ||
        0
      ),

    bookHeight:
      Number(
        selectedBook.bookHeight ||
        0
      )

  };


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled =
    true;


  button.textContent =
    isEdit
      ? "수정 중…"
      : "책장에 꽂는 중…";


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              body
            )
        }
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    sessionStorage.removeItem(
      "editBook"
    );


    localStorage.setItem(
      "currentBookUser",
      reader
    );


    const date =
      new Date(
        finishDate +
        "T12:00:00"
      );


    window.location.href =
      "./shelf.html?user=" +
      encodeURIComponent(reader) +
      "&year=" +
      date.getFullYear() +
      "&month=" +
      (
        date.getMonth() + 1
      );


  } catch (error) {

    console.error(error);


    showMessage(
      error.message ||
      "저장하지 못했어요."
    );


    button.disabled =
      false;


    button.textContent =
      isEdit
        ? "수정 내용 저장"
        : "책장에 꽂기";

  }

}


function setToday() {

  const today =
    new Date();


  document
    .getElementById("finishDate")
    .value =
      today.getFullYear() +
      "-" +
      String(
        today.getMonth() + 1
      ).padStart(
        2,
        "0"
      ) +
      "-" +
      String(
        today.getDate()
      ).padStart(
        2,
        "0"
      );

}


function normalizeDate(value) {

  if (!value) {
    return "";
  }


  const numbers =
    String(value)
      .match(/\d+/g);


  if (
    !numbers ||
    numbers.length < 3
  ) {

    return "";

  }


  return (
    numbers[0] +
    "-" +
    String(numbers[1])
      .padStart(2, "0") +
    "-" +
    String(numbers[2])
      .padStart(2, "0")
  );

}


function formatPublishDate(value) {

  const text =
    String(
      value || ""
    );


  if (
    /^\d{8}$/.test(text)
  ) {

    return (
      text.slice(0,4) +
      "." +
      text.slice(4,6) +
      "." +
      text.slice(6,8)
    );

  }


  return text;

}


function showMessage(text) {

  const message =
    document.getElementById(
      "message"
    );


  message.style.display =
    "block";


  message.textContent =
    text;

}


function hideMessage() {

  document
    .getElementById("message")
    .style.display =
      "none";

}

</script>
