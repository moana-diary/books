<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">

  <title>책 기록하기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
      background: #ebe6df;
      color: #433c37;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 40px;
      background:
        linear-gradient(
          #fbf9f5,
          #f2ede6
        );
    }

    .top {
      padding: 18px 20px 5px;
    }

    .back {
      display: flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: white;
      color: #665d56;
      text-decoration: none;
      font-size: 23px;
      box-shadow: 0 3px 12px rgba(57,45,36,.05);
    }

    .content {
      padding: 18px 20px;
    }

    .small {
      color: #a0978f;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    h1 {
      margin: 7px 0 8px;
      font-size: 29px;
      line-height: 1.3;
      letter-spacing: -1px;
    }

    .description {
      margin: 0 0 23px;
      color: #948b83;
      font-size: 13px;
      line-height: 1.6;
    }

    .card {
      margin-bottom: 14px;
      padding: 19px;
      border: 1px solid #e4ddd6;
      border-radius: 22px;
      background: #fffdfa;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      height: 50px;
      padding: 0 13px;
      border: 1px solid #ddd4cd;
      border-radius: 14px;
      outline: none;
      background: white;
      color: #433c37;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-button {
      width: 70px;
      flex-shrink: 0;
      border: 0;
      border-radius: 14px;
      background: #817168;
      color: white;
      font-weight: 800;
    }

    .search-button:disabled {
      opacity: .5;
    }

    .results {
      margin-top: 13px;
    }

    .result {
      display: flex;
      width: 100%;
      gap: 11px;
      padding: 11px 2px;
      border: 0;
      border-bottom: 1px solid #ebe4dd;
      background: transparent;
      text-align: left;
    }

    .result img {
      width: 48px;
      height: 69px;
      flex-shrink: 0;
      border-radius: 4px;
      background: #ece7e1;
      object-fit: cover;
    }

    .result-info {
      min-width: 0;
      flex: 1;
    }

    .result strong {
      display: block;
      margin: 3px 0 5px;
      font-size: 14px;
      line-height: 1.4;
    }

    .result span {
      color: #948a82;
      font-size: 11px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .status {
      padding: 17px 5px;
      color: #978e86;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    /* 선택된 책 */

    .selected {
      display: none;
      gap: 15px;
      align-items: center;
    }

    .selected.show {
      display: flex;
    }

    .selected img {
      width: 78px;
      height: 112px;
      flex-shrink: 0;
      border-radius: 5px;
      background: #ece7e1;
      object-fit: cover;
      box-shadow:
        0 5px 14px rgba(52,40,31,.1);
    }

    .selected-info {
      min-width: 0;
    }

    .selected h2 {
      margin: 0 0 6px;
      font-size: 18px;
      line-height: 1.4;
    }

    .selected p {
      margin: 3px 0;
      color: #928880;
      font-size: 12px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    /* 별점 */

    .stars {
      display: flex;
      gap: 4px;
    }

    .star {
      padding: 0;
      border: 0;
      background: transparent;
      color: #d0c7bd;
      font-size: 32px;
    }

    .star.active {
      color: #d29a43;
    }

    .save {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 17px;
      background: #817168;
      color: white;
      font-weight: 800;
      box-shadow:
        0 8px 20px rgba(67,50,40,.14);
    }

    .save:disabled {
      opacity: .5;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 13px;
      border-radius: 13px;
      background: #f5e8e5;
      color: #9a5b54;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<main class="app">

  <div class="top">

    <a
      class="back"
      id="back"
      href="./shelf.html"
    >
      ‹
    </a>

  </div>

  <section class="content">

    <div
      class="small"
      id="small"
    >
      ADD A BOOK
    </div>

    <h1 id="pageTitle">
      새 책을<br>
      책장에 꽂아요.
    </h1>

    <p class="description">
      YES24에서 책을 검색하고 완독일과 별점을 기록해주세요.
    </p>

    <!-- 검색 -->

    <section
      class="card"
      id="searchCard"
    >

      <label for="query">
        책 제목
      </label>

      <div class="search-row">

        <input
          id="query"
          type="search"
          placeholder="예: 채식주의자"
        >

        <button
          class="search-button"
          id="searchButton"
          type="button"
        >
          검색
        </button>

      </div>

      <div
        class="results"
        id="results"
      ></div>

    </section>


    <!-- 선택된 책 -->

    <section
      class="card selected"
      id="selected"
    >

      <img
        id="selectedCover"
        alt="책 표지"
        referrerpolicy="no-referrer"
      >

      <div class="selected-info">

        <h2 id="selectedTitle"></h2>

        <p id="selectedAuthor"></p>

        <p id="selectedPublisher"></p>

        <p id="selectedExtra"></p>

      </div>

    </section>


    <!-- 기록 -->

    <section class="card">

      <div class="field">

        <label for="reader">
          읽은 사람
        </label>

        <select id="reader"></select>

      </div>

      <div class="field">

        <label for="finishDate">
          완독일
        </label>

        <input
          id="finishDate"
          type="date"
        >

      </div>

      <div class="field">

        <label>
          별점
        </label>

        <div class="stars">

          <button class="star" data-value="1" type="button">★</button>
          <button class="star" data-value="2" type="button">★</button>
          <button class="star" data-value="3" type="button">★</button>
          <button class="star" data-value="4" type="button">★</button>
          <button class="star" data-value="5" type="button">★</button>

        </div>

      </div>

    </section>

    <button
      class="save"
      id="saveButton"
      type="button"
    >
      책장에 꽂기
    </button>

    <div
      class="message"
      id="message"
    ></div>

  </section>

</main>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


const params =
  new URLSearchParams(
    location.search
  );


const user =
  params.get("user") ||
  localStorage.getItem(
    "currentBookUser"
  ) ||
  "";


if (!user) {

  window.location.href =
    "./index.html";

}


localStorage.setItem(
  "currentBookUser",
  user
);


const isEdit =
  params.get("mode") ===
  "edit";


let selectedBook =
  null;


let editBook =
  null;


let rating =
  0;


document
  .getElementById("back")
  .href =
    "./shelf.html?user=" +
    encodeURIComponent(user);


/* =====================
   오늘 날짜
===================== */

setToday();


/* =====================
   수정모드
===================== */

setupEdit();


/* =====================
   사용자
===================== */

loadUsers();


/* =====================
   검색 버튼
===================== */

document
  .getElementById("searchButton")
  .onclick =
    searchBooks;


document
  .getElementById("query")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        searchBooks();

      }

    }
  );


/* =====================
   별점
===================== */

document
  .querySelectorAll(".star")
  .forEach(
    function(button) {

      button.onclick =
        function() {

          rating =
            Number(
              button.dataset.value
            );


          paintStars();

        };

    }
  );


/* =====================
   저장
===================== */

document
  .getElementById("saveButton")
  .onclick =
    saveBook;


/* =====================
   수정 초기화
===================== */

function setupEdit() {

  if (!isEdit) {
    return;
  }


  const stored =
    sessionStorage.getItem(
      "editBook"
    );


  if (!stored) {

    showMessage(
      "수정할 책 정보를 찾지 못했어요."
    );

    return;

  }


  try {

    editBook =
      JSON.parse(stored);


    selectedBook =
      { ...editBook };


    document
      .getElementById("small")
      .textContent =
        "EDIT BOOK";


    document
      .getElementById("pageTitle")
      .innerHTML =
        "책 기록을<br>수정해요.";


    /*
     * 수정 때는 책 검색할 필요 없음
     */

    document
      .getElementById("searchCard")
      .style.display =
        "none";


    document
      .getElementById("saveButton")
      .textContent =
        "수정 내용 저장";


    document
      .getElementById("finishDate")
      .value =
        normalizeDate(
          editBook.finishDate
        );


    rating =
      Number(
        editBook.rating || 0
      );


    paintStars();

    showSelectedBook();


  } catch (error) {

    console.error(error);

  }

}


/* =====================
   사용자 목록
===================== */

async function loadUsers() {

  const select =
    document.getElementById(
      "reader"
    );


  try {

    const response =
      await fetch(
        API_URL +
        "?action=users&t=" +
        Date.now()
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    select.innerHTML =
      "";


    (data.users || [])
      .forEach(
        function(item) {

          const name =
            typeof item === "string"
              ? item
              : item.name;


          if (!name) {
            return;
          }


          const option =
            document.createElement(
              "option"
            );


          option.value =
            name;


          option.textContent =
            name;


          const target =
            isEdit &&
            editBook
              ? editBook.user
              : user;


          if (name === target) {

            option.selected =
              true;

          }


          select.appendChild(
            option
          );

        }
      );


    /*
     * 사용자 목록이 비었는데
     * 현재 사용자 값은 있다면 추가
     */

    if (
      select.options.length === 0 &&
      user
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        user;


      option.textContent =
        user;


      select.appendChild(
        option
      );

    }


  } catch (error) {

    console.error(error);


    select.innerHTML =
      "";


    if (user) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        user;


      option.textContent =
        user;


      select.appendChild(
        option
      );

    }

  }

}


/* =====================
   YES24 검색
===================== */

async function searchBooks() {

  const query =
    document
      .getElementById("query")
      .value
      .trim();


  if (!query) {

    showMessage(
      "책 제목을 입력해주세요."
    );

    return;

  }


  const results =
    document.getElementById(
      "results"
    );


  const searchButton =
    document.getElementById(
      "searchButton"
    );


  results.innerHTML = `
    <div class="status">
      YES24에서 책을 찾고 있어요…
    </div>
  `;


  searchButton.disabled =
    true;


  try {

    const response =
      await fetch(
        API_URL +
        "?action=search&q=" +
        encodeURIComponent(query) +
        "&t=" +
        Date.now()
      );


    const text =
      await response.text();


    const data =
      JSON.parse(text);


    if (!data.success) {

      throw new Error(
        data.message ||
        "검색에 실패했습니다."
      );

    }


    renderResults(
      data.books || []
    );


  } catch (error) {

    console.error(error);


    results.innerHTML = `
      <div class="status">
        검색하지 못했어요.<br>
        ${escapeHtml(error.message || "")}
      </div>
    `;


  } finally {

    searchButton.disabled =
      false;

  }

}


/* =====================
   검색 결과
===================== */

function renderResults(books) {

  const results =
    document.getElementById(
      "results"
    );


  results.innerHTML =
    "";


  if (!books.length) {

    results.innerHTML = `
      <div class="status">
        검색 결과가 없어요.
      </div>
    `;

    return;

  }


  books.forEach(
    function(book) {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "result";


      const image =
        document.createElement(
          "img"
        );


      image.referrerPolicy =
        "no-referrer";


      image.src =
        book.coverUrl || "";


      image.alt =
        book.title || "";


      const infoWrap =
        document.createElement(
          "div"
        );


      infoWrap.className =
        "result-info";


      const title =
        document.createElement(
          "strong"
        );


      title.textContent =
        book.title || "";


      const meta =
        document.createElement(
          "span"
        );


      let text =
        book.author || "";


      if (book.publisher) {

        text +=
          " · " +
          book.publisher;

      }


      if (book.publishDate) {

        text +=
          "\n" +
          formatPublishDate(
            book.publishDate
          );

      }


      if (book.pages) {

        text +=
          " · " +
          book.pages +
          "쪽";

      }


      meta.textContent =
        text;


      infoWrap.appendChild(
        title
      );


      infoWrap.appendChild(
        meta
      );


      button.appendChild(
        image
      );


      button.appendChild(
        infoWrap
      );


      button.onclick =
        function() {

          selectedBook =
            { ...book };


          showSelectedBook();


          results.innerHTML =
            "";

        };


      results.appendChild(
        button
      );

    }
  );

}


/* =====================
   선택한 책 표시
===================== */

function showSelectedBook() {

  if (!selectedBook) {
    return;
  }


  const cover =
    document.getElementById(
      "selectedCover"
    );


  cover.referrerPolicy =
    "no-referrer";


  cover.src =
    selectedBook.coverUrl ||
    "";


  document
    .getElementById("selectedTitle")
    .textContent =
      selectedBook.title ||
      "";


  document
    .getElementById("selectedAuthor")
    .textContent =
      selectedBook.author ||
      "";


  document
    .getElementById("selectedPublisher")
    .textContent =
      selectedBook.publisher ||
      "";


  let extra =
    formatPublishDate(
      selectedBook.publishDate
    );


  if (selectedBook.pages) {

    if (extra) {
      extra += " · ";
    }

    extra +=
      selectedBook.pages +
      "쪽";

  }


  document
    .getElementById("selectedExtra")
    .textContent =
      extra;


  document
    .getElementById("selected")
    .classList.add(
      "show"
    );

}


/* =====================
   별점 표시
===================== */

function paintStars() {

  document
    .querySelectorAll(".star")
    .forEach(
      function(button) {

        button.classList.toggle(
          "active",
          Number(
            button.dataset.value
          ) <= rating
        );

      }
    );

}


/* =====================
   저장
===================== */

async function saveBook() {

  if (!selectedBook) {

    showMessage(
      "먼저 책을 검색해서 선택해주세요."
    );

    return;

  }


  const reader =
    document
      .getElementById("reader")
      .value;


  const finishDate =
    document
      .getElementById("finishDate")
      .value;


  if (!reader) {

    showMessage(
      "읽은 사람을 선택해주세요."
    );

    return;

  }


  if (!finishDate) {

    showMessage(
      "완독일을 선택해주세요."
    );

    return;

  }


  if (!rating) {

    showMessage(
      "별점을 선택해주세요."
    );

    return;

  }


  const body = {

    action:
      isEdit
        ? "updateBook"
        : "saveBook",

    id:
      isEdit &&
      editBook
        ? editBook.id
        : "",

    user:
      reader,

    finishDate:
      finishDate,

    rating:
      rating,

    itemId:
      selectedBook.itemId ||
      "",

    title:
      selectedBook.title ||
      "",

    author:
      selectedBook.author ||
      "",

    publisher:
      selectedBook.publisher ||
      "",

    publishDate:
      selectedBook.publishDate ||
      "",

    pages:
      Number(
        selectedBook.pages || 0
      ),

    coverUrl:
      selectedBook.coverUrl ||
      "",

    spineUrl:
      selectedBook.spineUrl ||
      "",

    bookWidth:
      Number(
        selectedBook.bookWidth ||
        0
      ),

    bookLength:
      Number(
        selectedBook.bookLength ||
        0
      ),

    bookHeight:
      Number(
        selectedBook.bookHeight ||
        0
      )

  };


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    isEdit
      ? "수정 중…"
      : "책장에 꽂는 중…";


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              body
            )
        }
      );


    const data =
      JSON.parse(
        await response.text()
      );


    if (!data.success) {

      throw new Error(
        data.message ||
        "저장에 실패했습니다."
      );

    }


    sessionStorage.removeItem(
      "editBook"
    );


    localStorage.setItem(
      "currentBookUser",
      reader
    );


    const date =
      new Date(
        finishDate +
        "T12:00:00"
      );


    window.location.href =
      "./shelf.html?user=" +
      encodeURIComponent(reader) +
      "&year=" +
      date.getFullYear() +
      "&month=" +
      (
        date.getMonth() + 1
      );


  } catch (error) {

    console.error(error);


    showMessage(
      error.message ||
      "저장하지 못했어요."
    );


    saveButton.disabled =
      false;


    saveButton.textContent =
      isEdit
        ? "수정 내용 저장"
        : "책장에 꽂기";

  }

}


/* =====================
   기타
===================== */

function setToday() {

  const today =
    new Date();


  document
    .getElementById("finishDate")
    .value =
      today.getFullYear() +
      "-" +
      String(
        today.getMonth() + 1
      ).padStart(
        2,
        "0"
      ) +
      "-" +
      String(
        today.getDate()
      ).padStart(
        2,
        "0"
      );

}


function normalizeDate(value) {

  if (!value) {
    return "";
  }


  const numbers =
    String(value)
      .match(/\d+/g);


  if (
    !numbers ||
    numbers.length < 3
  ) {

    return "";

  }


  return (
    numbers[0] +
    "-" +
    String(
      numbers[1]
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      numbers[2]
    ).padStart(
      2,
      "0"
    )
  );

}


function formatPublishDate(value) {

  const text =
    String(
      value || ""
    );


  if (
    /^\d{8}$/.test(text)
  ) {

    return (
      text.slice(0,4) +
      "." +
      text.slice(4,6) +
      "." +
      text.slice(6,8)
    );

  }


  return text;

}


function showMessage(text) {

  const message =
    document.getElementById(
      "message"
    );


  message.style.display =
    "block";


  message.textContent =
    text;

}


function escapeHtml(value) {

  return String(
    value || ""
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
