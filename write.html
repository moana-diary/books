<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>새 책 꽂기</title>

<style>

:root {
  --cream: #f7f3e9;
  --paper: #fffdf7;
  --green: #0e4b37;
  --ink: #20241f;
  --muted: #77766e;
  --yellow: #e9b936;
  --coral: #d97968;
  --line: #ded8ca;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ebe8e0;
  color: var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Apple SD Gothic Neo",
    sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 27px 24px 60px;
  background: var(--cream);
}


/* HEADER */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.back {
  width: 45px;
  height: 45px;
  padding: 0;
  border: 1px solid var(--green);
  border-radius: 50%;
  background: transparent;
  color: var(--green);
  font-size: 27px;
}

.header-mark {
  display: flex;
  gap: 7px;
}

.circle {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--yellow);
}

.square {
  width: 16px;
  height: 16px;
  background: var(--green);
}


/* TITLE */

.title-area {
  margin-top: 54px;
}

.eyebrow {
  color: var(--green);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 3px;
}

h1 {
  margin: 9px 0 0;
  color: var(--green);
  font-size: 42px;
  line-height: 1;
  letter-spacing: -3px;
}

.subtitle {
  margin: 13px 0 0;
  color: var(--muted);
  font-size: 14px;
}


/* SEARCH */

.search-area {
  display: flex;
  gap: 7px;
  margin-top: 34px;
}

.search-area input {
  min-width: 0;
  flex: 1;
  height: 53px;
  padding: 0 15px;
  border: 1px solid var(--green);
  border-radius: 0;
  outline: none;
  background: var(--paper);
  font-size: 16px;
}

.search-area button {
  width: 75px;
  border: 0;
  background: var(--green);
  color: white;
  font-weight: 800;
}


/* RESULTS */

.results {
  margin-top: 13px;
}

.result {
  display: grid;
  grid-template-columns: 62px 1fr;
  gap: 14px;
  width: 100%;
  padding: 13px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: left;
}

.result img {
  width: 62px;
  height: 88px;
  object-fit: cover;
  background: #e8e3d7;
}

.result-title {
  margin-top: 3px;
  font-size: 16px;
  font-weight: 900;
  line-height: 1.35;
}

.result-meta {
  margin-top: 7px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.message {
  padding: 24px 0;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}


/* SELECTED */

.selected {
  display: none;
  margin-top: 28px;
}

.selected.show {
  display: block;
}

.selected-book {
  display: grid;
  grid-template-columns: 91px 1fr;
  gap: 18px;
  padding-bottom: 26px;
  border-bottom: 1px solid var(--line);
}

.selected-book img {
  width: 91px;
  height: 132px;
  object-fit: cover;
  background: #e7e1d4;
}

.selected-title {
  margin: 7px 0 0;
  font-size: 22px;
  font-weight: 900;
  line-height: 1.25;
}

.selected-author {
  margin-top: 9px;
  color: #595b55;
  font-size: 14px;
}

.selected-publisher {
  margin-top: 5px;
  color: var(--muted);
  font-size: 13px;
}


/* FORM */

.form {
  margin-top: 28px;
}

.field {
  margin-bottom: 24px;
}

.field label {
  display: block;
  margin-bottom: 9px;
  color: var(--green);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1px;
}

.field select,
.field input {
  width: 100%;
  height: 51px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 0;
  outline: none;
  background: var(--paper);
  font-size: 16px;
}


/* STAR */

.stars {
  display: flex;
  gap: 4px;
}

.star {
  padding: 0;
  border: 0;
  background: transparent;
  color: #d7d1c4;
  font-size: 39px;
  line-height: 1;
}

.star.on {
  color: var(--yellow);
}


/* SAVE */

.save {
  width: 100%;
  height: 58px;
  margin-top: 12px;
  border: 0;
  background: var(--green);
  color: white;
  font-size: 16px;
  font-weight: 900;
}

.cancel-edit {
  width: 100%;
  height: 50px;
  margin-top: 8px;
  border: 1px solid var(--green);
  background: transparent;
  color: var(--green);
  font-weight: 800;
}

</style>

</head>


<body>

<main class="app">

  <header class="header">

    <button
      class="back"
      id="backButton"
      type="button"
    >
      ‹
    </button>

    <div class="header-mark">
      <span class="circle"></span>
      <span class="square"></span>
    </div>

  </header>


  <section class="title-area">

    <div class="eyebrow">
      ADD TO SHELF
    </div>

    <h1 id="pageTitle">
      새 책 꽂기
    </h1>

    <p class="subtitle">
      읽은 책을 검색해서 책장에 꽂아보세요.
    </p>

  </section>


  <section id="searchSection">

    <div class="search-area">

      <input
        id="searchInput"
        type="search"
        placeholder="책 제목을 입력하세요"
      >

      <button
        id="searchButton"
        type="button"
      >
        검색
      </button>

    </div>

    <div
      class="results"
      id="results"
    ></div>

  </section>


  <section
    class="selected"
    id="selectedSection"
  >

    <div class="selected-book">

      <img
        id="selectedCover"
        alt=""
      >

      <div>

        <div
          class="selected-title"
          id="selectedTitle"
        ></div>

        <div
          class="selected-author"
          id="selectedAuthor"
        ></div>

        <div
          class="selected-publisher"
          id="selectedPublisher"
        ></div>

      </div>

    </div>


    <div class="form">

      <div class="field">

        <label for="userSelect">
          READER
        </label>

        <select id="userSelect"></select>

      </div>


      <div class="field">

        <label for="finishDate">
          FINISHED
        </label>

        <input
          id="finishDate"
          type="date"
        >

      </div>


      <div class="field">

        <label>
          MY RATING
        </label>

        <div
          class="stars"
          id="stars"
        >

          <button
            type="button"
            class="star"
            data-value="1"
          >★</button>

          <button
            type="button"
            class="star"
            data-value="2"
          >★</button>

          <button
            type="button"
            class="star"
            data-value="3"
          >★</button>

          <button
            type="button"
            class="star"
            data-value="4"
          >★</button>

          <button
            type="button"
            class="star"
            data-value="5"
          >★</button>

        </div>

      </div>


      <button
        class="save"
        id="saveButton"
        type="button"
      >
        책장에 꽂기
      </button>

      <button
        class="cancel-edit"
        id="cancelButton"
        type="button"
      >
        취소
      </button>

    </div>

  </section>

</main>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw-cPd8n-ccEu1m2q7lam22zmIcsmR83jL5AAJHEaNrYvqsZ7NbryXt0jBDxIwiTOze/exec";


const params =
  new URLSearchParams(
    window.location.search
  );

const mode =
  params.get("mode") || "new";

const urlUser =
  params.get("user") ||
  localStorage.getItem("currentBookUser") ||
  "";

let selectedBook = null;
let rating = 5;
let editBook = null;


const searchSection =
  document.getElementById(
    "searchSection"
  );

const selectedSection =
  document.getElementById(
    "selectedSection"
  );

const results =
  document.getElementById(
    "results"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );


init();


async function init() {

  setToday();

  await loadUsers();

  setRating(5);

  if (mode === "edit") {

    const stored =
      sessionStorage.getItem(
        "selectedBook"
      );

    if (stored) {

      try {

        editBook =
          JSON.parse(stored);

        selectedBook = {
          itemId:
            editBook.itemId || "",

          title:
            editBook.title || "",

          author:
            editBook.author || "",

          publisher:
            editBook.publisher || "",

          isbn13:
            editBook.isbn13 || "",

          coverUrl:
            editBook.coverUrl || "",

          spineUrl:
            editBook.spineUrl || "",

          bookHeight:
            Number(
              editBook.bookThickness ||
              editBook.bookHeight ||
              0
            )
        };

        document
          .getElementById("pageTitle")
          .textContent =
          "책 기록 수정";

        searchSection.style.display =
          "none";

        showSelected();

        document
          .getElementById("finishDate")
          .value =
          normalizeDate(
            editBook.finishDate
          );

        setRating(
          Number(editBook.rating || 0)
        );

      } catch (error) {

        console.error(error);

      }

    }

  }

}


function setToday() {

  const now = new Date();

  const y =
    now.getFullYear();

  const m =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      now.getDate()
    ).padStart(2, "0");

  document
    .getElementById("finishDate")
    .value =
    y + "-" + m + "-" + d;

}


async function loadUsers() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=users&t=" +
        Date.now()
      );

    const data =
      JSON.parse(
        await response.text()
      );

    const select =
      document.getElementById(
        "userSelect"
      );

    select.innerHTML = "";

    (data.users || [])
      .forEach(function(user) {

        const name =
          typeof user === "string"
            ? user
            : user.name;

        if (!name) return;

        const option =
          document.createElement(
            "option"
          );

        option.value = name;
        option.textContent = name;

        if (name === urlUser) {
          option.selected = true;
        }

        select.appendChild(option);

      });

  } catch (error) {

    console.error(error);

  }

}


document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    searchBooks
  );


searchInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();
      searchBooks();

    }

  }
);


async function searchBooks() {

  const q =
    searchInput.value.trim();

  if (!q) {
    return;
  }

  results.innerHTML =
    '<div class="message">검색 중…</div>';

  try {

    const response =
      await fetch(
        API_URL +
        "?action=search&q=" +
        encodeURIComponent(q) +
        "&t=" +
        Date.now()
      );

    const data =
      JSON.parse(
        await response.text()
      );

    if (!data.success) {
      throw new Error(
        data.message || "검색 실패"
      );
    }

    renderResults(
      data.books || []
    );

  } catch (error) {

    console.error(error);

    results.innerHTML =
      '<div class="message">검색하지 못했어요.</div>';

  }

}


function renderResults(books) {

  results.innerHTML = "";

  if (!books.length) {

    results.innerHTML =
      '<div class="message">검색 결과가 없어요.</div>';

    return;

  }

  books.forEach(function(book) {

    const button =
      document.createElement(
        "button"
      );

    button.type = "button";
    button.className = "result";

    const img =
      document.createElement("img");

    img.src =
      book.coverUrl || "";

    img.alt =
      book.title || "";

    const text =
      document.createElement("div");

    const title =
      document.createElement("div");

    title.className =
      "result-title";

    title.textContent =
      book.title || "";


    const meta =
      document.createElement("div");

    meta.className =
      "result-meta";

    meta.textContent =
      [
        book.author,
        book.publisher
      ]
      .filter(Boolean)
      .join(" · ");


    text.appendChild(title);
    text.appendChild(meta);

    button.appendChild(img);
    button.appendChild(text);


    button.addEventListener(
      "click",
      function() {

        selectBook(book);

      }
    );


    results.appendChild(button);

  });

}


async function selectBook(book) {

  /*
    검색 결과에도 두께가 들어오지만
    상세 API에 값이 더 정확히 들어오는
    경우가 있어서 한 번 확인한다.
  */

  selectedBook = {
    ...book
  };

  showSelected();

  if (!book.itemId) {
    return;
  }

  try {

    const response =
      await fetch(
        API_URL +
        "?action=detail&itemId=" +
        encodeURIComponent(
          book.itemId
        ) +
        "&t=" +
        Date.now()
      );

    const data =
      JSON.parse(
        await response.text()
      );

    if (
      data.success &&
      data.book
    ) {

      selectedBook = {
        ...selectedBook,
        ...data.book
      };

      showSelected();

    }

  } catch (error) {

    console.error(error);

  }

}


function showSelected() {

  if (!selectedBook) return;

  selectedSection
    .classList
    .add("show");

  document
    .getElementById(
      "selectedCover"
    )
    .src =
    selectedBook.coverUrl || "";

  document
    .getElementById(
      "selectedTitle"
    )
    .textContent =
    selectedBook.title || "";

  document
    .getElementById(
      "selectedAuthor"
    )
    .textContent =
    selectedBook.author || "";

  document
    .getElementById(
      "selectedPublisher"
    )
    .textContent =
    selectedBook.publisher || "";

}


document
  .querySelectorAll(".star")
  .forEach(function(button) {

    button.addEventListener(
      "click",
      function() {

        setRating(
          Number(
            button.dataset.value
          )
        );

      }
    );

  });


function setRating(value) {

  rating =
    Math.max(
      0,
      Math.min(5, value)
    );

  document
    .querySelectorAll(".star")
    .forEach(function(button) {

      const value =
        Number(
          button.dataset.value
        );

      button.classList.toggle(
        "on",
        value <= rating
      );

    });

}


document
  .getElementById("saveButton")
  .addEventListener(
    "click",
    saveBook
  );


async function saveBook() {

  if (!selectedBook) {

    alert("책을 먼저 선택해주세요.");
    return;

  }

  const user =
    document
      .getElementById(
        "userSelect"
      )
      .value;

  const finishDate =
    document
      .getElementById(
        "finishDate"
      )
      .value;

  if (!user) {

    alert("사용자를 선택해주세요.");
    return;

  }

  if (!finishDate) {

    alert("완독일을 선택해주세요.");
    return;

  }


  const body = {

    action:
      mode === "edit"
        ? "updateBook"
        : "saveBook",

    user:
      user,

    finishDate:
      finishDate,

    title:
      selectedBook.title || "",

    author:
      selectedBook.author || "",

    publisher:
      selectedBook.publisher || "",

    isbn13:
      selectedBook.isbn13 || "",

    itemId:
      selectedBook.itemId || "",

    coverUrl:
      selectedBook.coverUrl || "",

    spineUrl:
      selectedBook.spineUrl ||
      makeSpineUrl(
        selectedBook.itemId
      ),

    rating:
      rating,

    /*
      화면에는 판형을 보여주지 않는다.
      책장 너비 계산을 위해 두께만 저장.
    */
    bookThickness:
      Number(
        selectedBook.bookHeight ||
        selectedBook.bookThickness ||
        0
      )

  };


  if (
    mode === "edit" &&
    editBook
  ) {

    body.id =
      editBook.id;

  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );

  saveButton.disabled = true;
  saveButton.textContent =
    "저장 중…";


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(body)
        }
      );

    const data =
      JSON.parse(
        await response.text()
      );

    if (!data.success) {

      throw new Error(
        data.message ||
        "저장 실패"
      );

    }

    sessionStorage.removeItem(
      "selectedBook"
    );

    localStorage.setItem(
      "currentBookUser",
      user
    );

    window.location.href =
      "./shelf.html?user=" +
      encodeURIComponent(user);

  } catch (error) {

    console.error(error);

    alert(
      "책을 저장하지 못했어요."
    );

    saveButton.disabled = false;

    saveButton.textContent =
      mode === "edit"
        ? "수정 저장"
        : "책장에 꽂기";

  }

}


function makeSpineUrl(itemId) {

  if (!itemId) return "";

  return (
    "https://image.yes24.com/goods/detail/" +
    encodeURIComponent(itemId) +
    "/side"
  );

}


function normalizeDate(value) {

  if (!value) return "";

  return String(value)
    .replace(/\./g, "-")
    .replace(/\//g, "-")
    .slice(0, 10);

}


function goBack() {

  window.location.href =
    "./shelf.html?user=" +
    encodeURIComponent(urlUser);

}


document
  .getElementById("backButton")
  .addEventListener(
    "click",
    goBack
  );


document
  .getElementById("cancelButton")
  .addEventListener(
    "click",
    goBack
  );

</script>

</body>
</html>
